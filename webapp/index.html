<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070b16" />
  <title>Revilend Games</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #070b16;
      --bg-soft: #0d1324;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-strong: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f2f4fb;
      --muted: #98a1bb;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --on-accent: #0a0f1f;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --radius: 20px;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
    }

    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(139, 92, 246, 0.28), transparent 65%),
        radial-gradient(700px 380px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 60%),
        var(--bg);
    }

    #app {
      max-width: 620px;
      margin: 0 auto;
      padding: calc(18px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
      min-height: 100vh;
    }

    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; line-height: 1.5; }

    /* ---------- Brand / header ---------- */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand-left { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--on-accent);
      box-shadow: 0 8px 22px rgba(139, 92, 246, 0.35);
    }

    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }

    .profile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      max-width: 46%;
    }

    .profile-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #a855f7);
    }

    .avatar.sm { width: 40px; height: 40px; min-width: 40px; font-size: 13px; }

    /* ---------- Hub ---------- */
    .hero { margin-bottom: 22px; }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent-2);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .hero h1 {
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.6px;
      margin-bottom: 10px;
    }

    .hero p { color: var(--muted); font-size: 14px; line-height: 1.55; }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 24px 2px 12px;
    }

    .section-title h2 { font-size: 16px; letter-spacing: -0.2px; }
    .section-title span { font-size: 12px; color: var(--muted); }

    .game-card {
      position: relative;
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
    }

    .game-card.active { border-color: rgba(139, 92, 246, 0.45); box-shadow: 0 14px 34px rgba(88, 51, 189, 0.18); }
    .game-card.active::after {
      content: "";
      position: absolute;
      inset: auto -40px -70px auto;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
      pointer-events: none;
    }

    .game-icon {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
    }

    .game-body { flex: 1; min-width: 0; }
    .game-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .game-name { font-weight: 700; font-size: 16px; }

    .game-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .game-meta { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 0.3px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge.live { background: rgba(52, 211, 153, 0.14); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge.soon { background: rgba(255, 255, 255, 0.06); color: var(--muted); border: 1px solid var(--border); }
    .badge.host { background: rgba(251, 191, 36, 0.14); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge.me { background: rgba(34, 211, 238, 0.13); color: var(--accent-2); border: 1px solid rgba(34, 211, 238, 0.3); }

    .play-btn {
      flex: 0 0 auto;
      border: 0;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--on-accent);
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
    }

    .play-btn[disabled] { cursor: default; color: var(--muted); background: rgba(255, 255, 255, 0.06); }

    .panel {
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .panel h2 { font-size: 15px; margin-bottom: 12px; }

    .join-form { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
    }

    input[type="text"]:focus { border-color: rgba(139, 92, 246, 0.7); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    input::placeholder { letter-spacing: 2px; color: #5c6580; }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      background: var(--panel-strong);
      border: 1px solid var(--border);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn:active { transform: scale(0.98); }
    .btn[disabled] { opacity: 0.45; cursor: default; }

    .btn.primary {
      color: var(--on-accent);
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      border: 0;
    }

    .btn.danger { color: #1a0505; background: linear-gradient(135deg, #fca5a5, #f87171); border: 0; }
    .btn.block { width: 100%; }
    .btn.small { padding: 9px 12px; font-size: 12px; border-radius: 11px; }

    .footer { margin-top: 26px; text-align: center; font-size: 11px; color: #5f6884; letter-spacing: 0.5px; }

    /* ---------- Kunlik bonus, missiyalar, reyting ---------- */
    .panel.bonus-card {
      margin-top: 0;
      background:
        radial-gradient(260px 120px at 100% 0%, rgba(251, 191, 36, 0.18), transparent 70%),
        var(--panel);
      border-color: rgba(251, 191, 36, 0.28);
    }
    .bonus-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .bonus-days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .bonus-day {
      font-size: 10px; font-weight: 700; color: var(--muted);
      padding: 5px 7px; border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(148, 163, 184, 0.08);
    }
    .bonus-day.now {
      color: #bae6fd; border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
    }
    .bonus-head h2 { margin-bottom: 4px; }
    .mission-list { display: flex; flex-direction: column; gap: 8px; }
    .mission {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      border-radius: 15px; background: var(--panel); border: 1px solid var(--border);
    }
    .mission.ready { border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }
    .mission .m-emoji { font-size: 20px; width: 28px; text-align: center; }
    .mission .m-body { flex: 1; min-width: 0; }
    .m-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
    .m-title .m-reward { font-size: 11px; color: var(--warning); white-space: nowrap; }
    .m-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .m-bar { margin-top: 6px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
    .m-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .m-progress { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .mission .btn.small { flex: 0 0 auto; }
    .top-list { display: flex; flex-direction: column; gap: 6px; }
    .top-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
    }
    .top-row.me { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.14); }
    .top-rank { width: 22px; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
    .top-row .t-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-row .t-rating { font-size: 11px; color: var(--warning); white-space: nowrap; }
    .promo-row { display: flex; gap: 8px; margin-top: 14px; }
    .promo-row input { letter-spacing: 0; text-transform: uppercase; padding: 12px 14px; font-size: 14px; }
    .promo-row .btn { flex: 0 0 auto; }

    /* ---------- Room ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0 14px;
      background: linear-gradient(180deg, var(--bg) 55%, rgba(7, 11, 22, 0.85) 100%);
      backdrop-filter: blur(12px);
    }

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
    }

    .room-id { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .room-code { font-weight: 800; letter-spacing: 2px; font-size: 16px; }

    .status-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .status-pill.PLAYING { color: var(--success); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }
    .status-pill.VOTING { color: var(--warning); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.1); }
    .status-pill.FINISHED { color: var(--accent-2); border-color: rgba(34, 211, 238, 0.35); background: rgba(34, 211, 238, 0.1); }

    .round-chip { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .catastrophe {
      position: relative;
      border-radius: 24px;
      padding: 20px;
      overflow: hidden;
      background:
        radial-gradient(500px 220px at 100% 0%, rgba(248, 113, 113, 0.22), transparent 60%),
        linear-gradient(155deg, rgba(139, 92, 246, 0.22), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .cat-eye {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fca5a5;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .catastrophe h1 { font-size: 23px; letter-spacing: -0.4px; line-height: 1.2; margin-bottom: 8px; }
    .catastrophe > p { font-size: 13px; line-height: 1.6; color: #cdd3e6; white-space: pre-line; }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    .cat-block {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px;
    }

    .cat-block h4 { font-size: 11px; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .cat-block ul { margin: 0; padding-left: 16px; }
    .cat-block li { font-size: 12px; line-height: 1.5; color: #dde2f2; margin-bottom: 3px; }

    .stat-row { display: flex; gap: 8px; margin-top: 14px; }
    .stat {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 13px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; }

    .block-head { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 2px 10px; }
    .block-head h2 { font-size: 16px; }
    .block-head span { font-size: 11px; color: var(--muted); }

    .cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .card {
      position: relative;
      border-radius: 16px;
      padding: 13px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 138px;
    }

    .card.revealed { border-color: rgba(139, 92, 246, 0.45); background: linear-gradient(160deg, rgba(139, 92, 246, 0.18), rgba(34, 211, 238, 0.06)); }
    .card-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .card-top .emoji { font-size: 15px; }
    .card h3 { font-size: 14px; line-height: 1.3; margin: 9px 0 5px; }
    .card p { font-size: 11.5px; line-height: 1.45; color: #c3cbe1; white-space: pre-line; }
    .card-lock { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 22px; gap: 2px; }
    .card-lock small { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .card .btn { margin-top: 10px; }
    .card .revealed-stamp { margin-top: auto; }
    .flip-front .revealed-stamp { margin-top: auto; }

    .players { display: flex; flex-direction: column; gap: 8px; }

    .player {
      display: flex;
      gap: 12px;
      padding: 13px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
    }

    .player.dead { opacity: 0.55; }
    .player.dead .avatar { filter: grayscale(1); }
    .p-body { flex: 1; min-width: 0; }
    .p-name { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 700; }
    .p-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip {
      font-size: 10.5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.28);
      color: #ddd6fe;
    }

    .vote-panel { margin-top: 18px; padding: 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
    .vote-panel h2 { font-size: 15px; margin-bottom: 5px; }
    .vote-panel > p { font-size: 12px; margin-bottom: 12px; }

    .vote-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }

    .vote-target {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
    }

    .vote-target .name { flex: 1; font-weight: 600; }
    .vote-target .count { font-size: 11px; color: var(--muted); }
    .vote-target.sel { border-color: rgba(248, 113, 113, 0.7); background: rgba(248, 113, 113, 0.12); box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.08); }
    .vote-target[disabled] { opacity: 0.4; cursor: default; }

    .notice {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 15px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
    }

    .finished {
      margin-top: 18px;
      padding: 20px;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(52, 211, 153, 0.16), rgba(34, 211, 238, 0.08));
      border: 1px solid rgba(52, 211, 153, 0.35);
      text-align: center;
    }

    .finished .big { font-size: 34px; margin-bottom: 6px; }
    .finished h2 { font-size: 19px; margin-bottom: 6px; }
    .finished p { font-size: 13px; color: #c7f5e4; line-height: 1.5; }

    .join-room { margin-top: 18px; padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
    .join-room h2 { font-size: 16px; margin-bottom: 6px; }
    .join-room p { font-size: 12px; margin-bottom: 12px; }
    .join-room input { width: 100%; letter-spacing: 0; text-transform: none; margin-bottom: 10px; }

    .state-screen { text-align: center; padding: 70px 20px; }
    .state-screen .emoji { font-size: 46px; margin-bottom: 14px; }
    .state-screen h2 { font-size: 20px; margin-bottom: 8px; }
    .state-screen p { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }

    .skeleton {
      height: 120px;
      border-radius: var(--radius);
      background: linear-gradient(100deg, rgba(255, 255, 255, 0.04) 20%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 80%);
      background-size: 220% 100%;
      animation: shimmer 1.4s infinite linear;
      margin-bottom: 12px;
    }

    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .fade { animation: fadein 0.25s ease both; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: #1b2338;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      max-width: calc(100vw - 40px);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      text-align: center;
    }

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: rgba(248, 113, 113, 0.5); color: #fecaca; }

    /* ---------- Profil kartasi (Hub) ---------- */
    .profile-card {
      position: relative;
      overflow: hidden;
      margin: 0 0 22px;
      padding: 18px;
      border-radius: 24px;
      background:
        radial-gradient(320px 160px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 65%),
        linear-gradient(150deg, rgba(139, 92, 246, 0.22), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(139, 92, 246, 0.35);
      box-shadow: var(--shadow);
    }

    .profile-card::after {
      content: "";
      position: absolute;
      inset: auto -50px -80px auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
      pointer-events: none;
    }

    .profile-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 13px; padding-right: 74px; }
    .profile-logout {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      padding: 6px 9px; border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.1);
      color: #fecaca; font-size: 11px; font-weight: 700; cursor: pointer;
    }
    .profile-logout:active { transform: scale(0.97); }

    /* ---------- Login (auth) ekrani ---------- */
    .auth-screen {
      min-height: calc(100vh - 90px);
      display: flex; flex-direction: column; justify-content: center;
      align-items: stretch; text-align: center;
      padding: 24px 4px; position: relative;
    }
    .auth-logo {
      width: 78px; height: 78px; margin: 0 auto 18px;
      display: grid; place-items: center; font-size: 38px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(34, 211, 238, 0.2));
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3);
    }
    .auth-screen h1 { font-size: 30px; letter-spacing: -0.7px; margin-bottom: 10px; }
    .auth-lede { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 340px; margin: 0 auto 26px; }
    .auth-main { font-size: 15px; }
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--muted);
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
    }
    .auth-divider::before, .auth-divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
    }
    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    .auth-form input {
      width: 100%; padding: 15px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--panel);
      color: var(--text); font-size: 14px; outline: none;
    }
    .auth-form input:focus { border-color: rgba(139, 92, 246, 0.65); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    .auth-form input::placeholder { color: var(--muted); font-size: 12px; }
    .auth-error { min-height: 20px; margin-top: 10px; color: #fca5a5; font-size: 12px; line-height: 1.5; }
    .auth-note { margin-top: 8px; }
    body.theme-light .profile-logout { color: #b91c1c; }
    body.theme-light .auth-form input { background: #fff; color: #0f172a; }
    .profile-name-lg { font-size: 18px; font-weight: 800; line-height: 1.2; letter-spacing: -0.2px; }
    .profile-handle { margin-top: 3px; font-size: 12px; color: var(--muted); }

    .avatar.lg {
      width: 58px;
      height: 58px;
      min-width: 58px;
      font-size: 19px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
    }

    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

    .profile-stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
    }

    .pstat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .pstat span { font-size: 9px; letter-spacing: 0.7px; text-transform: uppercase; color: var(--muted); }
    .pstat b { font-size: 12px; white-space: nowrap; }

    .xp-row { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .xp-bar { flex: 1; height: 6px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, 0.1); }
    .xp-bar i { display: block; width: 8%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .xp-text { font-size: 9px; letter-spacing: 0.4px; color: var(--muted); white-space: nowrap; }
    .btn.invite { position: relative; z-index: 1; width: 100%; margin-top: 13px; background: rgba(255, 255, 255, 0.07); }

    /* ---------- 3D karta ochilishi ---------- */
    .flip-card { position: relative; min-height: 158px; perspective: 1000px; }

    .flip-inner {
      position: absolute;
      inset: 0;
      min-height: 158px;
      transform-style: preserve-3d;
      animation: cardFlip 0.8s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    .flip-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 13px;
      border-radius: 16px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-back {
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      background:
        radial-gradient(120px 80px at 50% 10%, rgba(139, 92, 246, 0.32), transparent 70%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.025) 0 8px, transparent 8px 16px),
        linear-gradient(160deg, #141a2e, #090d18);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .flip-back .lock-big { font-size: 30px; filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.65)); }
    .flip-back .flip-hint { font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #a5b4fc; }

    .flip-front {
      transform: rotateY(180deg);
      background:
        radial-gradient(140px 90px at 100% 0%, rgba(34, 211, 238, 0.18), transparent 70%),
        linear-gradient(160deg, rgba(139, 92, 246, 0.3), rgba(15, 21, 38, 0.96));
      border: 1px solid rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 34px rgba(139, 92, 246, 0.22);
    }

    .flip-front h3 { margin: 9px 0 5px; font-size: 14px; line-height: 1.3; }
    .flip-front p { flex: 1; overflow: auto; font-size: 11.5px; line-height: 1.45; color: #d5dcf2; white-space: pre-line; }
    .revealed-stamp {
      align-self: flex-start;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.1);
    }

    /* ---------- Raund taymeri ---------- */
    .timer-box { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
    .timer-label { font-size: 7px; font-weight: 800; letter-spacing: 1.3px; color: var(--muted); }
    .timer { position: relative; display: grid; place-items: center; width: 46px; height: 46px; }
    .timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer circle { fill: none; stroke-width: 3.5; }
    .timer .track { stroke: rgba(255, 255, 255, 0.1); }
    .timer .progress {
      stroke: var(--danger);
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(248, 113, 113, 0.8));
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
    }
    .timer.voting .progress { stroke: #fb7185; filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.95)); }
    .timer.low { animation: timerPulse 1s ease-in-out infinite; }
    .timer.low .progress { stroke: #ef4444; }
    .timer-text { position: relative; font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }

    /* ---------- O'yinchilar holati ---------- */
    .avatar-wrap { position: relative; width: 40px; height: 40px; min-width: 40px; }
    .avatar-wrap .avatar { width: 100%; height: 100%; }

    .vote-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      z-index: 2;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 2px solid var(--bg);
      background: linear-gradient(135deg, #fb7185, #dc2626);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.65);
    }

    .vote-badge.hot { animation: votePop 0.45s ease; }

    .player.dead { opacity: 0.48; filter: grayscale(0.9); }

    .avatar-wrap.eliminated::after {
      content: "✕";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.85);
      background: rgba(8, 11, 20, 0.62);
      color: #f87171;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
    }

    /* ---------- Bunker epilogi ---------- */
    .epilogue {
      margin-top: 18px;
      overflow: hidden;
      border-radius: 24px;
      text-align: center;
      background: linear-gradient(170deg, #0f172a, #1d1626);
      border: 1px solid rgba(248, 113, 113, 0.3);
      box-shadow: var(--shadow);
    }

    .door-scene {
      position: relative;
      height: 142px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(248, 113, 113, 0.28), transparent 58%),
        linear-gradient(180deg, #080c15, #151a2a);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
    }

    .door {
      position: absolute;
      left: 50%;
      top: 16px;
      width: 150px;
      height: 132px;
      transform: translateX(-50%);
      border-radius: 14px 14px 0 0;
      border: 2px solid #334155;
      background:
        linear-gradient(90deg, #222c40 0 47%, #070a12 47% 53%, #222c40 53% 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 0, 0, 0.5);
      animation: doorShut 0.9s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .door::before,
    .door::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 46%;
      background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 18px);
    }

    .door::before { left: 0; }
    .door::after { right: 0; }

    .door-wheel {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      border: 3px solid #94a3b8;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(148, 163, 184, 0.12), inset 0 0 18px rgba(0, 0, 0, 0.85);
    }

    .door-wheel::before,
    .door-wheel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 3px;
      background: #94a3b8;
      transform: translate(-50%, -50%);
    }

    .door-wheel::after { transform: translate(-50%, -50%) rotate(90deg); }

    .door-light {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 9px;
      height: 9px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 20px 6px rgba(239, 68, 68, 0.55);
      animation: warningPulse 1.8s ease-in-out infinite;
    }

    .epilogue-body { padding: 18px 18px 20px; }
    .epilogue-kicker { margin-bottom: 6px; font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #fca5a5; }
    .epilogue h2 { margin-bottom: 10px; font-size: 21px; letter-spacing: -0.3px; }
    .epilogue-text { margin-bottom: 14px; font-size: 13px; line-height: 1.65; color: #d7dced; }
    .survivors { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .survivor { display: flex; align-items: center; gap: 7px; padding: 6px 10px 6px 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 11px; font-weight: 700; }
    .survivor .avatar { width: 26px; height: 26px; min-width: 26px; font-size: 9px; }
    .epilogue-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 9px; letter-spacing: 0.7px; text-transform: uppercase; color: #94a3b8; }

    /* ---------- Telegram yorug' tema ---------- */
    body.theme-light { background:
      radial-gradient(900px 420px at 12% -10%, rgba(139, 92, 246, 0.12), transparent 65%),
      radial-gradient(700px 380px at 100% 0%, rgba(8, 145, 178, 0.1), transparent 60%),
      var(--bg); }
    body.theme-light .game-card { background: linear-gradient(150deg, rgba(15, 23, 42, 0.055), rgba(15, 23, 42, 0.02)); }
    body.theme-light .game-card.active { border-color: rgba(124, 58, 237, 0.4); }
    body.theme-light .game-icon,
    body.theme-light .icon-btn,
    body.theme-light .badge.soon { background: rgba(15, 23, 42, 0.055); }
    body.theme-light .panel,
    body.theme-light .player,
    body.theme-light .vote-panel,
    body.theme-light .join-room,
    body.theme-light .notice { background: rgba(15, 23, 42, 0.04); border-color: rgba(15, 23, 42, 0.11); }
    body.theme-light .topbar { background: linear-gradient(180deg, var(--bg) 55%, rgba(244, 245, 251, 0.86) 100%); }
    body.theme-light .catastrophe { background:
      radial-gradient(500px 220px at 100% 0%, rgba(248, 113, 113, 0.16), transparent 60%),
      linear-gradient(155deg, rgba(139, 92, 246, 0.14), rgba(15, 23, 42, 0.03)); border-color: rgba(15, 23, 42, 0.12); }
    body.theme-light .catastrophe > p { color: #334155; }
    body.theme-light .cat-block,
    body.theme-light .stat,
    body.theme-light .pstat { background: rgba(15, 23, 42, 0.045); border-color: rgba(15, 23, 42, 0.08); }
    body.theme-light .cat-block li { color: #334155; }
    body.theme-light .card { background: linear-gradient(160deg, rgba(15, 23, 42, 0.055), rgba(15, 23, 42, 0.02)); }
    body.theme-light .card p { color: #475569; }
    body.theme-light input[type="text"] { background: rgba(15, 23, 42, 0.05); }
    body.theme-light input::placeholder { color: #94a3b8; }
    body.theme-light .vote-target { background: rgba(15, 23, 42, 0.03); }
    body.theme-light .chip { color: #5b21b6; }
    body.theme-light #toast { background: #ffffff; color: #111827; }
    body.theme-light .profile-card { background:
      radial-gradient(320px 160px at 100% 0%, rgba(8, 145, 178, 0.12), transparent 65%),
      linear-gradient(150deg, rgba(139, 92, 246, 0.15), rgba(15, 23, 42, 0.03)); }
    body.theme-light .btn.invite { background: rgba(15, 23, 42, 0.05); }
    body.theme-light .footer { color: #94a3b8; }

    /* ---------- Hamyon, do'kon va boosterlar ---------- */
    .wallet-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      margin: 14px 0; padding: 12px 14px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(251, 191, 36, 0.16), rgba(139, 92, 246, 0.12));
      border: 1px solid rgba(251, 191, 36, 0.28);
    }
    .wallet-balance { display: flex; align-items: baseline; gap: 6px; font-size: 13px; color: var(--muted); }
    .wallet-balance span { font-size: 20px; }
    .wallet-balance b { font-size: 22px; color: var(--text); }
    .coin-btn {
      border: 0; border-radius: 999px; padding: 8px 13px; font-size: 12px; font-weight: 700;
      color: #1f1300; background: linear-gradient(135deg, #fbbf24, #f59e0b); cursor: pointer;
      box-shadow: 0 6px 16px rgba(245, 158, 11, 0.28);
    }
    .shop-overlay {
      position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end;
      background: rgba(3, 6, 14, 0.72); backdrop-filter: blur(5px);
      padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    .shop-sheet {
      width: 100%; max-width: 560px; margin: 0 auto; max-height: 86vh; overflow-y: auto;
      background: var(--bg-soft); border: 1px solid var(--border); border-radius: 24px;
      padding: 20px; box-shadow: var(--shadow); animation: shopUp 0.22s ease-out;
    }
    .shop-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
    .shop-head h2 { font-size: 20px; }
    .shop-close { border: 0; background: var(--panel-strong); color: var(--text); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; }
    .shop-lede { color: var(--muted); font-size: 13px; margin: 4px 0 16px; line-height: 1.5; }
    .shop-packages { display: flex; flex-direction: column; gap: 9px; }
    .shop-package {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      width: 100%; padding: 13px 14px; border-radius: 14px; text-align: left; cursor: pointer;
      color: var(--text); background: var(--panel); border: 1px solid var(--border);
    }
    .shop-package.sel { border-color: var(--accent); background: rgba(139, 92, 246, 0.16); }
    .shop-package b { font-size: 16px; }
    .shop-package small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
    .shop-package .price { font-weight: 700; color: var(--warning); white-space: nowrap; }
    .shop-card {
      margin-top: 14px; padding: 13px; border-radius: 14px; background: var(--panel);
      border: 1px dashed var(--border); font-size: 13px; line-height: 1.55;
    }
    .shop-card code { font-size: 16px; letter-spacing: 0.5px; color: var(--warning); }
    .shop-note { color: var(--muted); font-size: 11px; line-height: 1.5; margin-top: 10px; }
    .booster-panel { margin-top: 14px; padding: 15px; border-radius: 18px; background: var(--panel); border: 1px solid var(--border); }
    .booster-panel h2 { font-size: 15px; margin-bottom: 4px; }
    .booster-panel .lede { color: var(--muted); font-size: 11px; margin-bottom: 10px; }
    .booster-list { display: flex; flex-direction: column; gap: 8px; }
    .booster-btn {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      width: 100%; padding: 10px 12px; border-radius: 12px; cursor: pointer;
      color: var(--text); background: var(--panel-strong); border: 1px solid var(--border);
      font-size: 12px; font-weight: 600;
    }
    .booster-btn[disabled] { opacity: 0.4; cursor: default; }
    .booster-btn .cost { color: var(--warning); white-space: nowrap; }
    .reroll-row { display: flex; gap: 6px; }
    .reroll-row select {
      min-width: 0; flex: 1; border-radius: 10px; padding: 8px; color: var(--text);
      background: var(--panel-strong); border: 1px solid var(--border); font-size: 12px;
    }
    .shield-offer {
      margin-top: 14px; padding: 18px; border-radius: 18px; text-align: center;
      background: radial-gradient(380px 160px at 50% 0%, rgba(34, 211, 238, 0.18), transparent 70%), var(--panel);
      border: 1px solid rgba(34, 211, 238, 0.38);
    }
    .shield-offer .shield-icon { font-size: 38px; margin-bottom: 6px; }
    .shield-offer h2 { font-size: 18px; margin-bottom: 6px; }
    .shield-offer p { color: var(--muted); font-size: 12px; line-height: 1.55; margin-bottom: 12px; }
    .shield-offer .btn + .btn { margin-top: 8px; }
    @keyframes shopUp { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes cardFlip { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
    @keyframes doorShut { from { transform: translateX(-50%) scaleY(0.86) translateY(-8px); opacity: 0.4; } to { transform: translateX(-50%) scaleY(1) translateY(0); opacity: 1; } }
    @keyframes warningPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes timerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes votePop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }

    /* ---------- Mafiya: 3D tarot kartasi ---------- */
    .mafia-shell { display: flex; flex-direction: column; gap: 14px; }
    .mafia-shell .mafia-select {
      display: block; width: 100%; margin: 6px 0 12px; padding: 11px 12px;
      border-radius: 11px; color: var(--text); background: var(--panel-strong);
      border: 1px solid var(--border); font-size: 13px;
    }
    .mafia-shell label { display: block; margin-top: 8px; }
    .mafia-hero { text-align: center; padding: 10px 10px 0; }
    .mafia-kicker { font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--muted); }
    .mafia-hero h1 { font-size: 24px; margin: 7px 0; }
    .mafia-hero p { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .tarot-scene {
      width: min(70vw, 280px); aspect-ratio: 2 / 3; margin: 6px auto 0;
      perspective: 1200px; filter: drop-shadow(0 26px 34px rgba(0, 0, 0, 0.45));
    }
    .tarot-card {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      transition: transform 0.85s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .tarot-card.flipped { transform: rotateY(180deg); }
    .tarot-face {
      position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 0 0 6px rgba(139, 92, 246, 0.11), 0 24px 60px rgba(0, 0, 0, 0.5);
      background: var(--bg-soft);
    }
    .tarot-face img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tarot-back {
      display: grid; place-items: center;
      background: radial-gradient(circle at 50% 28%, rgba(139, 92, 246, 0.5), rgba(7, 11, 22, 0.97) 66%);
    }
    .tarot-back img { position: absolute; inset: 0; opacity: 0.34; filter: blur(1px) saturate(0.7); }
    .tarot-back::before {
      content: ""; position: absolute; inset: 11px; border-radius: 15px;
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .tarot-back span {
      position: relative; z-index: 1; font-size: 48px; font-weight: 800;
      color: #f2f4fb; text-shadow: 0 0 22px rgba(139, 92, 246, 0.95);
    }
    .tarot-front { transform: rotateY(180deg); }
    .tarot-front::after {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(180deg, transparent 58%, rgba(3, 6, 14, 0.82));
    }
    .mafia-reveal {
      padding: 15px; border-radius: 18px; text-align: center;
      background: radial-gradient(360px 150px at 50% 0%, rgba(139, 92, 246, 0.2), transparent 72%), var(--panel);
      border: 1px solid var(--border);
    }
    .mafia-reveal[hidden] { display: none; }
    .mafia-role { font-size: 22px; font-weight: 800; letter-spacing: 0.2px; }
    .mafia-tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 9px 0; }
    .mafia-tags span {
      padding: 5px 10px; border-radius: 999px; font-size: 11px; font-weight: 700;
      background: rgba(139, 92, 246, 0.16); border: 1px solid rgba(139, 92, 246, 0.34);
    }
    .mafia-status { display: flex; flex-direction: column; gap: 8px; }
    .mafia-status-row { display: flex; align-items: center; justify-content: space-between; font-size: 13px; }
    .mafia-status-row span { color: var(--muted); }
    .mafia-status-row b { font-weight: 700; }
    .mafia-status .tiny { margin-top: 2px; }

    /* ---------- Mafiya taymeri, jamoasi va boosterlari ---------- */
    .mafia-timer-row { display: flex; align-items: center; gap: 13px; }
    .mafia-timer {
      position: relative; width: 76px; height: 76px; min-width: 76px;
      display: grid; place-items: center; border-radius: 50%;
      background: radial-gradient(circle, rgba(248, 113, 113, 0.14), transparent 70%);
      border: 1px solid rgba(248, 113, 113, 0.38);
    }
    .mafia-timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .mafia-timer .track { fill: none; stroke: rgba(248, 113, 113, 0.16); stroke-width: 5; }
    .mafia-timer .progress {
      fill: none; stroke: #f87171; stroke-width: 5; stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(248, 113, 113, 0.9));
      transition: stroke-dashoffset 0.45s linear;
    }
    .mafia-timer span {
      position: relative; z-index: 1; font-size: 15px; font-weight: 800;
      font-variant-numeric: tabular-nums; color: #fecaca;
    }
    .mafia-timer.low .progress { stroke: #ef4444; animation: warningPulse 0.9s infinite; }
    .mafia-timer.low span { color: #ef4444; }
    .mafia-timer-copy b { display: block; font-size: 15px; }
    .mafia-timer-copy small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; line-height: 1.4; }
    .mafia-team {
      padding: 15px; border-radius: 18px;
      background: radial-gradient(360px 150px at 0% 0%, rgba(248, 113, 113, 0.18), transparent 72%), var(--panel);
      border: 1px solid rgba(248, 113, 113, 0.35);
    }
    .mafia-team h2 { font-size: 14px; margin-bottom: 8px; color: #fecaca; }
    .mafia-team-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .mafia-team-row:first-of-type { border-top: 0; }
    .mafia-team-dot { width: 9px; height: 9px; min-width: 9px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 9px rgba(239, 68, 68, 0.95); }
    .mafia-team-name { font-size: 13px; font-weight: 700; flex: 1; }
    .mafia-team-role { font-size: 11px; color: #fca5a5; }
    .mafia-team-row.dead .mafia-team-name { text-decoration: line-through; color: var(--muted); }
    .mafia-shop { padding: 15px; border-radius: 18px; background: var(--panel); border: 1px solid var(--border); }
    .mafia-shop-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 9px; }
    .mafia-shop-head h2 { font-size: 15px; }
    .mafia-shop-head span { color: var(--warning); font-size: 12px; font-weight: 700; }
    .mafia-booster {
      display: flex; align-items: center; gap: 9px; width: 100%; margin-top: 7px;
      padding: 10px 11px; border-radius: 13px; text-align: left; cursor: pointer;
      color: var(--text); background: var(--panel-strong); border: 1px solid var(--border);
    }
    .mafia-booster[disabled] { opacity: 0.45; cursor: default; }
    .mafia-booster .mb-icon { font-size: 20px; }
    .mafia-booster .mb-body { flex: 1; min-width: 0; }
    .mafia-booster .mb-body b { display: block; font-size: 12px; }
    .mafia-booster .mb-body small { display: block; color: var(--muted); font-size: 10px; line-height: 1.4; margin-top: 2px; }

    /* ---------- Josus (Spyfall) ---------- */
    .spy-shell { display: flex; flex-direction: column; gap: 14px; }
    .spy-hero { text-align: center; padding: 10px 10px 0; }
    .spy-hero h1 { font-size: 23px; margin: 7px 0; }
    .spy-hero p { color: var(--muted); font-size: 12px; line-height: 1.55; }
    .spy-card-front {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; padding: 18px; text-align: center;
      background: radial-gradient(circle at 50% 22%, rgba(56, 189, 248, 0.32), rgba(7, 11, 22, 0.97) 70%);
    }
    .spy-card-front::after { display: none; }
    .spy-card-front > * { position: relative; z-index: 1; }
    .spy-card-front .spy-emoji { font-size: 46px; }
    .spy-card-front .spy-place { font-size: 21px; font-weight: 800; line-height: 1.2; }
    .spy-card-front .spy-role {
      padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: rgba(56, 189, 248, 0.18); border: 1px solid rgba(56, 189, 248, 0.42);
    }
    .spy-card-front .spy-note { font-size: 11px; color: var(--muted); line-height: 1.45; }
    .spy-card-front.spy-alert { background: radial-gradient(circle at 50% 22%, rgba(248, 113, 113, 0.42), rgba(7, 11, 22, 0.97) 70%); }
    .spy-card-front.spy-alert .spy-role { background: rgba(248, 113, 113, 0.18); border-color: rgba(248, 113, 113, 0.46); }
    .spy-locations { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .spy-location {
      display: flex; align-items: center; gap: 6px; padding: 8px 9px; border-radius: 10px;
      font-size: 11.5px; font-weight: 600; text-align: left; color: var(--text); cursor: pointer;
      background: var(--panel-strong); border: 1px solid var(--border);
    }
    .spy-location.sel { border-color: rgba(56, 189, 248, 0.8); box-shadow: 0 0 0 1px rgba(56, 189, 248, 0.45); }
    .spy-location.ruled { opacity: 0.42; text-decoration: line-through; }
    .spy-location.hinted { opacity: 0.32; text-decoration: line-through; cursor: default; }
    .spy-location .sl-emoji { font-size: 15px; }
    .spy-hint-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; }
    .spy-timer {
      position: relative; width: 70px; height: 70px; min-width: 70px; display: grid; place-items: center;
      border-radius: 50%; border: 1px solid rgba(56, 189, 248, 0.38);
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
    }
    .spy-timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .spy-timer .track { fill: none; stroke: rgba(56, 189, 248, 0.16); stroke-width: 5; }
    .spy-timer .progress { fill: none; stroke: #38bdf8; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.45s linear; }
    .spy-timer span { position: relative; z-index: 1; font-size: 14px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .spy-timer.low .progress { stroke: #ef4444; }
    .spy-timer.low span { color: #fecaca; }
    .mafia-booster .mb-price { font-size: 11px; font-weight: 800; color: var(--warning); text-align: right; max-width: 42%; }
    .profile-split {
      margin-top: 10px; padding: 9px 11px; border-radius: 12px; text-align: center;
      background: rgba(139, 92, 246, 0.1); border: 1px solid rgba(139, 92, 246, 0.22);
      font-size: 12px; color: var(--muted);
    }
    .profile-split b { color: var(--text); }

    /* ---------- Vektor ikonkalar (iOS uslubi) ---------- */
    .ui-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }
    .ui-ico {
      display: inline-flex; align-items: center; justify-content: center;
      width: 1em; height: 1em; flex: 0 0 auto; vertical-align: -0.12em;
      color: currentColor;
    }
    .ui-ico svg {
      width: 100%; height: 100%; display: block;
      fill: none; stroke: currentColor; stroke-width: 1.8;
      stroke-linecap: round; stroke-linejoin: round;
    }
    .section-title h2 .ui-ico { margin-right: 6px; color: var(--accent-2); }
    .game-icon .ui-ico { width: 30px; height: 30px; color: #c4b5fd; }
    .m-emoji .ui-ico { width: 20px; height: 20px; color: var(--accent-2); }
    .wallet-balance .ui-ico { width: 20px; height: 20px; color: var(--warning); }
    .pstat span .ui-ico { width: 12px; height: 12px; margin-right: 3px; }
    .profile-split .ui-ico { width: 13px; height: 13px; margin: 0 3px 0 2px; }
    .bonus-head h2 .ui-ico, .bonus-card h2 .ui-ico { margin-right: 6px; color: var(--warning); }
    .m-title .m-reward .ui-ico { width: 12px; height: 12px; margin-left: 2px; }
    .btn .ui-ico { width: 16px; height: 16px; margin-right: 6px; }
    .notice .ui-ico { width: 17px; height: 17px; margin-right: 6px; color: var(--accent-2); }
    .auth-logo .ui-ico { width: 42px; height: 42px; color: var(--warning); }
    .icon-btn .ui-ico { width: 18px; height: 18px; }
    .shop-close .ui-ico { width: 18px; height: 18px; }
    .lock-big .ui-ico { width: 26px; height: 26px; }
    .chip .ui-ico { width: 12px; height: 12px; vertical-align: -2px; margin-right: 2px; }
    .rank-badge {
      width: 22px; height: 22px; border-radius: 50%;
      display: inline-grid; place-items: center;
      font-size: 11px; font-weight: 800; color: #0a0f1f;
      background: rgba(148, 163, 184, 0.35);
    }
    .rank-badge.rank-1 { background: #fbbf24; }
    .rank-badge.rank-2 { background: #cbd5e1; }
    .rank-badge.rank-3 { background: #d97706; color: #fff; }

    @media (max-width: 390px) {
      .status-pill { display: none; }
      .room-code { font-size: 15px; }
      .profile-name-lg { font-size: 16px; }
      .pstat { padding: 9px 10px; }
      .pstat b { font-size: 11px; }
    }

    @media (min-width: 720px) {
      #app { max-width: 760px; padding-top: 28px; }

      .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .cat-grid { grid-template-columns: 1fr 1fr; }
    }

          .replace(/sh/gi, function (part) { return part[0] === "S" ? "Ş" : "ş"; })

      function normalizeTextNodes(root) {
        if (!root) return;
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        var node;
        while ((node = walker.nextNode())) {
          var normalized = normalizeUzbekText(node.nodeValue);
          if (normalized !== node.nodeValue) node.nodeValue = normalized;
        }

              if (normalized !== record.target.nodeValue) record.target.nodeValue = normalized;
            }
            record.addedNodes && record.addedNodes.forEach(function (node) {
              if (node.nodeType === 3) {
                node.nodeValue = normalizeUzbekText(node.nodeValue);
              } else if (node.nodeType === 1) {
                normalizeTextNodes(node);
              }
            });
          });
        });
        alphabetObserver.observe(app, { childList: true, subtree: true, characterData: true });
        normalizeTextNodes(app);

      function formatSeconds(total) {
        var value = Math.max(0, Math.round(total));
        var minutes = Math.floor(value / 60);
        var seconds = value % 60;
        return minutes + ":" + (seconds < 10 ? "0" + seconds : String(seconds));

      function stopTimer() {
        if (timer.interval) clearInterval(timer.interval);
        timer = { key: "", deadline: 0, duration: 0, status: "", interval: null };
      }

      function paintTimer() {
        var element = document.querySelector("[data-timer]");
        if (!element || !timer.key) return;
        var remaining = Math.max(0, (timer.deadline - Date.now()) / 1000);
        var ratio = timer.duration ? Math.max(0, Math.min(1, remaining / timer.duration)) : 0;
        var circumference = 119.38;
        var ring = element.querySelector("[data-timer-ring]");
        var text = element.querySelector("[data-timer-text]");
        if (ring) ring.style.strokeDashoffset = String(circumference * (1 - ratio));
        if (text) text.textContent = formatSeconds(remaining);
        element.classList.toggle("low", remaining <= 15);
        element.classList.toggle("voting", timer.status === "VOTING");
      }

      function ensureTimer(room) {
        if (!room || (room.status !== "PLAYING" && room.status !== "VOTING")) {
          stopTimer();
          return;

        var key = room.code + ":" + room.current_round + ":" + room.status;
        if (timer.key !== key) {
          stopTimer();
          var duration = TIMER_DURATIONS[room.status] || 120;
          var storageKey = "rg_timer_" + key;
          var deadline = Number(window.sessionStorage.getItem(storageKey));
          if (!deadline || deadline <= 0) {
            deadline = Date.now() + duration * 1000;
            window.sessionStorage.setItem(storageKey, String(deadline));
          }
          timer.key = key;
          timer.deadline = deadline;
          timer.duration = duration;
          timer.status = room.status;
          timer.interval = setInterval(paintTimer, 1000);
        }
        paintTimer();
      }

            profile.photo = u.photo_url || profile.photo || "";
          }
          profile.guest = false;
          var path = "/api/me?user_id=" + encodeURIComponent(profile.id) +
            "&username=" + encodeURIComponent(profile.username || "") +
            "&full_name=" + encodeURIComponent(profile.name || "");
          var data = await request(path);
          if (!data || !data.user) return;
          updateProfileFromAccount(data.user);
          profile.recent_games = Array.isArray(data.recent_games) ? data.recent_games.slice(0, 5) : [];
          if (view.shopOpen) view.shop = data.shop || view.shop;
          if (!view.code) renderHub();
          else if (view.room) renderRoom(true);
        } catch (error) {
          if (error && (error.status === 401 || error.status === 404)) {
            clearStoredAccount();
            profile = loadProfile();
            renderLoginScreen(error.message);

      function waitText(seconds) {
        var value = Math.max(0, Math.round(Number(seconds) || 0));
        var hours = Math.floor(value / 3600);
        var minutes = Math.ceil((value % 3600) / 60);
        if (hours) return hours + " soat " + minutes + " daqiqadan keyin";
        return Math.max(1, minutes) + " daqiqadan keyin";
      }

      function announceTransitions(previous, next) {
        if (!previous || !next) return 0;
        var announced = 0;
        var wasAlive = {};
        (previous.players || []).forEach(function (player) {
          if (player.is_alive) wasAlive[player.user_id] = true;
        });
        (next.players || []).forEach(function (player) {
          if (player.is_alive || !wasAlive[player.user_id]) return;
          var key = next.code + ":" + player.user_id + ":" + next.current_round;
          if (view.notified[key]) return;
          view.notified[key] = true;
          announced += 1;
          haptic("error");
          toast(player.full_name + " bunkerdan haydaldi", "error");
        });
        if (previous.status !== "FINISHED" && next.status === "FINISHED") {
          haptic("success");
        }
        return announced;
      }

      async function submitLogin(value) {
        var raw = String(value || "").replace(/\D/g, "");

          return;

        var submit = document.getElementById("login-submit");
        if (submit) {
          submit.disabled = true;
          submit.innerHTML = icon("hourglass") + " Tekshirilmoqda…";
        }
        setLoginError("");
        try {
          var payload = raw.length === 6 ? { login: raw } : { user_id: Number(raw) };
          var data = await request("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },

      async function request(path, options) {
        var requestOptions = Object.assign({}, options || {});
        var headers = Object.assign({}, (options && options.headers) || {});
        var initData = getTgInitData();
        if (initData) headers["X-Telegram-Init-Data"] = initData;
        requestOptions.headers = headers;
        var response = await fetch(path, requestOptions);
        var data = null;
        try { data = await response.json(); } catch (err) { data = null; }
        if (!response.ok) {
          var detail = data && data.detail ? data.detail : "Server xatosi (" + response.status + ")";
          if (Array.isArray(detail)) {
            detail = detail.map(function (item) { return item.msg || ""; }).filter(Boolean).join(", ");
          }
          var error = new Error(detail);
          error.status = response.status;
          throw error;
        }
        return data;
      }

      async function loadMafiaRole() {
        var code = view.code;
        if (view.mafiaTimer) {
          clearTimeout(view.mafiaTimer);
          view.mafiaTimer = null;
        }
        if (!view.mafia) {
          view.mafiaLoading = true;
          renderMafia();
        }
        try {
          var results = await Promise.all([
            fetchMafiaMe(code),
            request("/api/mafia/" + encodeURIComponent(code) + "/state")
          ]);
          if (view.mode !== "mafia" || view.code !== code) return;
          view.mafia = results[0].me;
          view.mafiaState = results[1].state;
          if (results[1].state.phase === "VOTING" && results[1].state.my_vote_target != null) {
            view.mafiaVoteTarget = Number(results[1].state.my_vote_target);
          } else if (results[1].state.phase !== "VOTING") {
            view.mafiaVoteTarget = null;
          }
          view.mafiaError = null;
          if (results[0].me.phase !== "FINISHED") {
            // Rol, taymer va mafiya jamoasi yangilanishi uchun qisqa poll.
            view.mafiaTimer = setTimeout(function () {
              if (view.mode === "mafia" && view.code === code) loadMafiaRole();
            }, 5000);
          }
        } catch (error) {
          if (view.mode !== "mafia" || view.code !== code) return;
          view.mafiaError = error;
        } finally {
          if (view.mode === "mafia" && view.code === code) {
            view.mafiaLoading = false;
            renderMafia();
          }
        }
      }

      function stopMafiaClock() {
        if (mafiaClock.interval) clearInterval(mafiaClock.interval);
        mafiaClock.interval = null;
        mafiaClock.deadline = 0;
      }

      function paintMafiaClock() {
        var el = document.querySelector("[data-mafia-timer]");
        if (!el || !mafiaClock.deadline) return;
        var now = Date.now() / 1000 + mafiaClock.serverOffset;
        var remaining = Math.max(0, Math.ceil(mafiaClock.deadline - now));
        var text = el.querySelector("[data-mafia-time]");
        if (text) text.textContent = formatSeconds(remaining);

        }

      // ----------------------------------------------------------------
      // Josus (Spyfall)
      // ----------------------------------------------------------------
      var SPY_PHASES = {
        LOBBY: "Kutilmoqda",
        PLAYING: "Muhokama",
        VOTING: "Ovoz berish",
        FINISHED: "Tugadi"
      };
      var spyClock = { deadline: 0, duration: 300, offset: 0, interval: null };

      function spyStartCode(value) {
        var match = /^(?:spy_)?(SPY\d{3})$/i.exec(String(value || "").trim());
        return match ? match[1].toUpperCase() : "";
      }

      function spyRuled() {
        if (!view.spyRuled) view.spyRuled = {};
        return view.spyRuled;
      }

      function enterSpy(code) {
        stopMatchmakingPolling();
        var normalized = spyStartCode(code) || normalizeCode(code);
        if (!/^SPY\d{3}$/.test(normalized)) {
          toast("Josus xona kodi SPY123 ko'rinishida bo'ladi", "error");
          return;
        }
        view.mode = "spy";
        view.code = normalized;
        view.spy = null;
        view.spyState = null;
        view.spyError = null;
        view.spyLoading = true;
        view.spyOpen = false;
        view.spyVoteTarget = null;
        view.spyGuessKey = null;
        view.spyRuled = {};
        view.spyEntry = false;
        if (view.spyTimer) {
          clearTimeout(view.spyTimer);
          view.spyTimer = null;
        }
        stopLive();
        stopTimer();
        stopMafiaClock();
        stopSpyClock();
        setBackButton(true);
        renderSpy();
        loadSpyState();
      }

      function stopSpyClock() {
        if (spyClock.interval) clearInterval(spyClock.interval);
        spyClock.interval = null;
        spyClock.deadline = 0;
      }

      function paintSpyClock() {
        var el = document.querySelector("[data-spy-timer]");
        if (!el || !spyClock.deadline) return;
        var now = Date.now() / 1000 + spyClock.offset;
        var remaining = Math.max(0, Math.ceil(spyClock.deadline - now));
        var text = el.querySelector("[data-spy-time]");
        if (text) text.textContent = formatSeconds(remaining);
        var ring = el.querySelector("[data-spy-ring]");
        if (ring) {
          var ratio = Math.max(0, Math.min(1, remaining / spyClock.duration));
          ring.style.strokeDashoffset = String(113.1 * (1 - ratio));
        }
        el.classList.toggle("low", remaining <= 30);
      }

      function syncSpyClock(state) {
        stopSpyClock();
        if (!state || !state.deadline || state.status === "FINISHED") return;
        spyClock.deadline = Number(state.deadline) || 0;
        spyClock.duration = Math.max(1, Number(state.round_seconds) || 300);
        spyClock.offset = (Number(state.deadline) - Number(state.seconds_left || 0))
          - Date.now() / 1000;
        paintSpyClock();
        spyClock.interval = setInterval(paintSpyClock, 1000);
      }

      function scheduleSpyPoll() {
        if (view.spyTimer) {
          clearTimeout(view.spyTimer);
          view.spyTimer = null;
        }
        var state = view.spyState;
        if (!state || state.status === "FINISHED") return;
        if (!["LOBBY", "PLAYING", "VOTING"].includes(state.status)) return;
        view.spyTimer = setTimeout(function () {
          if (view.mode === "spy") loadSpyState();
        }, 4000);
      }

      function applySpyData(data) {
        if (!data || !data.state) return;
        view.spy = data.me;
        view.spyState = data.state;
        if (data.locations) view.spyLocations = data.locations;
        if (data.coins != null) profile.balance = Number(data.coins) || 0;
        if (data.state.status === "FINISHED") {
          view.spyVoteTarget = null;
          view.spyGuessKey = null;
        }
        view.spyLoading = false;
        view.spyError = null;
      }

      async function loadSpyState(retried) {
        var code = view.code;
        try {
          var data = await request(
            "/api/spy/" + encodeURIComponent(code) + "?user_id=" +
            encodeURIComponent(profile.id)
          );
          if (view.mode !== "spy" || view.code !== code) return;
          applySpyData(data);
          renderSpy();
          scheduleSpyPoll();
        } catch (error) {
          if (view.mode !== "spy" || view.code !== code) return;
          if (error.status === 403 && !retried) {
            // Guruhdan kelgan foydalanuvchi hali qo'shilmagan bo'lsa — avtomatik qo'shamiz.
            try {
              var joined = await request(
                "/api/spy/" + encodeURIComponent(code) + "/join",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ user_id: profile.id, name: profile.name || "" })
                }
              );
              if (view.mode !== "spy" || view.code !== code) return;
              applySpyData(joined);
              renderSpy();
              scheduleSpyPoll();
              return;
            } catch (joinError) {
              error = joinError;
            }
          }
          view.spyLoading = false;
          view.spyError = error;
          stopSpyClock();
          renderSpy();
        }
      }

      async function createSpyRoom() {
        if (view.actionBusy) return;
        view.actionBusy = true;
        try {
          var data = await request("/api/spy/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id, name: profile.name || "O'yinchi" })
          });
          view.spyEntry = false;
          if (data && data.state && data.state.code) enterSpy(data.state.code);
        } catch (error) {
          toast(error.message || "Xona yaratilmadi", "error");
        } finally {
          view.actionBusy = false;
        }
      }

      async function spyPost(path, payload, successMessage) {
        if (view.spyActionBusy) return null;
        var code = view.code;
        view.spyActionBusy = true;
        renderSpy();
        try {
          var data = await request("/api/spy/" + encodeURIComponent(code) + "/" + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign(
              { user_id: profile.id, name: profile.name || "" },
              payload || {}
            ))
          });
          if (view.mode !== "spy" || view.code !== code) return null;
          applySpyData(data);
          if (data.result && data.result.reason) {
            toast(data.result.reason, data.result.correct === false ? "error" : "success");
          } else if (successMessage) {
            toast(successMessage, "success");
          }
          haptic("success");
          return data;
        } catch (error) {
          if (view.mode === "spy" && view.code === code) {
            toast(error.message || "Harakat bajarilmadi", "error");
          }
          return null;
        } finally {
          if (view.mode === "spy" && view.code === code) {
            view.spyActionBusy = false;
            renderSpy();
            scheduleSpyPoll();
          }
        }
      }

      function spyCardHtml(me, state) {
        if (!me) return "";
        var finished = state && state.status === "FINISHED";
        var opened = Boolean(view.spyOpen) || finished;
        var front;
        if (me.is_spy && !finished) {

            '<span class="spy-note">' + esc(me.spy_warning || "Savollarga ehtiyotkorlik bilan javob bering.") + '</span>';
        } else {
          front = '<span class="spy-emoji">' + esc(me.location_emoji || "\ud83d\udccd") + '</span>' +
            '<span class="spy-place">' + esc(me.location_name || "Lokatsiya") + '</span>' +
            '<span class="spy-role">' + esc(me.role_name || "Rol") + '</span>' +
            '<span class="spy-note">' +
              (me.is_spy
                ? "Siz josus edingiz — joy endi ochildi."
                : "Bu joyni josusga bildirmang. Savollar orqali uni aniqlang.") +
            '</span>';
        }
        var teammates = "";
        if (me.is_spy && me.teammates && me.teammates.length) {
          teammates = '<div class="notice tiny">' + icon("glasses") + ' Ikkinchi josus: ' +
            me.teammates.map(function (mate) { return esc(mate.name); }).join(", ") + '</div>';
        }
        return '<div class="tarot-scene"><div class="tarot-card' + (opened ? " flipped" : "") + '">' +
            '<div class="tarot-face tarot-back"><span>?</span></div>' +
            '<div class="tarot-face tarot-front spy-card-front' + (me.is_spy ? " spy-alert" : "") + '">' + front + '</div>' +
          '</div></div>' +
          (opened
            ? ''
            : '<button class="btn primary block" data-act="spy-flip">' + icon("card") + ' Kartani ochish</button>') +
          teammates;
      }

      function spyLocationsHtml(me, state) {
        var locations = view.spyLocations || [];
        if (!locations.length || !state) return "";
        if (state.status === "LOBBY") return "";
        var hinted = {};
        ((me && me.hint_exclusions) || []).forEach(function (key) { hinted[key] = true; });
        var ruled = spyRuled();
        var canGuess = Boolean(me && me.is_spy) && state.status !== "FINISHED";
        var rows = locations.map(function (location) {
          var classes = ["spy-location"];
          if (hinted[location.key]) classes.push("hinted");
          else if (!canGuess && ruled[location.key]) classes.push("ruled");
          if (canGuess && view.spyGuessKey === location.key) classes.push("sel");
          var attrs = hinted[location.key]
            ? " disabled"
            : (canGuess
              ? ' data-act="spy-pick" data-key="' + esc(location.key) + '"'
              : ' data-act="spy-rule" data-key="' + esc(location.key) + '"');
          return '<button class="' + classes.join(" ") + '"' + attrs + '>' +
            '<span class="sl-emoji">' + esc(location.emoji) + '</span>' +
            '<span>' + esc(location.name) + '</span></button>';
        }).join("");

        var hint = "";
        if (canGuess) {
          var excluded = ((me && me.hint_exclusions) || []).length;
          hint = '<div class="spy-hint-row"><span class="muted tiny">' +
              (excluded ? icon("eye") + " Radar: " + excluded + " ta noto'g'ri joy o'chirildi" : "Lokatsiyani tanlab, taxmin qiling") +
            '</span></div>' +
            '<button class="btn primary block" data-act="spy-guess"' +
              (view.spyGuessKey == null || view.spyActionBusy ? " disabled" : "") +
              '>' + icon("target") + ' Men joyni topdim!</button>';
        } else if (state.status !== "FINISHED") {
          hint = '<p class="muted tiny" style="margin-top:8px">Shubhadan chiqarilgan joyni belgilash uchun bosing.</p>';
        }

        return '<section class="panel"><h2>' + icon("map-pin") + ' Lokatsiyalar (' + locations.length + ')</h2>' +
          '<div class="spy-locations">' + rows + '</div>' + hint + '</section>';
      }

      function spyPlayersHtml(me, state) {
        if (!state) return "";
        var players = state.players || [];
        var finished = state.status === "FINISHED";
        var voting = state.status === "VOTING" || state.status === "PLAYING";
        var canVote = Boolean(me) && voting && !me.has_voted;
        var rows = players.map(function (player) {
          var self = player.is_me;
          var selected = Number(view.spyVoteTarget) === Number(player.user_id);
          var action = "";
          if (canVote && !self) {
            action = '<button class="btn small' + (selected ? " primary" : "") + '" data-act="spy-vote-select" data-target="' +
              player.user_id + '">' + (selected ? "Tanlandi" : "Ovoz") + '</button>';
          } else if (finished) {
            action = '<span class="badge ' + (player.is_spy ? "soon" : "live") + '">' +
              (player.is_spy ? "JOSUS" : "TINCH") + '</span>';
          }
          return '<div class="player' + (selected ? " sel" : "") + '">' +
            avatarHtml(player.name, player.user_id, "sm") +
            '<div class="p-body"><div class="p-name">' + esc(player.name) +
              (self ? ' <span class="badge me">SIZ</span>' : '') +
              (player.is_host ? ' <span class="badge">EGASI</span>' : '') + '</div>' +
              '<div class="p-meta">' +
                (player.has_voted ? "Ovoz berdi" : (voting ? "Ovoz bermagan" : "O'yinda")) +
                ((state.votes_count && (finished || state.status === "VOTING"))
                  ? " · " + Number(player.votes || 0) + " ovoz"
                  : "") +
              '</div></div>' + action + '</div>';
        }).join("");

        var controls = "";
        if (canVote && view.spyVoteTarget != null) {
          controls = '<button class="btn primary block" data-act="spy-vote-submit" style="margin-top:10px"' +
            (view.spyActionBusy ? " disabled" : "") + '>Josus deb ovoz berish</button>';
        } else if (me && me.has_voted && voting) {
          controls = '<div class="notice tiny" style="margin-top:10px">Ovozingiz qabul qilindi. Boshqalarni kuting.</div>';
        }
        return '<section class="panel"><h2>' + icon("users") + ' O\'yinchilar (' + players.length + '/' + (state.max_players || 12) + ')</h2>' +
          '<div class="players">' + rows + '</div>' + controls + '</section>';
      }

              (status === "VOTING" ? "Vaqt tugadi \u2014 ovoz bering" : "Muhokama davom etmoqda") +
            '</small></div></div></div>';

        var booster = "";

                '<small>' + (used ? "Radar allaqachon ishlatilgan" : (affordable ? "20 tanga evaziga 3 ta noto\u2018g\u2018ri lokatsiya o\u2018chiriladi" : "Tangalar yetarli emas")) + '</small></span>' +
              '<span class="mb-price">' + (used ? "Faol" : price + " " + icon("coin")) + '</span></button></section>';

              : '') +
            '<p class="muted tiny">G\u2018oliblarga mos ravishda +25 / +35 tanga berildi.</p></section>';
        }

        var tally = "";
        if (isHost && (status === "PLAYING" || status === "VOTING") && state.votes_count > 0) {
          tally = '<button class="btn block" data-act="spy-tally"' + (view.spyActionBusy ? " disabled" : "") + '>' + icon("ballot") + ' Ovozlarni yakunlash</button>';

        app.innerHTML =

            '<div class="emoji">' + icon("map-pin") + '</div>' +
            '<h2>Xona topilmadi</h2>' +

            '<button class="btn primary" data-act="home">Bosh sahifaga qaytish</button>' +
          '</div>';
      }

      async function loadRoomData(silent) {
        try {
          var roomData = await fetchRoom(view.code);
          var meData = null;
          try {
            meData = await fetchMe(view.code);
          } catch (meError) {
            if (meError.status !== 404) throw meError;
          }
          view.loading = false;
          view.error = null;
          var room = roomData.state;
          var me = meData ? meData.me : null;
          var roomSig = JSON.stringify(room);
          var meSig = JSON.stringify(me);
          var changed = roomSig !== view.lastRoomSig || meSig !== view.lastMeSig;
          if (changed) announceTransitions(view.room, room);
          view.room = room;
          view.me = me;
          view.lastRoomSig = roomSig;
          view.lastMeSig = meSig;
          if (changed || !silent) renderRoom(true);
        } catch (error) {
          view.loading = false;
          if (silent && view.room) {
            return;
          }
          view.error = error;
          renderRoomError(error);
        }
      }

      function renderRoom(keepScroll) {
        if (!view.room) return;
        var room = view.room;
        var scrollY = keepScroll ? window.scrollY : 0;
        var me = view.me;
        var status = room.status;
        var players = room.players || [];
        var alive = players.filter(function (player) { return player.is_alive; });
        var myVoteTarget = view.selected;

        var html = '<div class="topbar">' +
          '<button class="icon-btn" data-act="home" aria-label="Orqaga">' + icon("arrow-left") + '</button>' +
          '<div class="room-id"><span class="room-code">' + esc(room.code) + '</span>' +
            '<span class="status-pill ' + statusClass(status) + '">' + esc(STATUS_LABELS[status] || status) + '</span></div>' +
          '<div class="round-chip">' + (room.current_round ? "Raund " + room.current_round : "Lobby") + '</div>' +
          timerHtml(room) +
        '</div>';

        html += catastropheHtml(room);

        if (status === "FINISHED") {
          html += finishedHtml(room);
        }

        if (!me && status === "LOBBY") {
          html += joinRoomHtml(room);
        } else if (!me) {
          html += '<div class="notice">⏳ O\'yin allaqachon boshlangan. Siz kuzatuvchisiz — keyingi o\'yinni kuting.</div>';
        }

        if (me) {
          html += myCardsHtml(me, status);
        }

        html += playersHtml(room, me);
        html += controlsHtml(room, me, alive);

        html += '<div class="footer">Revilend Games · Xona ' + esc(room.code) + '</div>';

        app.innerHTML = '<main class="fade">' + html + '</main>';
        if (keepScroll) window.scrollTo(0, scrollY);
        ensureTimer(room);
      }
