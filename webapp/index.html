          '<h1>' + esc(cat.name || "Noma'lum falokat") + '</h1>' +
          '<p>' + esc(cat.description || "") + '</p>' +
          '<div class="cat-grid">' +
            '<div class="cat-block"><h4>' + icon("bag") + ' Bunker zaxirasi</h4>' + listHtml(supplies) + '</div>' +
            '<div class="cat-block"><h4>' + icon("check") + ' Omon qolish</h4>' + listHtml(requirements) + '</div>' +
          '</div>' +

      function listHtml(items) {
        if (!items.length) return '<p class="muted tiny">Ma\'lumot yo\'q</p>';

          return '<li>' + esc(item) + '</li>';

      function epilogueText(room, survivors) {
        var catastrophe = (room.catastrophe && room.catastrophe.name) || "falokat";
        var count = survivors.length;
        var capacity = room.bunker_capacity || 0;
        var first;
        if (!count) {
          first = "Bunker eshigi hech kim omon qolmasdan yopildi va " + catastrophe +

      function connectSocket() {
        if (!view.code) return;
        stopSocket();
        var protocol = window.location.protocol === "https:" ? "wss" : "ws";
        var socket;
        try {
          socket = new WebSocket(protocol + "://" + window.location.host + "/ws/" + encodeURIComponent(view.code));
        } catch (err) {
          view.wsTimer = setTimeout(connectSocket, 4000);
          return;
        }
        view.ws = socket;

        socket.onmessage = function (event) {
          var message;
          try { message = JSON.parse(event.data); } catch (err) { return; }
          if (message.type === "state" && message.state) {
            applyRemoteRoom(message.state);
          }
        };
        socket.onclose = function () {
          if (view.ws === socket) view.ws = null;
          if (view.code) {
            view.wsTimer = setTimeout(connectSocket, 4000);
          }
        };
        socket.onerror = function () {
          try { socket.close(); } catch (err) { /* ignore */ }
        };
      }

      function stopSocket() {
        if (view.wsTimer) {
          clearTimeout(view.wsTimer);
          view.wsTimer = null;
        }
        if (view.ws) {
          var socket = view.ws;
          view.ws = null;
          try { socket.close(); } catch (err) { /* ignore */ }
        }
      }

      function startPolling() {
        stopPolling();
        view.pollTimer = setInterval(function () {
          if (view.code && !view.busy) loadRoomData(true);
        }, 5000);
      }

      function stopPolling() {
        if (view.pollTimer) {
          clearInterval(view.pollTimer);
          view.pollTimer = null;
        }
      }

      function stopLive() {
        stopSocket();
        stopPolling();
      }

      function applyRemoteRoom(room) {
        if (!room || room.code !== view.code) return;
        var sig = JSON.stringify(room);
        if (sig === view.lastRoomSig) return;
        announceTransitions(view.room, room);
        view.room = room;
        view.lastRoomSig = sig;
        if (room.status !== "PLAYING" && room.status !== "VOTING") view.selected = null;
        renderRoom(true);
      }

      // ----------------------------------------------------------------
      // Harakatlar
      // ----------------------------------------------------------------
      async function sendAction(payload, successMessage) {
        if (view.busy) return;
        view.busy = true;
        var flipKey = payload.action === "reveal" ? payload.card_type : null;
        if (flipKey) {
          if (view.flipTimer) {
            clearTimeout(view.flipTimer);
            view.flipTimer = null;
          }
          view.flipKey = flipKey;
        }
        try {
          var data = await postAction(view.code, payload);
          var announced = announceTransitions(view.room, data.state);
          if (data.coins != null) profile.balance = Number(data.coins) || 0;
          view.room = data.state;
          view.me = data.me;
          view.lastRoomSig = JSON.stringify(data.state);
          view.lastMeSig = JSON.stringify(data.me);
          if (payload.action === "vote" || payload.action === "tally") view.selected = null;
          renderRoom(true);

          if (flipKey) {
            haptic("heavy");
            view.flipTimer = setTimeout(function () {
              if (view.flipKey !== flipKey) return;
              view.flipKey = null;
              view.flipTimer = null;
              renderRoom(true);
            }, 900);
          }

          if (data.result && data.result.tie) {
            toast("Ovozlar teng — hech kim haydalmadi");
          } else if (data.result && data.result.eliminated && !announced) {
            toast(data.result.eliminated.full_name + " haydaldi", "error");
          } else if (successMessage) {
            toast(successMessage);
          }
        } catch (error) {
          if (flipKey && view.flipKey === flipKey) view.flipKey = null;
          toast(error.message || "Xatolik yuz berdi", "error");
          if (error.status === 404) loadRoomData(false);
        } finally {
          view.busy = false;
        }
      }

      async function joinRoom() {
        var name = (profile.name || "").trim();
        if (!name) {
          var input = document.getElementById("guest-name");
          name = input ? input.value.trim() : "";
        }
        if (!name) {
          toast("Ismingizni kiriting", "error");
          return;
        }
        if (profile.guest) {
          profile.name = name;
          window.sessionStorage.setItem("rg_guest_name", name);
        }
        await sendAction({ action: "join", full_name: name, username: profile.username }, "Xonaga qo'shildingiz!");
      }

      async function refreshMatchmakingStatus(gameType) {
        try {
          var result = await request("/api/matchmaking/status?game_type=" + encodeURIComponent(gameType));
          if (view.matchmaking[gameType]) {
            view.matchmaking[gameType].count = result.count;
            view.matchmaking[gameType].required = result.required;
            renderHub();
          }
        } catch (error) {
          console.warn("Matchmaking holatini olib bo'lmadi:", error);
        }
      }

      function startMatchmakingPolling() {
        if (view.matchmakingTimer) return;
        view.matchmakingTimer = setInterval(function () {
          Object.keys(view.matchmaking).forEach(refreshMatchmakingStatus);
        }, 5000);
      }

      async function leaveMatchmaking(gameType, button) {
        if (button) button.disabled = true;
        try {
          await request("/api/matchmaking/leave", { method: "POST" });
          view.matchmaking = {};
          renderHub();
          if (!Object.keys(view.matchmaking).length && view.matchmakingTimer) {
            clearInterval(view.matchmakingTimer);
            view.matchmakingTimer = null;
          }
          toast("Navbatdan chiqdingiz");
        } catch (error) {
          toast(error.message || "Navbatdan chiqib bo'lmadi", "error");
        } finally {
          if (button) button.disabled = false;
        }
      }

      function stopMatchmakingPolling() {
        if (view.matchmakingTimer) {
          clearInterval(view.matchmakingTimer);
          view.matchmakingTimer = null;
        }
      }

      async function joinMatchmaking(gameType, button) {
        if (button) button.disabled = true;
        try {
          var result = await request("/api/matchmaking/join", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ game_type: gameType })
          });
          if (result.status === "matched") {
            view.matchmaking = {};
            stopMatchmakingPolling();
            toast("Xona tayyor! " + result.room_code);
            if (gameType === "mafia") enterMafia(result.room_code);
            else if (gameType === "spyfall") enterSpy(result.room_code);
            else enterRoom(result.room_code);
            return;
          }
          view.matchmaking = {};
          view.matchmaking[gameType] = {
            count: result.count,
            required: result.required
          };
          renderHub();
          startMatchmakingPolling();
          toast(result.count + "/" + result.required + " kishi qidirilmoqda");
        } catch (error) {
          toast(error.message || "Navbatga qo'shilmadi", "error");
        } finally {
          if (button) button.disabled = false;
        }
      }

      function handleClick(event) {
        var button = event.target.closest("[data-act]");
        if (!button || !app.contains(button)) return;
        var act = button.getAttribute("data-act");

        if (act === "leave-match") {\n          leaveMatchmaking(button.getAttribute("data-game"), button);\n        } else if (act === "leaderboard-period") {
          view.activityPeriod = button.getAttribute("data-period") === "weekly" ? "weekly" : "all";
          renderHub();
        } else if (act === "join-match") {\n          joinMatchmaking(button.getAttribute("data-game"), button);\n        } else if (act === "home") {
          goHome();
        } else if (act === "logout") {
          logout();
        } else if (act === "login-telegram") {
          openTelegramLogin();
        } else if (act === "invite") {
          shareInvite();
        } else if (act === "open-bunker") {
          var input = document.getElementById("room-code");
          if (input) {
            input.focus();
            input.scrollIntoView({ behavior: "smooth", block: "center" });
          }
        } else if (act === "open-spyfall") {
          view.spyEntry = true;
          renderHub();
        } else if (act === "spy-entry-close") {
          view.spyEntry = false;
          renderHub();
        } else if (act === "spy-create") {
          createSpyRoom();
        } else if (act === "spy-start") {
          spyPost("start", {}, "O'yin boshlandi!");
        } else if (act === "spy-flip") {
          var spyCard = app.querySelector(".tarot-card");
          if (spyCard) spyCard.classList.add("flipped");
          view.spyOpen = true;
          button.disabled = true;
          button.textContent = "Karta ochildi";
          haptic("success");
        } else if (act === "open-mafia") {
          var mafiaInput = document.getElementById("room-code");
          var mafiaCode = mafiaInput ? mafiaStartCode(mafiaInput.value) : "";
          if (mafiaCode) {
            enterMafia(mafiaCode);

          if (mafiaInput) {

            mafiaInput.scrollIntoView({ behavior: "smooth", block: "center" });
          }
          toast("Guruhdagi Mafiya havolasini oching yoki MAF kodini kiriting");
        } else if (act === "spy-pick") {
          view.spyGuessKey = button.getAttribute("data-key");
          renderSpy();
        } else if (act === "spy-rule") {
          var ruleKey = button.getAttribute("data-key");
          var ruledMap = spyRuled();
          if (ruledMap[ruleKey]) delete ruledMap[ruleKey];
          else ruledMap[ruleKey] = true;
          renderSpy();
        } else if (act === "spy-guess") {
          if (!view.spyGuessKey) {
            toast("Avval lokatsiyani tanlang", "error");
            return;
          }
          spyPost("guess", { location: view.spyGuessKey });
        } else if (act === "spy-hint") {
          spyPost("hint", {}, "Radar yoqildi: 3 ta noto'g'ri joy o'chirildi");
        } else if (act === "spy-vote-select") {
          view.spyVoteTarget = Number(button.getAttribute("data-target"));
          renderSpy();
        } else if (act === "spy-vote-submit") {
          if (view.spyVoteTarget == null) {
            toast("Avval o'yinchini tanlang", "error");
            return;
          }
          spyPost("vote", { target_id: Number(view.spyVoteTarget) });
        } else if (act === "spy-tally") {
          spyPost("tally", {}, "Ovozlar sanaldi");
        } else if (act === "flip-mafia") {
          var tarot = app.querySelector(".tarot-card");
          if (tarot) tarot.classList.add("flipped");
          var reveal = app.querySelector("[data-reveal]");
          if (reveal) reveal.hidden = false;
          button.disabled = true;
          button.textContent = "Karta ochildi";
          view.mafiaOpen = true;
          haptic("success");
        } else if (act === "mafia-booster") {
          buyMafiaBooster(button.getAttribute("data-booster"));
        } else if (act === "mafia-night-submit") {
          var nightKind = document.getElementById("mafia-night-kind");
          var nightTarget = document.getElementById("mafia-night-target");
          if (!nightTarget || !nightTarget.value) {
            toast("Nishonni tanlang", "error");
            return;
          }
          submitMafiaAction("night-action", {
            kind: nightKind ? nightKind.value : (view.mafiaState.night_actions[0] || {}).key,
            target_id: Number(nightTarget.value)
          });
        } else if (act === "mafia-begin-voting") {
          submitMafiaAction("begin-voting", {});
        } else if (act === "mafia-vote-select") {
          view.mafiaVoteTarget = Number(button.getAttribute("data-target"));
          renderMafia();
        } else if (act === "mafia-vote-submit") {
          if (view.mafiaVoteTarget == null) {
            toast("Avval o‘yinchini tanlang", "error");
            return;
          }
          submitMafiaAction("vote", { target_id: Number(view.mafiaVoteTarget) });
        } else if (act === "mafia-tally") {
          var kamikazeTarget = document.getElementById("mafia-kamikaze-target");
          submitMafiaAction("tally", {
            kamikaze_target_id: kamikazeTarget && kamikazeTarget.value
              ? Number(kamikazeTarget.value)
              : null
          });
        } else if (act === "reveal") {
          sendAction({ action: "reveal", card_type: button.getAttribute("data-card") }, "Karta ochildi");
        } else if (act === "select") {
          view.selected = Number(button.getAttribute("data-target"));
          var targets = app.querySelectorAll(".vote-target");
          for (var i = 0; i < targets.length; i += 1) {
            targets[i].classList.toggle("sel", Number(targets[i].getAttribute("data-target")) === view.selected);
          }
          var voteButton = app.querySelector('[data-act="vote"]');
          if (voteButton) voteButton.disabled = false;
        } else if (act === "vote") {
          if (view.selected == null) {
            toast("Avval o'yinchini tanlang", "error");
            return;
          }
          sendAction({ action: "vote", target_id: view.selected }, "Ovoz berildi");
        } else if (act === "tally") {
          sendAction({ action: "tally" }, "Ovozlar sanaldi");
        } else if (act === "start") {
          sendAction({ action: "start" }, "O'yin boshlandi!");
        } else if (act === "shop") {
          openShop();
        } else if (act === "shop-close") {
          view.shopOpen = false;
          view.shopPackage = null;
          renderHub();
        } else if (act === "shop-pack") {
          view.shopPackage = Number(button.getAttribute("data-coins"));
          renderHub();
        } else if (act === "shop-pay") {
          openShopPayment();
        } else if (act === "claim-bonus") {
          claimBonus();
        } else if (act === "claim-mission") {
          claimMission(button.getAttribute("data-mission"));
        } else if (act === "promo") {
          redeemPromo();
        } else if (act === "shield-accept") {
          sendAction({ action: "booster", booster: "shield" }, "Qalqon faollashtirildi!");
        } else if (act === "shield-decline") {
          sendAction({ action: "shield_decline" }, "Qalqon rad etildi");
        } else if (act === "booster") {
          sendAction({ action: "booster", booster: button.getAttribute("data-booster") }, "Booster faollashtirildi");
        } else if (act === "reroll") {
          var select = document.getElementById("reroll-card");
          var cardType = select ? select.value : "";
          if (!cardType) {
            toast("Almashtirish uchun karta tanlang", "error");
            return;
          }
          sendAction({ action: "booster", booster: "reroll", card_type: cardType }, "Karta almashtirildi");
        }
      }

      function handleSubmit(event) {
        if (event.target.id === "login-form") {
          event.preventDefault();
          var loginInput = document.getElementById("login-input");
          submitLogin(loginInput ? loginInput.value : "");
          return;
        }
        if (event.target.id === "spy-entry-form") {
          event.preventDefault();
          var spyInput = document.getElementById("spy-entry-code");
          var spyValue = spyStartCode(spyInput ? spyInput.value : "");
          if (!spyValue) {
            toast("Kod SPY123 ko'rinishida bo'lishi kerak", "error");
            return;
          }
          enterSpy(spyValue);
          return;
        }
        if (event.target.id === "join-form") {
          event.preventDefault();
          var input = document.getElementById("room-code");
          var code = normalizeCode(input ? input.value : "");
          if (!/^[A-Z0-9]{6}$/.test(code)) {
            toast("Xona kodi 6 belgidan iborat bo'lishi kerak", "error");
            return;
          }
          if (/^MAF\d{3}$/.test(code)) {
            enterMafia(code);
            return;
          }
          if (/^SPY\d{3}$/.test(code)) {
            enterSpy(code);
            return;
          }
          window.location.href = window.location.pathname + "?room=" + encodeURIComponent(code);
        } else if (event.target.id === "room-join-form") {
          event.preventDefault();
          joinRoom();
        }
      }

      // ----------------------------------------------------------------
      // Ishga tushirish
      // ----------------------------------------------------------------
      app.addEventListener("click", handleClick);
      app.addEventListener("submit", handleSubmit);
      app.addEventListener("change", function (event) {
        if (!event.target) return;
        if (event.target.id === "mafia-night-kind") {
          view.mafiaActionKind = event.target.value;
          view.mafiaActionTarget = null;
          renderMafia();
        } else if (event.target.id === "mafia-night-target") {
          view.mafiaActionTarget = Number(event.target.value);
        } else if (event.target.id === "mafia-kamikaze-target") {
          view.mafiaKamikazeTarget = event.target.value
            ? Number(event.target.value)
            : null;
        }
      });
      app.addEventListener("click", function (event) {
        var button = event.target.closest("button");
        if (button && !button.disabled) haptic("medium");
      }, true);

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (tg.BackButton) {
            tg.BackButton.onClick(function () {
              haptic("medium");
              goHome();
            });
          }
          if (tg.onEvent) {
            tg.onEvent("themeChanged", applyTelegramTheme);
            tg.onEvent("viewportChanged", function () {
              if (tg.isExpanded === false) tg.expand();
            });
          }
        } catch (err) { /* eski versiya */ }
        applyTelegramTheme();
      }

      // Avval foydalanuvchi aniqlanadi (initData yoki ?uid=...), keyin
      // start_param / havola bo'yicha kerakli xona ochiladi.
      async function boot() {
        if (!profile || !profile.authenticated) {
          renderLoginScreen();
          return;
        }
        // Oldin kirilgan profil keshdan darhol ko'rsatiladi, keyin serverdan
        // yangilanadi — foydalanuvchi tarmoqni kutmaydi.
        var hadCachedProfile = Boolean(profile.fromCache);
        if (!view.code && hadCachedProfile) {
          renderHub();
          loadActivity();
        }
        await loadAccount();
        if (!profile.authenticated) return;
        if (initialSpyCode) {
          enterSpy(initialSpyCode);
        } else if (initialMafiaCode) {
          enterMafia(initialMafiaCode);
        } else if (view.code) {
          if (/^SPY\d{3}$/.test(view.code)) enterSpy(view.code);
          else enterRoom(view.code);
        } else if (!hadCachedProfile) {
          renderHub();
          loadActivity();
        }
      }

      boot();
    })();
  </script>
</body>
</html>
