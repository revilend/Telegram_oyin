<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0713" />
  <title>Revilend Games</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --bg: #070b16;
      --bg-soft: #0d1324;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-strong: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f2f4fb;
      --muted: #98a1bb;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --on-accent: #0a0f1f;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --radius: 20px;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}

    * { box-sizing: border-box; }

    /* Mobil brauzerlarda ko'k tap-highlight va matn belgilanishini o'chirish. */
    *, *::before, *::after {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
}

    /* Kiritish maydonlarida matnni belgilash va nusxa olish ishlashi kerak. */
    input, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
}

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
}

    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(139, 92, 246, 0.28), transparent 65%),
        radial-gradient(700px 380px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 60%),
        var(--bg);
}

    #app {
      max-width: 620px;
      margin: 0 auto;
      padding: 8px 16px calc(28px + env(safe-area-inset-bottom));
      min-height: 100vh;
      padding-bottom: 90px !important;
}

    .page-body {
      padding-bottom: 90px !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
}

    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; line-height: 1.5; }

    /* ---------- Brand / header ---------- */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      padding-bottom: 12px;
      margin-bottom: 14px;
      background: var(--bg);
      box-shadow: 0 12px 18px -16px rgba(0, 0, 0, 0.75);
}

    .brand-left { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--on-accent);
      box-shadow: 0 8px 22px rgba(139, 92, 246, 0.35);
}

    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }

    .profile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      max-width: 46%;
}

    .profile-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
}

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #a855f7);
}

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
}

    .avatar.sm { width: 40px; height: 40px; min-width: 40px; font-size: 13px; }

    /* ---------- Hub ---------- */
    .hero { margin-bottom: 22px; }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent-2);
      font-weight: 700;
      margin-bottom: 8px;
}

    .hero h1 {
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.6px;
      margin-bottom: 10px;
}

    .hero p { color: var(--muted); font-size: 14px; line-height: 1.55; }

    .section-title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin: 24px 2px 12px;
}

    .section-title h2 { font-size: 16px; letter-spacing: -0.2px; }
    .section-title span { font-size: 12px; color: var(--muted); }

    .game-card {
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
}

    .game-card.active { border-color: rgba(139, 92, 246, 0.45); box-shadow: 0 14px 34px rgba(88, 51, 189, 0.18); }
    .game-card.active::after {
      content: "";
      position: absolute;
      inset: auto -40px -70px auto;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
      pointer-events: none;
}

    .game-icon {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
}

    .game-body { flex: 1; min-width: 0; }
    .game-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .game-name { font-weight: 700; font-size: 16px; }

    .game-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
}

    .game-meta { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 0.3px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      white-space: nowrap;
}

    .badge.live { background: rgba(52, 211, 153, 0.14); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge.soon { background: rgba(255, 255, 255, 0.06); color: var(--muted); border: 1px solid var(--border); }
    .badge.host { background: rgba(251, 191, 36, 0.14); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge.me { background: rgba(34, 211, 238, 0.13); color: var(--accent-2); border: 1px solid rgba(34, 211, 238, 0.3); }

    .play-btn {
      flex: 0 0 auto;
      border: 0;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--on-accent);
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
}

    .play-btn[disabled] { cursor: default; color: var(--muted); background: rgba(255, 255, 255, 0.06); }

    .panel {
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
}

    .panel h2 { font-size: 15px; margin-bottom: 12px; }

    .join-form { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
}

    input[type="text"]:focus { border-color: rgba(139, 92, 246, 0.7); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    input::placeholder { letter-spacing: 2px; color: #5c6580; }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      background: var(--panel-strong);
      border: 1px solid var(--border);
      transition: transform 0.12s ease, opacity 0.12s ease;
}

    .btn:active { transform: scale(0.98); }
    .btn[disabled] { opacity: 0.45; cursor: default; }

    .btn.primary {
      color: var(--on-accent);
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      border: 0;
}

    .btn.danger { color: #1a0505; background: linear-gradient(135deg, #fca5a5, #f87171); border: 0; }
    .btn.block { width: 100%; }
    .btn.small { padding: 9px 12px; font-size: 12px; border-radius: 11px; }

    .footer { margin-top: 26px; text-align: center; font-size: 11px; color: #5f6884; letter-spacing: 0.5px; }

    /* ---------- Kunlik bonus, missiyalar, reyting ---------- */
    .panel.bonus-card {
      margin-top: 0;
      background:
        radial-gradient(260px 120px at 100% 0%, rgba(251, 191, 36, 0.18), transparent 70%),
        var(--panel);
      border-color: rgba(251, 191, 36, 0.28);
}
    .bonus-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .bonus-days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .bonus-day {
      font-size: 10px; font-weight: 700; color: var(--muted);
      padding: 5px 7px; border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(148, 163, 184, 0.08);
}
    .bonus-day.now {
      color: #bae6fd; border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
}
    .bonus-head h2 { margin-bottom: 4px; }
    .mission-list { display: flex; flex-direction: column; gap: 8px; }
    .mission {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      border-radius: 15px; background: var(--panel); border: 1px solid var(--border);
}
    .mission.ready { border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }
    .mission .m-emoji { font-size: 20px; width: 28px; text-align: center; }
    .mission .m-body { flex: 1; min-width: 0; }
    .m-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; }
    .m-title .m-reward { font-size: 11px; color: var(--warning); white-space: nowrap; }
    .m-desc { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .m-bar { margin-top: 6px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
    .m-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .m-progress { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .mission .btn.small { flex: 0 0 auto; }
    .top-list { display: flex; flex-direction: column; gap: 6px; }
    .top-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
}
    .top-row.me { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.14); }
    .top-rank { width: 22px; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
    .top-row .t-name { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-row .t-rating { font-size: 11px; color: var(--warning); white-space: nowrap; }
    .promo-row { display: flex; gap: 8px; margin-top: 14px; }
    .promo-row input { letter-spacing: 0; text-transform: uppercase; padding: 12px 14px; font-size: 14px; }
    .promo-row .btn { flex: 0 0 auto; }

    /* ---------- Room ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 14px;
      background: var(--bg);
      backdrop-filter: blur(12px);
}

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
}

    .room-id { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .room-code { font-weight: 800; letter-spacing: 2px; font-size: 16px; }

    .status-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
}

    .status-pill.PLAYING { color: var(--success); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }
    .status-pill.VOTING { color: var(--warning); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.1); }
    .status-pill.FINISHED { color: var(--accent-2); border-color: rgba(34, 211, 238, 0.35); background: rgba(34, 211, 238, 0.1); }

    .round-chip { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .catastrophe {
      position: relative;
      border-radius: 24px;
      padding: 20px;
      overflow: hidden;
      background:
        radial-gradient(500px 220px at 100% 0%, rgba(248, 113, 113, 0.22), transparent 60%),
        linear-gradient(155deg, rgba(139, 92, 246, 0.22), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
}

    .cat-eye {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fca5a5;
      margin-bottom: 8px;
      text-transform: uppercase;
}

    .catastrophe h1 { font-size: 23px; letter-spacing: -0.4px; line-height: 1.2; margin-bottom: 8px; }
    .catastrophe > p { font-size: 13px; line-height: 1.6; color: #cdd3e6; white-space: pre-line; }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    .cat-block {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px;
}

    .cat-block h4 { font-size: 11px; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .cat-block ul { margin: 0; padding-left: 16px; }
    .cat-block li { font-size: 12px; line-height: 1.5; color: #dde2f2; margin-bottom: 3px; }

    .stat-row { display: flex; gap: 8px; margin-top: 14px; }
    .stat {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 13px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.07);
}
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; }

    .block-head { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 2px 10px; }
    .block-head h2 { font-size: 16px; }
    .block-head span { font-size: 11px; color: var(--muted); }

    .cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .card {
      position: relative;
      border-radius: 16px;
      padding: 13px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 138px;
}

    .card.revealed { border-color: rgba(139, 92, 246, 0.45); background: linear-gradient(160deg, rgba(139, 92, 246, 0.18), rgba(34, 211, 238, 0.06)); }
    .card-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .card-top .emoji { font-size: 15px; }
    .card h3 { font-size: 14px; line-height: 1.3; margin: 9px 0 5px; }
    .card p { font-size: 11.5px; line-height: 1.45; color: #c3cbe1; white-space: pre-line; }
    .card-lock { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 22px; gap: 2px; }
    .card-lock small { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .card .btn { margin-top: 10px; }
    .card .revealed-stamp { margin-top: auto; }
    .flip-front .revealed-stamp { margin-top: auto; }

    .players { display: flex; flex-direction: column; gap: 8px; }

    .player {
      display: flex;
      gap: 12px;
      padding: 13px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
}

    .player.dead { opacity: 0.55; }
    .player.dead .avatar { filter: grayscale(1); }
    .p-body { flex: 1; min-width: 0; }
    .p-name { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 700; }
    .p-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip {
      font-size: 10.5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.28);
      color: #ddd6fe;
}

    .vote-panel { margin-top: 18px; padding: 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
    .vote-panel h2 { font-size: 15px; margin-bottom: 5px; }
    .vote-panel > p { font-size: 12px; margin-bottom: 12px; }

    .vote-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }

    .vote-target {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
}

    .vote-target .name { flex: 1; font-weight: 600; }
    .vote-target .count { font-size: 11px; color: var(--muted); }
    .vote-target.sel { border-color: rgba(248, 113, 113, 0.7); background: rgba(248, 113, 113, 0.12); box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.08); }
    .vote-target[disabled] { opacity: 0.4; cursor: default; }

    .notice {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 15px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
}

    .finished {
      margin-top: 18px;
      padding: 20px;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(52, 211, 153, 0.16), rgba(34, 211, 238, 0.08));
      border: 1px solid rgba(52, 211, 153, 0.35);
      text-align: center;
}

    .finished .big { font-size: 34px; margin-bottom: 6px; }
    .finished h2 { font-size: 19px; margin-bottom: 6px; }
    .finished p { font-size: 13px; color: #c7f5e4; line-height: 1.5; }

    .join-room { margin-top: 18px; padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
    .join-room h2 { font-size: 16px; margin-bottom: 6px; }
    .join-room p { font-size: 12px; margin-bottom: 12px; }
    .join-room input { width: 100%; letter-spacing: 0; text-transform: none; margin-bottom: 10px; }

    .state-screen { text-align: center; padding: 70px 20px; }
    .state-screen .emoji { font-size: 46px; margin-bottom: 14px; }
    .state-screen h2 { font-size: 20px; margin-bottom: 8px; }
    .state-screen p { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }

    .skeleton {
      height: 120px;
      border-radius: var(--radius);
      background: linear-gradient(100deg, rgba(255, 255, 255, 0.04) 20%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 80%);
      background-size: 220% 100%;
      animation: shimmer 1.4s infinite linear;
      margin-bottom: 12px;
}

    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .fade { animation: none; }
    /* Kirish animatsiyasi faqat #app tugunida: u qayta yaratilmaydi,
       shuning uchun poll/WebSocket yangilanishlari uni qayta boshlamaydi. */
    #app { animation: fadein 0.25s ease both; }

    /* Hub: bir martalik silliq fade-in va yuklash paytida zaxira balandlik */
    .hub-main .fade { animation: none; }
    .hub-main .profile-card { min-height: 330px; }
    .hub-main .bonus-card { min-height: 215px; }

    /* ---------- Raund taymeri ---------- */
    .timer-box { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }

      position: absolute;

      transform: translateX(-50%);

      border: 2px solid #334155;

        linear-gradient(90deg, #222c40 0 47%, #070a12 47% 53%, #222c40 53% 100%);

      animation: doorShut 0.9s cubic-bezier(0.4, 0, 0.2, 1) both;
}

      content: "";

      bottom: 0;

    /* ---------- Omad gʻildiragi (Roulette Wheel) ---------- */
    .wheel-sheet { text-align: center; }
    .wheel-wrap {
      position: relative;
      width: min(74vw, 280px);
      aspect-ratio: 1 / 1;
      margin: 6px auto 14px;
      touch-action: none;
    }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 0 6px rgba(139, 92, 246, 0.18),
        0 0 0 12px rgba(13, 9, 23, 0.6),
        0 18px 50px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s linear;
      will-change: transform;
      position: relative;
    }
    .wheel.spinning {
      animation-name: wheelSpin;
      animation-timing-function: ease-out;
      animation-fill-mode: forwards;
    }
    @keyframes wheelSpin {
      0%   { transform: rotate(0deg); }
      5%   { transform: rotate(120deg); }
      20%  { transform: rotate(420deg); }
      50%  { transform: rotate(900deg); }
      80%  { transform: rotate(1440deg); }
      95%  { transform: rotate(1920deg); }
      100% { transform: rotate(var(--wheel-final, 2160deg)); }
    }
    .wheel-pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 18px solid #a78bfa;
      filter: drop-shadow(0 4px 8px rgba(139, 92, 246, 0.7));
      z-index: 3;
    }
    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: #f2f4fb;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 2;
      transition: color 0.2s ease;
    }
    .wheel-result {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      font-size: 14px;
      font-weight: 700;
      color: #f2f4fb;
      margin-bottom: 12px;
      animation: fadeSlideUp 0.3s ease both;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shopUp { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes cardFlip { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
    @keyframes doorShut { from { transform: translateX(-50%) scaleY(0.86) translateY(-8px); opacity: 0.4; } to { transform: translateX(-50%) scaleY(1) translateY(0); opacity: 1; } }
    @keyframes warningPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes timerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes votePop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }

    /* ================================================================
       Premium cyber-gothic qatlam: neon, oltin, qonli urg'u va shisha
       ================================================================ */
    :root {
      --neon: #00f0ff;
      --gold: #ffd700;
      --blood: #ff3b5c;
      --glass: rgba(255, 255, 255, 0.045);
}
    body {
      background:
        radial-gradient(900px 500px at 8% -12%, rgba(0, 240, 255, 0.13), transparent 62%),
        radial-gradient(780px 440px at 102% -4%, rgba(255, 215, 0, 0.08), transparent 58%),
        radial-gradient(760px 620px at 50% 118%, rgba(255, 59, 92, 0.10), transparent 62%),
        #06070c !important;
}
    .panel, .profile-card, .hero, .notice, .match-card, .mission,
    .lb-row, .shop-sheet, .state-screen, .mafia-reveal {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
}
    .panel, .profile-card, .mission, .match-card, .state-screen {
      background: linear-gradient(160deg, rgba(255,255,255,0.055), rgba(255,255,255,0.018));
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 48px rgba(0,0,0,0.46), inset 0 1px 0 rgba(255,255,255,0.05);
}
    .hero h1 {
      background: linear-gradient(92deg, #ffffff 0%, #9df7ff 48%, #ffd700 100%);

      background-clip: text;
      color: transparent;
      text-shadow: 0 0 34px rgba(0, 240, 255, 0.22);
}
    .btn.primary {
      background: linear-gradient(135deg, #00f0ff, #009dff 70%);

      box-shadow: 0 12px 32px rgba(0, 240, 255, 0.32);
}
    .btn.primary:active { box-shadow: 0 4px 14px rgba(0, 240, 255, 0.4); }
    .btn.sel { border-color: rgba(255,215,0,.5); color: var(--gold); }
    .badge.live { border-color: rgba(0,240,255,.4); color: var(--neon); }

    /* Profil: ramka nuri va unvon */

    .profile-title {

    .bomb-result { text-align: center; padding: 22px 16px; border-radius: 22px; border: 1px solid rgba(251, 146, 60, 0.32); background: radial-gradient(circle at 50% 0, rgba(251, 146, 60, 0.2), rgba(15, 23, 42, 0.7)); }

    .bomb-result h2 { font-size: 22px; margin-bottom: 6px; }
    .bomb-result p { font-size: 13px; color: var(--muted); line-height: 1.55; margin-bottom: 8px; }
    .bomb-result .bomb-coins { color: #fbbf24; font-weight: 800; }
    .bomb-boom-overlay {
      position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 24px;

      animation: bomb-flash 0.7s ease both;
}
    .bomb-boom-overlay .boom { font-size: 96px; animation: bomb-pop 0.65s cubic-bezier(.2, 1.5, .4, 1) both; filter: drop-shadow(0 0 32px rgba(251, 146, 60, 0.8)); }
    .bomb-boom-overlay h2 { font-size: 30px; margin: 8px 0; letter-spacing: 1px; }

}
    @keyframes bomb-pop {
      0% { transform: scale(0.2) rotate(-18deg); opacity: 0; }
      60% { transform: scale(1.18) rotate(5deg); opacity: 1; }

    /* ================================================================
       PREMIUM POLISH: jonli aurora, shisha hero va mikro-animatsiyalar
       ================================================================ */
    #app { position: relative; z-index: 1; }

    body::before {
      content: "";
      position: fixed;
      inset: -12%;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(38% 34% at 18% 22%, rgba(124, 58, 237, 0.26), transparent 70%),
        radial-gradient(34% 30% at 82% 18%, rgba(59, 130, 246, 0.20), transparent 72%),
        radial-gradient(40% 36% at 68% 84%, rgba(245, 158, 11, 0.12), transparent 72%),
        radial-gradient(30% 28% at 24% 78%, rgba(34, 211, 238, 0.10), transparent 70%);
      animation: auroraDrift 26s ease-in-out infinite alternate;
}
    @keyframes auroraDrift {
      from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
      to { transform: translate3d(1.5%, 1.5%, 0) scale(1.06); }
}

    /* Hero: alohida shisha panel */
    .hero {
      position: relative;
      overflow: hidden;
      padding: 22px 20px;
      margin: 6px 0 22px;
      border-radius: 24px;
      background:
        radial-gradient(290px 150px at 100% 0%, rgba(168, 85, 247, 0.24), transparent 70%),
        linear-gradient(150deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02)) !important;
      border: 1px solid rgba(255, 255, 255, 0.10);
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.08);
}
    .hero::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      right: -60px;
      top: -70px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.38), transparent 70%);
      pointer-events: none;
}
    .hero h1 { font-size: clamp(28px, 7vw, 36px); letter-spacing: -0.9px; }
    .hero p { max-width: 46ch; color: #c3cbe1; }

    /* O'yin kartalari: sheen va yumshoq ko'tarilish */
    .game-card {
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
}
    .game-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(115deg, transparent 25%, rgba(255, 255, 255, 0.07) 48%, transparent 65%);
      transform: translateX(-130%);
      transition: transform 0.7s ease;
}
    .game-card:hover::before { transform: translateX(130%); }
    @media (hover: hover) {
      .game-card:hover {
        transform: translateY(-2px);
        border-color: rgba(168, 85, 247, 0.35) !important;
        box-shadow:
          0 18px 42px rgba(0, 0, 0, 0.40),
          0 0 30px rgba(168, 85, 247, 0.18) !important;
}
    .game-card:active { transform: scale(0.99); }

    .game-icon {
      background: radial-gradient(circle at 30% 25%, rgba(168, 85, 247, 0.34), rgba(255, 255, 255, 0.04)) !important;
      border-color: rgba(168, 85, 247, 0.24) !important;
      box-shadow: 0 0 22px rgba(124, 58, 237, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.12);
}

    /* Bo'lim sarlavhalari oldida gradient belgi */
    .section-title h2, .block-head h2 { display: flex; align-items: center; gap: 9px; }
    .section-title h2::before, .block-head h2::before {
      content: "";
      width: 4px;
      height: 17px;
      border-radius: 999px;
      background: linear-gradient(180deg, #c084fc, #f59e0b);
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.55);
      flex: 0 0 auto;
}

    .nav-item .lucide-icon { transition: transform 0.2s ease, filter 0.2s ease; }
    .nav-item.active .lucide-icon {
      transform: translateY(-1px) scale(1.1);
      filter: drop-shadow(0 0 9px rgba(192, 132, 252, 0.8));
}

    /* Profil va bonus kartalarining o'z rang aksentlarini qaytarish */
    .profile-card {
      background:
        radial-gradient(320px 160px at 100% 0%, rgba(34, 211, 238, 0.18), transparent 65%),
        radial-gradient(280px 180px at 0% 100%, rgba(168, 85, 247, 0.22), transparent 72%),
        rgba(255, 255, 255, 0.045) !important;
      border-color: rgba(168, 85, 247, 0.32) !important;
}
    .panel.bonus-card {
      background:
        radial-gradient(260px 120px at 100% 0%, rgba(251, 191, 36, 0.22), transparent 70%),
        rgba(255, 255, 255, 0.04) !important;
      border-color: rgba(251, 191, 36, 0.30) !important;
}

    /* Skeleton: binafsha shimmer */
    .skeleton {
      background: linear-gradient(100deg, rgba(255, 255, 255, 0.035) 20%, rgba(168, 85, 247, 0.16) 45%, rgba(255, 255, 255, 0.035) 70%) !important;
      background-size: 220% 100% !important;
      animation: shimmer 1.7s linear infinite !important;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
}

    /* Kiritish maydonlari va fokus halqalari */
    input[type="text"], input[type="number"], .auth-form input, .join-form input {
      background: rgba(11, 7, 19, 0.60) !important;
      border-color: rgba(168, 85, 247, 0.26) !important;
      color: #f8fafc !important;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05);
}
    input[type="text"]:focus, input[type="number"]:focus, .auth-form input:focus {
      border-color: rgba(192, 132, 252, 0.75) !important;
      box-shadow:
        0 0 0 3px rgba(168, 85, 247, 0.16),

}
    input::placeholder { color: #8b93ad !important; }
    .btn:focus-visible, .nav-item:focus-visible, .icon-btn:focus-visible,
    input:focus-visible, button:focus-visible {
      outline: 2px solid rgba(192, 132, 252, 0.85) !important;
      outline-offset: 2px !important;
}
    .btn:hover { filter: brightness(1.08); }

    .footer { color: #7c86a5; }

    ::selection { background: rgba(168, 85, 247, 0.40); color: #ffffff; }
    * { scrollbar-width: thin; scrollbar-color: rgba(168, 85, 247, 0.55) transparent; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: linear-gradient(180deg, #8b5cf6, #f59e0b); border-radius: 999px; }
    ::-webkit-scrollbar-track { background: transparent; }
    }

    @media (prefers-reduced-motion: no-preference) {
      html { scroll-behavior: smooth; }
}
    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none !important; }
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
}
  </style>

      // ---------------- Ovoz tizimi (Web Audio API) ----------------
      var SoundManager = (function () {
        var ctx = null;
        var enabled = true;
        try { enabled = window.localStorage.getItem("rg_sound") !== "off"; } catch (err) {}
        function ensure() {
          if (!enabled) return null;
          try {
            if (!ctx) {
              var Ctor = window.AudioContext || window.webkitAudioContext;
              if (!Ctor) return null;
              ctx = new Ctor();
}
            if (ctx.state === "suspended") ctx.resume();
            return ctx;
          } catch (err) { return null; }
}
        function tone(freq, start, duration, type, gainValue) {
          var audio = ensure();
          if (!audio) return;
          var osc = audio.createOscillator();
          var gain = audio.createGain();
          var at = audio.currentTime + start;
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, at);
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(gainValue || 0.07, at + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(at);
          osc.stop(at + duration + 0.03);
}
        var presets = {
          click: function () { tone(880, 0, 0.05, "square", 0.025); tone(1320, 0.02, 0.05, "sine", 0.018); },
          card_flip: function () { tone(220, 0, 0.12, "sawtooth", 0.05); tone(520, 0.06, 0.14, "triangle", 0.06); tone(980, 0.13, 0.2, "sine", 0.035); },
          timer_tick: function () { tone(1180, 0, 0.035, "square", 0.022); },
          eliminated: function () { tone(180, 0, 0.5, "sawtooth", 0.085); tone(92, 0.18, 0.72, "sine", 0.075); },
          victory: function () { [523, 659, 784, 1046].forEach(function (f, index) { tone(f, index * 0.12, 0.3, "triangle", 0.075); }); }
        };
        return {
          isEnabled: function () { return enabled; },
          toggle: function () {
            enabled = !enabled;
            try { window.localStorage.setItem("rg_sound", enabled ? "on" : "off"); } catch (err) {}
            if (enabled) { try { presets.click(); } catch (err) {} }
            return enabled;
          },
          play: function (name) {
            if (!enabled) return;
            var preset = presets[name];
            if (!preset) return;
            try { preset(); } catch (err) {}
}
        };
      })();

      function sfx(name) {

      function formatSeconds(total) {
        var value = Math.max(0, Math.round(total));

      function stopTimer() {
        if (timer.interval) clearInterval(timer.interval);
        timer = { key: "", deadline: 0, duration: 0, status: "", interval: null };
}

      function paintTimer() {
        var element = document.querySelector("[data-timer]");
        if (!element || !timer.key) return;
        var remaining = Math.max(0, (timer.deadline - Date.now()) / 1000);
        var ratio = timer.duration ? Math.max(0, Math.min(1, remaining / timer.duration)) : 0;
        var circumference = 119.38;
        var ring = element.querySelector("[data-timer-ring]");
        var text = element.querySelector("[data-timer-text]");
        if (ring) ring.style.strokeDashoffset = String(circumference * (1 - ratio));
        if (text) text.textContent = formatSeconds(remaining);
        element.classList.toggle("low", remaining <= 15);
        element.classList.toggle("voting", timer.status === "VOTING");
        var tickValue = Math.ceil(remaining);
        if (tickValue > 0 && tickValue <= 10 && timer.lastTick !== tickValue) {
          timer.lastTick = tickValue;
          sfx("timer_tick");
          haptic("light");
}

      function ensureTimer(room) {
        if (!room || (room.status !== "PLAYING" && room.status !== "VOTING")) {
          stopTimer();
          return;
}
        var key = room.code + ":" + room.current_round + ":" + room.status;
        if (timer.key !== key) {
          stopTimer();
          var duration = TIMER_DURATIONS[room.status] || 120;
          var storageKey = "rg_timer_" + key;
          var deadline = Number(window.sessionStorage.getItem(storageKey));
          if (!deadline || deadline <= 0) {
            deadline = Date.now() + duration * 1000;
            window.sessionStorage.setItem(storageKey, String(deadline));
}
          timer.key = key;
          timer.deadline = deadline;
          timer.duration = duration;
          timer.status = room.status;
          timer.lastTick = 0;
          timer.interval = setInterval(paintTimer, 1000);
}
        paintTimer();
}

      function getTgInitData() {
        var webApp = window.Telegram && window.Telegram.WebApp;
        if (webApp && webApp.initData) {
          try { window.localStorage.setItem(TG_INIT_DATA_KEY, webApp.initData); } catch (e) {}
          return webApp.initData;
        }
        var sources = [window.location.search, window.location.hash.substring(1)];
        for (var i = 0; i < sources.length; i++) {
          if (!sources[i]) continue;
          var params = new URLSearchParams(sources[i]);
          var embedded = params.get("tgWebAppData");
          if (embedded) {
            try { window.localStorage.setItem(TG_INIT_DATA_KEY, embedded); } catch (e) {}
            return embedded;
          }
          if (params.has("hash") && params.has("user")) {
            var sourceStr = sources[i];
            try { window.localStorage.setItem(TG_INIT_DATA_KEY, sourceStr); } catch (e) {}
            return sourceStr;
          }
}
        var stored = "";
        try { stored = window.localStorage.getItem(TG_INIT_DATA_KEY) || ""; } catch (e) {}
        return stored;
}

      function pickTgUser(source) {
        if (!source || !source.id) return null;
        var user = {};
        for (var i = 0; i < TG_USER_FIELDS.length; i++) {
          var key = TG_USER_FIELDS[i];
          if (source[key] !== undefined && source[key] !== null) user[key] = source[key];
}
        user.id = Number(source.id);
        return user.id ? user : null;
}

      function readStoredTgUser() {
        try {
          var raw = window.localStorage.getItem(TG_USER_STORAGE_KEY);
          return raw ? pickTgUser(JSON.parse(raw)) : null;
        } catch (error) {
          return null;
}

      function storeTgUser(source) {
        var user = pickTgUser(source);
        if (!user) return null;
        try {
          window.localStorage.setItem(TG_USER_STORAGE_KEY, JSON.stringify(user));
        } catch (error) {
          /* localStorage yopiq bo'lsa, foydalanuvchi faqat shu sessiyada qoladi. */
}

}

      function urlParamUser() {
        try {
          var params = new URLSearchParams(window.location.search);
          var uid = Number(params.get("uid") || params.get("user_id") || 0);
          if (!uid) return null;
          return {
            id: uid,
            first_name: (params.get("fname") || params.get("full_name") || "").trim(),

      function getTgUser() {
        try {
          var webApp = window.Telegram && window.Telegram.WebApp;
          var unsafeUser = webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user;
          if (unsafeUser && unsafeUser.id) {
            try { window.localStorage.setItem(TG_USER_ID_KEY, String(unsafeUser.id)); } catch (e) {}
            return storeTgUser(unsafeUser);
          }

          var raw = getTgInitData();
          if (raw) {
            var userJson = new URLSearchParams(raw).get("user");
            if (userJson) {
              var parsed = JSON.parse(userJson);
              if (parsed && parsed.id) {
                try { window.localStorage.setItem(TG_USER_ID_KEY, String(parsed.id)); } catch (e) {}
                return storeTgUser(parsed);
              }
}

        } catch (error) {
          console.warn("Telegram foydalanuvçi ma'lumotini öqib bölmadi", error);
}
        // Pastki klaviaturadagi web_app havolasi initData yubormasligi mumkin:
        // havoladagi ?uid=&uname=&fname= parametrlaridan foydalanamiz.
        var fromUrl = urlParamUser();
        if (fromUrl) {
          try { window.localStorage.setItem(TG_USER_ID_KEY, String(fromUrl.id)); } catch (e) {}
          return storeTgUser(fromUrl);
        }
        // initData bo'sh kelganda oxirgi ma'lum foydalanuvchini xotiradan o'qiymiz.
        var storedId = 0;
        try { storedId = Number(window.localStorage.getItem(TG_USER_ID_KEY) || 0); } catch (e) {}
        if (storedId > 0) {
          var stored = readStoredTgUser();
          if (stored && stored.id === storedId) return stored;
        }
        return null;
}

              '<div class="item-main"><b>' + esc(item.title) + '</b>' +

                '<small class="item-desc">' + esc(item.description) + '</small>' +

}
        return '<div class="shop-chips">' + chips + '</div>' +
          wheel +
          '<div class="item-list">' + cards + '</div>';

      function wheelIcon(segment) {
        var key = String((segment && segment.key) || "");
        if (key.indexOf("shield") >= 0) return "shield";
        if (key.indexOf("kevlar") >= 0) return "vest";
        if (key.indexOf("spy") >= 0) return "radar";
        if (key.indexOf("vote") >= 0) return "zap";
        if (key.indexOf("frame") >= 0) return "sparkles";
        if (key.indexOf("title") >= 0) return "crown";
        return "coins";
}

      function shopItemIcon(item) {
        var slug = String((item && item.slug) || "");
        if (slug.indexOf("shield") >= 0) return "shield";
        if (slug.indexOf("kevlar") >= 0) return "vest";
        if (slug.indexOf("spy") >= 0) return "radar";
        if (slug.indexOf("double_vote") >= 0) return "zap";
        if (slug.indexOf("spin") >= 0) return "sparkles";
        if (slug.indexOf("title") >= 0) return "crown";
        if (slug.indexOf("frame") >= 0) return "sparkles";
        return "package";
}

      function wheelModalHtml() {
        if (!view.wheelOpen) return "";
        var wheel = (view.items && view.items.wheel) || { cost: 20, segments: [] };
        var segments = wheel.segments || [];
        var spin = (view.items && view.items.spin) || view.spin || { free: true, tickets: 0 };
        var colors = ["#7c3aed", "#22d3ee", "#f59e0b", "#ef4444", "#10b981", "#8b5cf6", "#f472b6", "#0ea5e9", "#eab308", "#14b8a6", "#6366f1"];
        var step = segments.length ? 360 / segments.length : 30;
        var stops = segments.map(function (segment, index) {
          return colors[index % colors.length] + " " + (index * step) + "deg " + ((index + 1) * step) + "deg";
        }).join(", ");
        var labels = segments.map(function (segment, index) {
          var angle = index * step + step / 2;
          return '<span class="wheel-label" style="transform: rotate(' + angle + 'deg) translateY(-104px) rotate(-' + angle + 'deg)">' + lucideIcon(wheelIcon(segment)) + '</span>';
        }).join("");
        var label = spin.free ? "Bepul aylantiriş" : (Number(spin.tickets) > 0 ? "Çipta bilan" : esc(wheel.cost) + ' tanga');
        var result = "";
        if (view.wheelResult) {
          var reward = view.wheelResult.reward || {};
          var text = reward.kind === "coins"
            ? '+' + esc(money(reward.coins)) + ' tanga'
            : (reward.item ? esc(reward.item.title) : 'Sovğa');
          result = '<div class="wheel-result">' + icon("sparkles") + ' Siz yutdingiz: <b>' + text + '</b></div>';
}
        return '<div class="shop-overlay"><section class="shop-sheet wheel-sheet" role="dialog" aria-modal="true" aria-label="Omad gʻildiragi">' +
          '<div class="shop-head"><div><h2>' + lucideIcon("sparkles") + ' Omad gʻildiragi</h2>' +
            '<p class="shop-lede">Kuniga bir marta bepul, keyin 20 tanga yoki çipta.</p></div>' +
            '<button class="shop-close" data-act="wheel-close" aria-label="Yopiş">' + icon("close") + '</button></div>' +
          '<div class="wheel-wrap">' +
            '<div class="wheel-pointer"></div>' +
            '<div class="wheel' + (view.wheelBusy ? " spinning" : "") + '" style="background: conic-gradient(' + stops + ')">' + labels + '</div>' +
          '</div>' + result +
          '<button class="btn primary block" data-act="wheel-spin"' + (view.wheelBusy ? " disabled" : "") + '>' + lucideIcon("sparkles") + ' ' + label + '</button>' +
          '</section></div>';
}

      async function loadShopItems() {
        view.itemsLoading = true;
        try {
          var path = "/api/shop/items" + (profile.id ? "?user_id=" + encodeURIComponent(profile.id) : "");
          var data = await request(path);
          if (data) {
            view.items = data;
            if (data.shop) view.shop = data.shop;
            if (data.equipped) {
              profile.frame = data.equipped.frame || "";
              profile.title = data.equipped.title || "";
}
            if (data.inventory) profile.inventory = data.inventory;
            if (data.spin) view.spin = data.spin;
            if (typeof data.coins === "number") profile.balance = data.coins;
}
        } catch (error) {
          toast(error.message || "Buyumlarni yuklab bölmadi", "error");
}
        view.itemsLoading = false;
}

        if (view.code) return;

      async function buyItem(slug) {
        if (!slug || view.itemBusy) return;
        view.itemBusy = true;
        try {
          var data = await request("/api/shop/buy", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id, item_slug: slug })
          });
          if (data) {
            profile.balance = Number(data.coins) || profile.balance;
            profile.inventory = data.inventory || profile.inventory;
            profile.frame = (data.equipped && data.equipped.frame) || profile.frame;
            profile.title = (data.equipped && data.equipped.title) || profile.title;
            if (view.items) view.items.inventory = data.inventory || view.items.inventory;
            toast("✅ " + data.item.title + " sotib olindi!", "success");
            haptic("success");
}

          haptic("error");

        renderHub();

      async function toggleEquip(slug, equip) {
        if (!slug || view.itemBusy) return;
        view.itemBusy = true;
        try {
          var data = await request("/api/profile/equip", {
            method: "POST",

            toast(equip ? "Taqildi" : "Yeçildi", "success");

          toast(error.message || "Amal bajarilmadi", "error");
}

      function getWheelElement() {
        return document.querySelector(".wheel-sheet .wheel");
      }

      async function spinWheel() {
        if (view.wheelBusy) return;
        view.wheelBusy = true;
        view.wheelResult = null;
        renderHub();
        var wheelEl = getWheelElement();
        if (wheelEl) {
          var segments = (view.items && view.items.wheel && view.items.wheel.segments) || [];
          var segmentCount = Math.max(8, segments.length || 8);
          var fullSpins = 5 + Math.floor(Math.random() * 4);
          var randomOffset = Math.floor(Math.random() * 360);
          var finalAngle = fullSpins * 360 + randomOffset;
          wheelEl.style.setProperty("--wheel-final", finalAngle + "deg");
          wheelEl.classList.remove("spinning");
          void wheelEl.offsetWidth;
          wheelEl.classList.add("spinning");
        }
        try {
          var data = await request("/api/spin/wheel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id })
          });
          if (data) {
            view.wheelResult = data;
            profile.balance = Number(data.coins) || profile.balance;
            profile.inventory = data.inventory || profile.inventory;
            if (view.items) {
              view.items.inventory = data.inventory || view.items.inventory;
              view.items.spin = data.spin || view.items.spin;
}
            view.spin = data.spin || view.spin;
            haptic("success");
}
        } catch (error) {
          toast(error.message || "Aylantiriş amalga oşmadi", "error");
          haptic("error");
}
        view.wheelBusy = false;
        var wheelEl2 = getWheelElement();
        if (wheelEl2) {
          setTimeout(function () {
            wheelEl2.classList.remove("spinning");
          }, 3200);
        }
        renderHub();
}

      function activityState() {
        return view.activity || { bonus: null, missions: [], quests: null, achievements: [], top: [], me: null };
}

      function waitText(seconds) {
        var value = Math.max(0, Math.round(Number(seconds) || 0));
        var hours = Math.floor(value / 3600);
        var minutes = Math.ceil((value % 3600) / 60);
        if (hours) return hours + " soat " + minutes + " daqiqadan keyin";
        return Math.max(1, minutes) + " daqiqadan keyin";
}

      var BONUS_TABLE = [25, 35, 50, 70, 100, 150, 250];

      function bonusHtml() {
        var bonus = activityState().bonus;
        if (!bonus) return "";
        var streak = Math.max(1, Number(bonus.streak) || 1);
        var next = Number(bonus.next_amount) || BONUS_TABLE[Math.min(streak, 7) - 1];
        var action = bonus.available
          ? '<button class="btn primary block" data-act="claim-bonus">' + icon("gift") + ' ' + esc(money(bonus.amount)) + ' tanga oliş</button>' +
            '<p class="muted tiny" style="margin-top:8px">Ertaga sizni +' + esc(money(next)) + ' tanga kutmoqda!</p>'
          : '<div class="notice tiny" style="margin-top:0">' + icon("hourglass") + ' Keyingi bonus ' + esc(waitText(bonus.seconds_left)) + ' · +' + esc(money(next)) + ' tanga</div>';
        var days = BONUS_TABLE.map(function (amount, index) {
          var day = index + 1;
          return '<span class="bonus-day' + (day === streak ? " now" : "") + '">' +
            day + '-kun +' + esc(money(amount)) + '</span>';
        }).join("");
        return '<section class="panel bonus-card fade">' +
          '<div class="bonus-head"><div><h2>' + icon("gift") + ' Kunlik bonus</h2>' +
            '<p class="muted tiny">' + icon("flame") + ' Hozirgi seriya: ' + esc(streak) + '-kun · har 24 soatda bir marta.</p></div>' +
            '<span class="badge ' + (bonus.available ? "live" : "soon") + '">' +
              (bonus.available ? "+" + esc(money(bonus.amount)) : "24 SOAT") + '</span></div>' +
          '<div class="bonus-days">' + days + '</div>' +
          action +
        '</section>';
}

        return '<section class="fade hub-missions"><div class="section-title"><h2>' + icon("target") + ' Missiyalar</h2>' +

          '<div class="mission-list">' + missions.map(function (mission) {
            var action;

              action = '<span class="badge live">' + icon("check") + ' OLINDI</span>';
            } else if (mission.claimable) {
              action = '<button class="btn small" data-act="claim-mission" data-mission="' +
                esc(mission.key) + '">+' + esc(money(mission.reward)) + ' ' + icon("coin") + '</button>';
            } else {
              action = '<span class="m-progress">' + esc(mission.progress) + '/' + esc(mission.target) + '</span>';
}

        var head = '<section class="fade hub-board"><div class="section-title"><h2>' + icon("trophy") +
          ' Reyting</h2><span>' + (period === "week" ? "haftalik liga" : "top " + top.length) +
          '</span></div>' + tabs;
        if (!top.length) {
          return head + '<p class="muted tiny" style="margin:10px 2px 2px">' +
            (period === "week"
              ? "Bu hafta hali öyin öynalmagan. Birinçi bölib ligani boşlang!"
              : "Reyting hali böş.") + '</p></section>';
}
        var rows = top.map(function (player) {
          var meta = period === "week"
            ? esc(money(player.points)) + ' ball · ' + esc(player.wins) + ' ta ğalaba'
            : esc(money(player.rating)) + ' · ' + esc(player.wins) + ' ' + icon("trophy");
          return '<div class="top-row' + (player.is_me ? " me" : "") + '">' +

            '<span class="t-name">' + esc(player.name) + '</span>' +
            '<span class="t-rating">' + meta + '</span></div>';

        if (me && Number(me.rank) > top.length) {
          rows += '<div class="top-row me">' + medalBadge(me.medal, me.rank) +
            avatarHtml(me.name, me.user_id, "sm") +

            '<span class="t-rating">' + esc(money(me.rating)) + ' · ' + esc(me.wins) + ' ' +
            icon("trophy") + '</span></div>';
}
        return head + '<div class="top-list">' + rows + '</div></section>';
}

      var HISTORY_TITLES = { bunker: "Bunker", mafia: "Mafiya", spyfall: "Josus", alias: "Alias", bomb: "Portlovçi Bomba" };

      function shortDate(value) {
        var text = String(value || "");
        if (text.length >= 16) return text.slice(8, 10) + "." + text.slice(5, 7) + " " + text.slice(11, 16);
        return text.slice(0, 10);
}

      function historyHtml() {
        var rows = (view.history || []).slice(0, 5);
        if (!rows.length) return "";
        var items = rows.map(function (item) {
          var won = Boolean(item.won);
          var title = HISTORY_TITLES[item.game_type] || item.game_type;
          return '<div class="history-row ' + (won ? "win" : "lose") + '">' +
            '<span class="h-ico">' + icon(won ? "trophy" : "close") + '</span>' +
            '<span class="h-body"><b>' + esc(title) + '</b>' +
            '<span class="muted tiny">' + esc(item.room_code || "") + ' · ' +
            esc(shortDate(item.created_at)) + ' · ' + esc(item.players_count || 0) +
            ' öyinçi</span></span>' +
            '<span class="h-res">' + (won ? "Yutdi" : "Yutqazdi") + '</span></div>';
        }).join("");
        return '<section class="fade"><div class="section-title"><h2>' + icon("hourglass") +
          ' Oxirgi öyinlar</h2><span>' + rows.length + ' ta</span></div>' +
          '<div class="history-list">' + items + '</div></section>';
}

      // ----------------------------------------------------------------
      // Umumiy navbat (matchmaking)
      // ----------------------------------------------------------------
      var MATCH_MIN = { bunker: 5, mafia: 6, spyfall: 3, alias: 3, bomb: 2 };

      function matchQueue(slug) {
        var data = view.matchmaking;
        var queues = data && data.queues ? data.queues : [];
        for (var i = 0; i < queues.length; i += 1) {
          if (queues[i].game_type === slug) return queues[i];
}
        return null;
}

      function matchInQueue(slug) {
        var queue = matchQueue(slug);
        if (!queue || !queue.players) return false;
        var uid = Number(profile && profile.id);
        for (var i = 0; i < queue.players.length; i += 1) {
          if (Number(queue.players[i].user_id) === uid) return true;
}
        return false;
}

      function matchStatusHtml(slug) {
        var queue = matchQueue(slug);
        var minimum = queue ? Number(queue.min) || MATCH_MIN[slug] : MATCH_MIN[slug];
        var count = queue ? Number(queue.count) || 0 : 0;
        var mine = matchInQueue(slug);
        if (!count && !mine) return "";
        var text = count + "/" + minimum + " kişi qidirilmoqda";
        if (count < minimum) text += " · yana " + (minimum - count) + " kişi kerak";
        else text += " · jamoa yiğildi";
        return '<span class="match-text">' + icon("users") + ' ' + esc(text) + '</span>' +
          (mine ? '<button class="link-btn" data-act="match-leave" data-game="' +
            esc(slug) + '">Bekor qiliş</button>' : "");
}

      function refreshMatchStatus() {
        var nodes = app.querySelectorAll("[data-match-status]");
        for (var i = 0; i < nodes.length; i += 1) {
          var slug = nodes[i].getAttribute("data-match-status");
          nodes[i].innerHTML = matchStatusHtml(slug);
}

      function syncMatchPolling() {
        var queued = false;
        var slugs = ["bunker", "mafia", "spyfall", "alias", "bomb"];
        for (var i = 0; i < slugs.length; i += 1) {
          if (matchInQueue(slugs[i])) { queued = true; break; }
}
        if (queued && !view.matchTimer) {
          view.matchTimer = setInterval(loadMatchmaking, 3000);
        } else if (!queued && view.matchTimer) {
          clearInterval(view.matchTimer);
          view.matchTimer = null;
}

      async function loadMatchmaking() {
        if (!profile || !profile.authenticated) return;
        try {
          var data = await request(
            "/api/matchmaking?user_id=" + encodeURIComponent(profile.id)
          );
          if (data && data.match) {
            handleMatchFound(data.match);
            return;
}
          view.matchmaking = data;
          refreshMatchStatus();
          syncMatchPolling();
        } catch (error) {
          /* Tarmoq xatosida oxirgi ma'lumot qoladi. */
}

      async function startMatchmaking(slug) {
        if (view.matchBusy) return;
        view.matchBusy = true;
        haptic("medium");
        try {
          var data = await request("/api/matchmaking/join", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              game_type: slug,
              user_id: profile.id,
              name: profile.name || "",
              username: profile.username || ""
            })
          });
          if (data && data.match) {
            handleMatchFound(data.match);
            return;
}
          toast((data && data.count ? data.count : 1) + "/" +
            ((data && data.min) || MATCH_MIN[slug]) + " kişi navbatda");
          await loadMatchmaking();
        } catch (error) {
          toast(error.message || "Navbatga qöşilib bölmadi", "error");
        } finally {
          view.matchBusy = false;
}

      async function stopMatchmaking(slug) {
        try {
          await request("/api/matchmaking/leave", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ game_type: slug, user_id: profile.id })
          });
          toast("Navbatdan çiqdingiz");
        } catch (error) {
          toast(error.message || "Navbatdan çiqib bölmadi", "error");
}
        await loadMatchmaking();
}

      function handleMatchFound(match) {
        haptic("success");
        toast("Jamoa yiğildi! Xona: " + match.code);
        if (view.matchTimer) {
          clearInterval(view.matchTimer);
          view.matchTimer = null;
}
        if (match.game_type === "mafia") enterMafia(match.code);
        else if (match.game_type === "spyfall") enterSpy(match.code);
        else if (match.game_type === "bomb") enterBomb(match.code);
        else enterRoom(match.code);
}

      function activityPath() {
        return "/api/activity?user_id=" + encodeURIComponent(profile.id) +
          "&username=" + encodeURIComponent(profile.username || "") +
          "&full_name=" + encodeURIComponent(profile.name || "");
}

      function applyActivityPayload(data) {
        if (!data) return;
        view.activity = {
          bonus: data.bonus || null,
          missions: data.missions || [],
          quests: data.quests || null,
          achievements: data.achievements || [],
          top: data.top || [],
          me: data.me || null,
          week: data.week || null
        };
        if (data.coins != null) profile.balance = Number(data.coins) || 0;
}

      async function loadActivity(forceRender) {
        if (view.activityLoading || !profile || !profile.id) return;
        view.activityLoading = true;
        try {
          var data = await request(activityPath());
          applyActivityPayload(data);
          if (!view.code && (forceRender || !view.shopOpen)) renderHub();
        } catch (error) {
          /* Tarmoq xatosida eski ma'lumot qoladi. */
        } finally {
          view.activityLoading = false;
}

      // Hub ma'lumotlarini bitta parallel paketda yuklaydi. Render faqat
      // barcha javoblar qaytgach, bir marta bajariladi.
      async function loadHubData() {
        if (view.hubLoading || !profile || !profile.id) return false;
        view.hubLoading = true;
        syncTelegramProfile();
        var results = await Promise.all([
          request(accountPath()).catch(function (error) { return { error: error }; }),
          request(activityPath()).catch(function (error) { return { error: error }; })
        ]);
        view.hubLoading = false;
        var account = results[0];
        var activity = results[1];
        if (account && account.error) {
          if (account.error.status === 401 || account.error.status === 404) {
            clearStoredAccount();
            profile = loadProfile();
            renderLoginScreen(account.error.message);
            return false;
}
        } else {
          applyAccountPayload(account);
}
        if (activity && !activity.error) applyActivityPayload(activity);
        return true;
}

      // ----------------------------------------------------------------
      // Jonli guruh chati (WebSocket /ws/{code}, xabarlar faqat RAMda
      // saqlanadi - baza ga yozilmaydi)
      // ----------------------------------------------------------------
      var CHAT_QUICK = ["Tayyorman!", "Kim josus?", "Ovoz beramiz", "Bunkerda qoling"];
      var CHAT_REACTIONS = ["🔥", "😂", "💣", "👀", "❤️", "👏", "🤔", "😱"];

      var chatState = {
        messages: [],
        locked: false,
        input: null,
        list: null,
        mount: null,
        outbox: []
      };

      function chatBoot() {
        var dock = document.getElementById("chat-dock");
        if (!dock) return null;
        chatState.input = dock.querySelector("#chat-input");
        chatState.list = dock.querySelector("#chat-list");
        dock.querySelector("[data-chat=\"close\"]").addEventListener("click", function () { closeChat(); });
        dock.querySelector("[data-chat=\"toggle\"]").addEventListener("click", function () { toggleChat(); });
        dock.querySelectorAll("[data-quick]").forEach(function (button) {
          button.addEventListener("click", function () {
            sendChat(button.getAttribute("data-quick"));
          });
        });
        dock.querySelectorAll("[data-react]").forEach(function (button) {
          button.addEventListener("click", function () {
            sendChatReaction(button.getAttribute("data-react"));
          });
        });
        dock.querySelector("#chat-form").addEventListener("submit", function (e) {
          e.preventDefault();
          var input = chatState.input;
          if (!input.value.trim()) return;
          sendChat(input.value.trim());
          input.value = "";
        });
        return dock;
}

      function mountChat() {
        if (chatState.mount) return;
        chatState.outbox = [];
        var dock = document.createElement("div");
        dock.id = "chat-dock";
        dock.innerHTML =
          '<button class="chat-fab" data-chat="toggle" aria-label="Guruh suhbatini oçiş">' + icon("send") + "💬 Guruh suhbati</button>" +
          '<section class="chat-sheet" id="chat-sheet">' +
            '<header class="chat-head"><b>💬 Guruh suhbati</b><span class="chat-online">online</span>' +
              '<button class="icon-btn" data-chat="close" aria-label="Yopiş">' + icon("close") + "</button></header>" +
            '<div class="chat-list" id="chat-list"></div>' +
            '<div class="chat-quick">' + CHAT_QUICK.map(function (phrase) {
              return '<button type="button" data-quick="' + esc(phrase) + '">' + esc(phrase) + '</button>';
            }).join("") + '</div>' +
            '<div class="chat-reactions">' + CHAT_REACTIONS.map(function (emoji) {
              return '<button type="button" class="chat-react-btn" data-react="' + esc(emoji) +
                '" aria-label="' + esc(emoji) + ' reaksiyasi">' + esc(emoji) + '</button>';
            }).join("") + '</div>' +
            '<div class="chat-lock" id="chat-lock" hidden>Siz öyindan çiqqansiz (arvohsiz). Yoziş uçun iltimos guruhga qaylang.</div>' +
            '<form id="chat-form"><input id="chat-input" placeholder="Xabar yozing..." maxlength="300" autocomplete="off" />' +
              '<button type="submit" class="play-btn">Yuboriş</button></form>' +
          "</section>";
        document.body.appendChild(dock);
        chatState.mount = chatBoot();
}

      function unmountChat() {
        if (!chatState.mount) return;
        var dock = chatState.mount;
        chatState.mount = null;
        chatState.input = null;
        chatState.list = null;
        if (dock.parentNode) dock.parentNode.removeChild(dock);
}

      function toggleChat() {
        var dock = chatState.mount;
        if (!dock) return;
        var sheet = document.getElementById("chat-sheet");
        if (sheet.classList.contains("open")) {
          closeChat();
        } else {
          openChat();
}

      function openChat() {
        var sheet = document.getElementById("chat-sheet");
        if (!sheet) return;
        sheet.classList.add("open");
        chatState.locked = false;
        document.getElementById("chat-lock").hidden = true;
        if (chatState.input) chatState.input.focus();
}

      function closeChat() {
        var sheet = document.getElementById("chat-sheet");
        if (sheet) sheet.classList.remove("open");
}

      function chatMessageHtml(m) {
        if (m.kind === "system") {
          return '<div class="chat-sys">' + esc(m.text) + "</div>";
}
        var viewerId = (view.me && view.me.id) || (profile && profile.id) || 0;
        var own = Number(m.user_id) === Number(viewerId);
        var cls = "chat-msg" + (own ? " own" : "") + (m.kind === "mafia" ? " secret" : "") + (m.ghost ? " ghost" : "");
        var time = new Date(Number(m.ts) * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        var bubble = '<div class="chat-bubble">' + esc(m.text) + '</div><div class="chat-time">' + time +
          (m.kind === "mafia" ? ' <span style="color:#fca5a5">· maxfiy</span>' : "") + "</div>";
        if (own) return '<div class="chat-msg own">' + bubble + "</div>";
        var author = m.name ? esc(m.name) : "Öyinçi";
        return '<div class="chat-msg" style="color:hsl(' + (Math.abs(Number(m.user_id)) % 360) + ', 70%, 60%)">' +
          '<div class="chat-author">' + author + "</div>" + bubble + "</div>";
}

      function renderChatMessages() {
        var list = chatState.list;
        if (!list) return;
        var html = chatState.messages.map(chatMessageHtml).join("");
        list.innerHTML = html;
        var scroll = list.scrollHeight - list.clientHeight;
        if (scroll > 0) list.scrollTop = scroll;
}

      function appendChat(message) {
        chatState.messages.push(message);
        if (chatState.messages.length > 1000) chatState.messages = chatState.messages.slice(-500);
        renderChatMessages();
}

      function clearChat() {
        chatState.messages = [];
        renderChatMessages();
}

      function sendChat(text) {
        var ws = view.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          // Ustun hali ochilmagan bo'lsa navbatga qo'yamiz: onopen yuboradi.
          chatState.outbox.push(text);
          toast("Suhbat ulanmoqda, xabar navbatda turadi", "info");
          return;
}
        ws.send(JSON.stringify({ type: "chat", text: text }));
}

      function sendChatReaction(emoji) {
        var ws = view.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          toast("Suhbat ulanmoqda, reaksiyani keyinroq yuboring", "info");
          return;
}
        ws.send(JSON.stringify({ type: "reaction", emoji: emoji }));
        haptic("light");
}

      function showReaction(message) {
        if (!message || !message.emoji) return;
        var el = document.createElement("div");
        el.className = "chat-reaction-float";
        var uid = Math.abs(Number(message.user_id) || 0);
        el.style.left = (10 + uid % 70) + "%";
        el.innerHTML = '<span>' + esc(message.emoji) + '</span><small>' +
          esc(message.name || "O'yinchi") + '</small>';
        document.body.appendChild(el);
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el);
        }, 2300);
}

      function flushChatOutbox() {
        var ws = view.ws;
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        while (chatState.outbox.length) {
          ws.send(JSON.stringify({ type: "chat", text: chatState.outbox.shift() }));
}

      function onChatMessage(message) {
        if (message.kind === "system" && /arvohsiz/i.test(message.text)) {
          chatState.locked = true;
          document.getElementById("chat-lock").hidden = false;
          return;
}
        appendChat(message);
}

      function onChatHistory(messages) {
        chatState.messages = messages || [];
        renderChatMessages();
}

      function applyChatLock(locked) {
        chatState.locked = !!locked;
        var lock = document.getElementById("chat-lock");
        if (lock) lock.hidden = !chatState.locked;
}

      function chatError(payload) {
        var text = payload && payload.message ? String(payload.message) : "";
        if (payload && payload.locked) {
          chatState.locked = true;
          var lock = document.getElementById("chat-lock");
          if (lock) lock.hidden = false;
}
        if (text && !chatState.locked) toast(text, "error");
}

      // ----------------------------------------------------------------
      // Chat uchun so'rov API: /ws/{code} bor, xabar boshqacha ishlaydi
      // ----------------------------------------------------------------

      function announceTransitions(previous, next) {
        if (!previous || !next) return 0;
        var announced = 0;
        var wasAlive = {};
        (previous.players || []).forEach(function (player) {
          if (player.is_alive) wasAlive[player.user_id] = true;
        });
        (next.players || []).forEach(function (player) {
          if (player.is_alive || !wasAlive[player.user_id]) return;
          var key = next.code + ":" + player.user_id + ":" + next.current_round;
          if (view.notified[key]) return;
          view.notified[key] = true;
          announced += 1;
          haptic("error");
          toast(player.full_name + " bunkerdan haydaldi", "error");
        });
        if (previous.status !== "FINISHED" && next.status === "FINISHED") {
          haptic("success");
}
        return announced;
}

      function loadProfile() {
        var user = getTgUser();
        var cached = readProfileCache() || {};
        var cachedId = Number(cached.user_id) || 0;
        if (user && user.id) {
          // Kesh boshqa Telegram akkauntga tegishli bo'lsa ishlatilmaydi.
          if (cachedId && cachedId !== Number(user.id)) cached = {};
          var fullName = [user.first_name, user.last_name].filter(Boolean).join(" ").trim();
          return {
            id: user.id,
            name: fullName || user.username || "Öyinçi",
            username: user.username || "",
            photo: user.photo_url || "",
            balance: Number(cached.balance) || 0,
            games_played: Number(cached.games_played) || 0,
            wins: Number(cached.wins) || 0,
            bunker_wins: Number(cached.bunker_wins) || 0,
            mafia_wins: Number(cached.mafia_wins) || 0,
            level: 1 + Math.floor((Number(cached.games_played) || 0) / 5),
            guest: false,
            authenticated: true,
            fromCache: false
          };
}
        if (cachedId > 0) {
          // Kod/ID bilan oldin kirilgan profil — kutmasdan darhol ochiladi.
          return {
            id: cachedId,
            name: String(cached.full_name || ("ID " + cachedId)),
            username: String(cached.username || ""),
            photo: "",
            balance: Number(cached.balance) || 0,
            games_played: Number(cached.games_played) || 0,
            wins: Number(cached.wins) || 0,
            bunker_wins: Number(cached.bunker_wins) || 0,
            mafia_wins: Number(cached.mafia_wins) || 0,
            level: 1 + Math.floor((Number(cached.games_played) || 0) / 5),
            guest: false,
            authenticated: true,
            fromCache: true
          };
}
        return {
          id: 0,
          name: "",
          username: "",
          photo: "",
          balance: 0,
          games_played: 0,

      async function request(path, options) {
        var requestOptions = Object.assign({}, options || {});
        var headers = Object.assign({}, (options && options.headers) || {});
        var initData = getTgInitData();
        if (initData) {
          headers["X-Telegram-Init-Data"] = initData;
          headers["Authorization"] = "tma " + initData;
}
        requestOptions.headers = headers;
        var response = await fetch(path, requestOptions);
        var data = null;
        try { data = await response.json(); } catch (err) { data = null; }
        if (!response.ok) {
          var detail = data && data.detail ? data.detail : "Server xatosi (" + response.status + ")";
          if (Array.isArray(detail)) {
            detail = detail.map(function (item) { return item.msg || ""; }).filter(Boolean).join(", ");
}
          var error = new Error(detail);
          error.status = response.status;
          throw error;
}
        return data;
}

      function stopMafiaClock() {

      function paintMafiaClock() {
        var el = document.querySelector("[data-mafia-timer]");
        if (!el || !mafiaClock.deadline) return;
        var now = Date.now() / 1000 + mafiaClock.serverOffset;
        var remaining = Math.max(0, Math.ceil(mafiaClock.deadline - now));
        var text = el.querySelector("[data-mafia-time]");
        if (text) text.textContent = formatSeconds(remaining);
        var ring = el.querySelector("[data-mafia-ring]");
        if (ring) {
          var ratio = Math.max(0, Math.min(1, remaining / mafiaClock.duration));
          ring.style.strokeDashoffset = String(113.1 * (1 - ratio));
}
        el.classList.toggle("low", remaining <= 10);
        if (remaining > 0 && remaining <= 10 && mafiaClock.lastTick !== remaining) {
          mafiaClock.lastTick = remaining;
          sfx("timer_tick");
}

      function syncMafiaClock(me) {
        stopMafiaClock();
        if (!me || !me.phase_deadline) return;
        if (["NIGHT", "DAY_REPORT", "VOTING"].indexOf(me.phase) < 0) return;
        mafiaClock.deadline = Number(me.phase_deadline) || 0;
        mafiaClock.duration = Math.max(1, Number(me.phase_duration) || 60);
        mafiaClock.serverOffset = Number(me.server_time)
          ? Number(me.server_time) - Date.now() / 1000
          : 0;
        paintMafiaClock();
        mafiaClock.interval = setInterval(paintMafiaClock, 1000);
}

      // Konteyner ichidagi faqat o'zgargan yuqori darajali bloklarni
      // almashtiradi. innerHTML faqat birinchi qurish yoki tuzilma
      // o'zgarganda ishlatiladi; oddiy yangilanishda DOM tegilmaydi.
      function patchElementChildren(container, html) {
        var template = document.createElement("template");
        template.innerHTML = html;
        var next = Array.prototype.slice.call(template.content.children);
        var current = Array.prototype.slice.call(container.children);
        if (next.length !== current.length) {
          container.innerHTML = html;
          return true;
}
        var changed = false;
        for (var i = 0; i < next.length; i += 1) {
          if (current[i].outerHTML !== next[i].outerHTML) {
            current[i].replaceWith(next[i]);
            changed = true;
}
        return changed;
}

      // Xona ekranini bo'laklab yangilaydi: faqat o'zgargan yuqori darajali
      // bloklar almashtiriladi, qolgan DOM tugunlari va scroll saqlanadi.
      function paintRoomScreen(key, top, mainClass, mainHtml) {
        var shell = app.querySelector('[data-room-screen="' + key + '"]');
        if (!shell || shell.__top !== top) {
          app.innerHTML = top + '<main class="fade ' + mainClass + '" data-room-screen="' + key + '"></main>';
          shell = app.querySelector('[data-room-screen="' + key + '"]');
          shell.__top = top;
          shell.innerHTML = mainHtml;
          return;
}
        var template = document.createElement("template");
        template.innerHTML = mainHtml;
        var next = Array.prototype.slice.call(template.content.children);
        var current = Array.prototype.slice.call(shell.children);
        if (next.length !== current.length) {
          shell.innerHTML = mainHtml;
          return;
}
        for (var i = 0; i < next.length; i++) {
          if (current[i].outerHTML !== next[i].outerHTML) {
            current[i].replaceWith(next[i]);
}
