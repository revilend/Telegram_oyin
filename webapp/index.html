      function waitText(seconds) {
        var value = Math.max(0, Math.round(Number(seconds) || 0));
        var hours = Math.floor(value / 3600);
        var minutes = Math.ceil((value % 3600) / 60);
        if (hours) return hours + " soat " + minutes + " daqiqadan keyin";
        return Math.max(1, minutes) + " daqiqadan keyin";
}

      var BONUS_TABLE = [25, 35, 50, 70, 100, 150, 250];

      function bonusHtml() {
        var bonus = activityState().bonus;
        if (!bonus) return "";
        var streak = Math.max(1, Number(bonus.streak) || 1);
        var next = Number(bonus.next_amount) || BONUS_TABLE[Math.min(streak, 7) - 1];
        var action = bonus.available
          ? '<button class="btn primary block" data-act="claim-bonus">' + icon("gift") + ' ' + esc(money(bonus.amount)) + ' tanga oliş</button>' +
            '<p class="muted tiny" style="margin-top:8px">Ertaga sizni +' + esc(money(next)) + ' tanga kutmoqda!</p>'
          : '<div class="notice tiny" style="margin-top:0">' + icon("hourglass") + ' Keyingi bonus ' + esc(waitText(bonus.seconds_left)) + ' · +' + esc(money(next)) + ' tanga</div>';
        var days = BONUS_TABLE.map(function (amount, index) {
          var day = index + 1;
          return '<span class="bonus-day' + (day === streak ? " now" : "") + '">' +
            day + '-kun +' + esc(money(amount)) + '</span>';
        }).join("");
        return '<section class="panel bonus-card fade">' +
          '<div class="bonus-head"><div><h2>' + icon("gift") + ' ' + tr("daily_bonus", "Kunlik bonus") + '</h2>' +
            '<p class="muted tiny">' + icon("flame") + ' Hozirgi seriya: ' + esc(streak) + '-kun · har 24 soatda bir marta.</p></div>' +
            '<span class="badge ' + (bonus.available ? "live" : "soon") + '">' +
              (bonus.available ? "+" + esc(money(bonus.amount)) : "24 SOAT") + '</span></div>' +
          '<div class="bonus-days">' + days + '</div>' +

          '<div class="mission-list">' + missions.map(function (mission) {
            var action;

                esc(mission.key) + '">+' + esc(money(mission.reward)) + ' ' + icon("coin") + '</button>';
            } else {
              action = '<span class="m-progress text-slate-100">' + esc(mission.progress) + '/' + esc(mission.target) + '</span>';
}
            return '<div class="mission' + (mission.claimable ? " ready" : "") + '">' +

      function shortDate(value) {
        var text = String(value || "");
        if (text.length >= 16) return text.slice(8, 10) + "." + text.slice(5, 7) + " " + text.slice(11, 16);
        return text.slice(0, 10);
}

      function purchaseDateTime(value) {
        var text = String(value || "");
        var date = new Date(text);
        if (!isNaN(date.getTime())) {
          var pad = function (number) { return (number < 10 ? "0" : "") + number; };
          return pad(date.getDate()) + "." + pad(date.getMonth() + 1) + "." +
            date.getFullYear() + ", " + pad(date.getHours()) + ":" + pad(date.getMinutes());
}
        if (text.length >= 16) {
          return text.slice(8, 10) + "." + text.slice(5, 7) + "." + text.slice(0, 4) +
            ", " + text.slice(11, 16);
}
        return text.slice(0, 10) || "—";
}

      // ----------------------------------------------------------------
      // Umumiy navbat (matchmaking)
      // ----------------------------------------------------------------
      var MATCH_MIN = { bunker: 5, mafia: 6, spyfall: 3, alias: 3, bomb: 2 };

      function matchQueue(slug) {
        var data = view.matchmaking;
        var queues = data && data.queues ? data.queues : [];
        for (var i = 0; i < queues.length; i += 1) {
          if (queues[i].game_type === slug) return queues[i];
}
        return null;
}

      function matchInQueue(slug) {
        var queue = matchQueue(slug);
        if (!queue || !queue.players) return false;
        var uid = Number(profile && profile.id);
        for (var i = 0; i < queue.players.length; i += 1) {
          if (Number(queue.players[i].user_id) === uid) return true;
}
        return false;
}

      function matchStatusHtml(slug) {
        var queue = matchQueue(slug);
        var minimum = queue ? Number(queue.min) || MATCH_MIN[slug] : MATCH_MIN[slug];
        var count = queue ? Number(queue.count) || 0 : 0;
        var mine = matchInQueue(slug);
        if (!count && !mine) return "";
        var text = count + "/" + minimum + " kişi qidirilmoqda";
        if (count < minimum) text += " · yana " + (minimum - count) + " kişi kerak";
        else text += " · jamoa yiğildi";
        return '<span class="match-text">' + icon("users") + ' ' + esc(text) + '</span>' +
          (mine ? '<button class="link-btn" data-act="match-leave" data-game="' +
            esc(slug) + '">Bekor qiliş</button>' : "");
}

      function refreshMatchStatus() {
        var nodes = app.querySelectorAll("[data-match-status]");
        for (var i = 0; i < nodes.length; i += 1) {
          var slug = nodes[i].getAttribute("data-match-status");
          nodes[i].innerHTML = matchStatusHtml(slug);
}

      }
      function syncMatchPolling() {
        var queued = false;
        var slugs = ["bunker", "mafia", "spyfall", "alias", "bomb"];
        for (var i = 0; i < slugs.length; i += 1) {
          if (matchInQueue(slugs[i])) { queued = true; break; }
}
        if (queued && !view.matchTimer) {
          view.matchTimer = setInterval(loadMatchmaking, 3000);
        } else if (!queued && view.matchTimer) {
          clearInterval(view.matchTimer);
          view.matchTimer = null;
}

      }
      async function loadMatchmaking() {
        if (!profile || !profile.authenticated) return;
        try {
          var data = await request(
            "/api/matchmaking?user_id=" + encodeURIComponent(profile.id)
          );
          if (data && data.match) {
            handleMatchFound(data.match);
            return;
}
          view.matchmaking = data;
          refreshMatchStatus();
          syncMatchPolling();
        } catch (error) {
          /* Tarmoq xatosida oxirgi ma'lumot qoladi. */
}

      }
      async function startMatchmaking(slug) {
        if (view.matchBusy) return;
        view.matchBusy = true;
        haptic("medium");
        try {
          var data = await request("/api/matchmaking/join", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              game_type: slug,
              user_id: profile.id,
              name: profile.name || "",
              username: profile.username || ""
            })
          });
          if (data && data.match) {
            handleMatchFound(data.match);
            return;
}
          toast((data && data.count ? data.count : 1) + "/" +
            ((data && data.min) || MATCH_MIN[slug]) + " kişi navbatda");
          await loadMatchmaking();
        } catch (error) {
          toast(error.message || "Navbatga qöşilib bölmadi", "error");
        } finally {
          view.matchBusy = false;
}

      }
      async function stopMatchmaking(slug) {
        try {
          await request("/api/matchmaking/leave", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ game_type: slug, user_id: profile.id })
          });
          toast("Navbatdan çiqdingiz");
        } catch (error) {
          toast(error.message || "Navbatdan çiqib bölmadi", "error");
}
        await loadMatchmaking();
}

      function handleMatchFound(match) {
        haptic("success");
        toast("Jamoa yiğildi! Xona: " + match.code);
        if (view.matchTimer) {
          clearInterval(view.matchTimer);
          view.matchTimer = null;
}
        if (match.game_type === "mafia") enterMafia(match.code);
        else if (match.game_type === "spyfall") enterSpy(match.code);
        else if (match.game_type === "bomb") enterBomb(match.code);
        else enterRoom(match.code);
}

        view.activity = {
          bonus: data.bonus || null,
          missions: data.missions || [],
          quests: data.quests || null,
          achievements: data.achievements || [],
          top: data.top || [],
          me: data.me || null,
          week: data.week || null
        };
        if (data.coins != null) profile.balance = Number(data.coins) || 0;
}

          applyActivityPayload(data);
          if (!view.code && (forceRender || !view.shopOpen)) renderHub();

        try {
          // Bitta /api/bootstrap so'rovi: profil + bonus + missiya + turnir.
          data = await request(bootstrapPath());

          view.hubLoading = false;
          if (error && (error.status === 401 || error.status === 404)) {
            clearStoredAccount();
            profile = loadProfile();
            renderLoginScreen(error.message);
            return false;
          }
          // Tarmoq xatosida keshdagi ma'lumot bilan davom etamiz (SWR).
          return true;
        }
        view.hubLoading = false;
        if (!data) return true;
        applyAccountPayload(data.account || null);
        if (data.activity) applyActivityPayload(data.activity);
        storeBootstrapCache(data);
        return true;
}

      function announceTransitions(previous, next) {
        if (!previous || !next) return 0;
        var announced = 0;
        var wasAlive = {};
        (previous.players || []).forEach(function (player) {
          if (player.is_alive) wasAlive[player.user_id] = true;
        });
        (next.players || []).forEach(function (player) {
          if (player.is_alive || !wasAlive[player.user_id]) return;
          var key = next.code + ":" + player.user_id + ":" + next.current_round;
          if (view.notified[key]) return;
          view.notified[key] = true;
          announced += 1;
          haptic("error");
          toast(player.full_name + " bunkerdan haydaldi", "error");
        });
        if (previous.status !== "FINISHED" && next.status === "FINISHED") {
          haptic("success");
}
        return announced;
}

      async function request(path, options) {
        var requestOptions = Object.assign({}, options || {});
        var headers = Object.assign({}, (options && options.headers) || {});
        var initData = getTgInitData();
        if (initData) {
          headers["X-Telegram-Init-Data"] = initData;
          headers["Authorization"] = "tma " + initData;
}
        requestOptions.headers = headers;
        var response = await fetch(path, requestOptions);
        var data = null;
        try { data = await response.json(); } catch (err) { data = null; }
        if (!response.ok) {
          var detail = data && data.detail ? data.detail : "Server xatosi (" + response.status + ")";
          if (Array.isArray(detail)) {
            detail = detail.map(function (item) { return item.msg || ""; }).filter(Boolean).join(", ");
}
          var error = new Error(detail);
          error.status = response.status;
          throw error;
}
        return data;
}

      function stopMafiaClock() {

      function paintMafiaClock() {
        var el = document.querySelector("[data-mafia-timer]");
        if (!el || !mafiaClock.deadline) return;
        var now = Date.now() / 1000 + mafiaClock.serverOffset;
        var remaining = Math.max(0, Math.ceil(mafiaClock.deadline - now));
        var text = el.querySelector("[data-mafia-time]");
        if (text) text.textContent = formatSeconds(remaining);
        var ring = el.querySelector("[data-mafia-ring]");
        if (ring) {
          var ratio = Math.max(0, Math.min(1, remaining / mafiaClock.duration));
          ring.style.strokeDashoffset = String(113.1 * (1 - ratio));
}
        el.classList.toggle("low", remaining <= 10);
        if (remaining > 0 && remaining <= 10 && mafiaClock.lastTick !== remaining) {
          mafiaClock.lastTick = remaining;
          sfx("timer_tick");
}

      }
      function syncMafiaClock(me) {
        stopMafiaClock();
        if (!me || !me.phase_deadline) return;
        if (["NIGHT", "DAY_REPORT", "VOTING"].indexOf(me.phase) < 0) return;
        mafiaClock.deadline = Number(me.phase_deadline) || 0;
        mafiaClock.duration = Math.max(1, Number(me.phase_duration) || 60);
        mafiaClock.serverOffset = Number(me.server_time)
          ? Number(me.server_time) - Date.now() / 1000
          : 0;
        paintMafiaClock();
        mafiaClock.interval = setInterval(paintMafiaClock, 1000);
}

      function patchElementChildren(container, html) {
        var template = document.createElement("template");
        template.innerHTML = html;
        var next = Array.prototype.slice.call(template.content.children);
        var current = Array.prototype.slice.call(container.children);
        if (next.length !== current.length) {
          container.innerHTML = html;
          return true;
}
        var changed = false;
        for (var i = 0; i < next.length; i += 1) {
          if (current[i].outerHTML !== next[i].outerHTML) {
            current[i].replaceWith(next[i]);
            changed = true;
          }
        }
        return changed;
}

      function paintRoomScreen(key, top, mainClass, mainHtml) {
        var shell = app.querySelector('[data-room-screen="' + key + '"]');
        if (!shell || shell.__top !== top) {
          app.innerHTML = top + '<main class="fade ' + mainClass + '" data-room-screen="' + key + '"></main>';
          shell = app.querySelector('[data-room-screen="' + key + '"]');
          shell.__top = top;
          shell.innerHTML = mainHtml;
          return;
}
        var template = document.createElement("template");
        template.innerHTML = mainHtml;
        var next = Array.prototype.slice.call(template.content.children);
        var current = Array.prototype.slice.call(shell.children);
        if (next.length !== current.length) {
          shell.innerHTML = mainHtml;
          return;
}
        for (var i = 0; i < next.length; i++) {
          if (current[i].outerHTML !== next[i].outerHTML) {
            current[i].replaceWith(next[i]);
}

      }

        if (remaining > 0 && remaining <= 10 && spyClock.lastTick !== remaining) {
          spyClock.lastTick = remaining;
          sfx("timer_tick");
}

      }
      function syncSpyClock(state) {
        stopSpyClock();
        if (!state || !state.deadline || state.status === "FINISHED") return;
        spyClock.deadline = Number(state.deadline) || 0;
        spyClock.duration = Math.max(1, Number(state.round_seconds) || 300);
        spyClock.offset = (Number(state.deadline) - Number(state.seconds_left || 0))
          - Date.now() / 1000;
        paintSpyClock();
        spyClock.interval = setInterval(paintSpyClock, 1000);
}

      function scheduleSpyPoll() {
        if (view.spyTimer) {
          clearTimeout(view.spyTimer);
          view.spyTimer = null;
}
        var state = view.spyState;
        if (!state || state.status === "FINISHED") return;
        if (!["LOBBY", "PLAYING", "VOTING"].includes(state.status)) return;
        view.spyTimer = setTimeout(function () {
          if (view.mode === "spy") loadSpyState();
        }, 4000);
}

      function applySpyData(data) {
        if (!data || !data.state) return;
        view.spy = data.me;
        view.spyState = data.state;
        if (data.locations) view.spyLocations = data.locations;
        if (data.coins != null) profile.balance = Number(data.coins) || 0;
        if (data.state.status === "FINISHED") {
          view.spyVoteTarget = null;
          view.spyGuessKey = null;
}
        view.spyLoading = false;
        view.spyError = null;
}

      async function loadSpyState(retried) {
        var code = view.code;
        try {
          var data = await request(
            "/api/spy/" + encodeURIComponent(code) + "?user_id=" +
            encodeURIComponent(profile.id)
          );
          if (view.mode !== "spy" || view.code !== code) return;
          applySpyData(data);
          renderSpy();
          scheduleSpyPoll();
        } catch (error) {
          if (view.mode !== "spy" || view.code !== code) return;
          if (error.status === 403 && !retried) {
            // Guruhdan kelgan foydalanuvchi hali qo'shilmagan bo'lsa — avtomatik qo'shamiz.
            try {
              var joined = await request(
                "/api/spy/" + encodeURIComponent(code) + "/join",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ user_id: profile.id, name: profile.name || "" })
}
              );
              if (view.mode !== "spy" || view.code !== code) return;
              applySpyData(joined);
              renderSpy();
              scheduleSpyPoll();
              return;
            } catch (joinError) {
              error = joinError;
}
          view.spyLoading = false;
          view.spyError = error;
          stopSpyClock();
          renderSpy();
}

      }
      }
      async function createSpyRoom() {
        if (view.actionBusy) return;
        view.actionBusy = true;
        try {
          var data = await request("/api/spy/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id, name: profile.name || "Öyinçi" })
          });
          view.spyEntry = false;
          if (data && data.state && data.state.code) enterSpy(data.state.code);
        } catch (error) {
          toast(error.message || "Xona yaratilmadi", "error");
        } finally {
          view.actionBusy = false;
}

      }
      async function spyPost(path, payload, successMessage) {
        if (view.spyActionBusy) return null;
        var code = view.code;
        view.spyActionBusy = true;
        renderSpy();
        try {
          var data = await request("/api/spy/" + encodeURIComponent(code) + "/" + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign(
              { user_id: profile.id, name: profile.name || "" },
              payload || {}
            ))
          });
          if (view.mode !== "spy" || view.code !== code) return null;
          applySpyData(data);
          if (data.result && data.result.reason) {
            toast(data.result.reason, data.result.correct === false ? "error" : "success");
          } else if (successMessage) {
            toast(successMessage, "success");
}
          haptic("success");
          return data;
        } catch (error) {
          if (view.mode === "spy" && view.code === code) {
            toast(error.message || "Harakat bajarilmadi", "error");
}
          return null;
        } finally {
          if (view.mode === "spy" && view.code === code) {
            view.spyActionBusy = false;
            renderSpy();
            scheduleSpyPoll();
}

      }

      var TOURNAMENT_TICKER = null;

      function tournamentCountdownLabel(startValue) {
        var stamp = new Date(startValue).getTime();
        if (isNaN(stamp)) return "—";
        var total = Math.max(0, Math.floor((stamp - Date.now()) / 1000));
        if (total <= 0) return "Boshlandi";
        var pad = function (value) { return (value < 10 ? "0" : "") + value; };
        var days = Math.floor(total / 86400);
        var hours = Math.floor((total % 86400) / 3600);
        var minutes = Math.floor((total % 3600) / 60);
        var seconds = total % 60;
        return (days ? days + " kun " : "") + pad(hours) + ":" + pad(minutes) + ":" + pad(seconds);
}

      function syncTournamentCountdowns() {
        var nodes = document.querySelectorAll("[data-tour-countdown]");
        for (var i = 0; i < nodes.length; i += 1) {
          nodes[i].textContent = "⏳ " + tournamentCountdownLabel(nodes[i].getAttribute("data-tour-start"));
}
}

      function startTournamentTicker() {
        if (TOURNAMENT_TICKER) clearInterval(TOURNAMENT_TICKER);
        syncTournamentCountdowns();
        TOURNAMENT_TICKER = setInterval(syncTournamentCountdowns, 1000);
}

      function stopTournamentTicker() {
        if (TOURNAMENT_TICKER) clearInterval(TOURNAMENT_TICKER);
        TOURNAMENT_TICKER = null;
}

      async function loadTournaments(force) {
        if (view.tournamentsLoading) return;
        view.tournamentsLoading = true;
        try {
          var path = "/api/tournaments/active" + (profile.id ? "?user_id=" + encodeURIComponent(profile.id) : "");
          var data = await request(path);
          if (data) {
            view.tournaments = data;
            if (typeof data.coins === "number") profile.balance = data.coins;
}
        } catch (error) {
          toast(error.message || "Turnirlarni yuklab bölmadi", "error");
}
        view.tournamentsLoading = false;
        if (view.tournamentOpen || force) renderHub();
        if (view.tournamentOpen) startTournamentTicker();
        else stopTournamentTicker();
}

      async function openTournaments() {
        if (view.code) return;
        view.tournamentOpen = true;
        renderHub();
        syncModalBackButton();
        startTournamentTicker();
        if (!view.tournaments) await loadTournaments(true);
}

      var JOINED_TOURNAMENT_KEY = "rg_joined_tournament";

      function getJoinedTournamentId() {
        try { return window.localStorage.getItem(JOINED_TOURNAMENT_KEY) || ""; } catch (e) { return ""; }
      }

      function setJoinedTournamentId(tournamentId) {
        try { window.localStorage.setItem(JOINED_TOURNAMENT_KEY, String(tournamentId)); } catch (e) {}
      }

      async function joinTournament(tournamentId) {
        if (!tournamentId || view.tournamentBusy) return;
        if (isAlreadyJoinedTournament(tournamentId)) {
          toast("✅ Siz allaqachon ro\u0027yxatdan o\u0027tgansiz!", "success");
          view.tournaments = null;
          await loadTournaments(true);
          return;
        }
        view.tournamentBusy = true;
        try {
          var data = await request("/api/tournaments/join", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id, tournament_id: tournamentId })
          });
          if (data) {
            profile.balance = Number(data.coins) || profile.balance;
            setJoinedTournamentId(tournamentId);
            toast("✅ Muvaffaqiyatli ro\u0027yxatdan o\u0027tdingiz! Boshlanishidan 15 daqiqa oldin bot sizga xona havolasini yuboradi.", "success");
            haptic("success");
            sfx("victory");
}
        } catch (error) {
          var already = /allaqachon|already/i.test(error.message || "");
          if (already) {
            setJoinedTournamentId(tournamentId);
            toast("✅ Siz allaqachon ro\u0027yxatdan o\u0027tgansiz!", "success");
            haptic("success");
          } else {
            toast(error.message || "Turnirga yozilib bölmadi", "error");
            haptic("error");
          }
}
        view.tournamentBusy = false;
        view.tournaments = null;
        await loadTournaments(true);
}

      function isAlreadyJoinedTournament(tournamentId) {
        if (!profile.id) return false;
        var storedId = getJoinedTournamentId();
        if (storedId === tournamentId) return true;
        return false;
}

      function buildMvpPayload(kind, state, players, winnerText) {
        var roster = (players || []).slice();
        if (!roster.length) return null;
        var scored = roster.slice().sort(function (a, b) {
          var ax = Number(a.score || a.points || a.votes_against || 0);
          var bx = Number(b.score || b.points || b.votes_against || 0);
          return bx - ax;
        });
        var mvp = scored[0];
        var rows = [
          { label: "Öyin", value: kind },
          { label: "Natija", value: winnerText || "Yakunlandi" }
        ];
        // Bunker/Mafiyada omon qolganlar muhim; Josus, Alias va Bombada bunday
        // tushuncha yo'q, shuning uchun faqat o'yinchilar soni ko'rsatiladi.
        if (roster.some(function (player) { return player.is_alive !== undefined; })) {
          var alive = roster.filter(function (player) { return player.is_alive; });
          var dead = roster.filter(function (player) { return !player.is_alive; });
          rows.push({ label: "Omon qolganlar", value: String(alive.length) });
          rows.push({ label: "Haydalganlar", value: dead.length ? dead.map(mvpName).join(", ") : "—" });
        } else {
          rows.push({ label: "Öyinçilar", value: String(roster.length) });
        }
        return {
          name: mvpName(mvp),
          reason: "Eng faol va natijali öyinçi — öyin MVPsi!",
          rows: rows,
          share: "🏆 " + kind + " yakunlandi. MVP: " + mvpName(mvp) + ". " + (winnerText || "")
        };
}

      // ---------------- Alias natijasi (bot havolasidan) ----------------
      function decodeBase64Json(value) {
        try {
          var normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
          while (normalized.length % 4) normalized += "=";
          var binary = atob(normalized);
          var bytes = new Uint8Array(binary.length);
          for (var index = 0; index < binary.length; index += 1) {
            bytes[index] = binary.charCodeAt(index);
}
          return JSON.parse(new TextDecoder("utf-8").decode(bytes));
        } catch (error) {
          return null;
}

      }
      function aliasResultFromUrl() {
        try {
          var token = new URLSearchParams(window.location.search).get("alias_result");
          return token ? decodeBase64Json(token) : null;
        } catch (error) {
          return null;
}

      }
      function viewerIdFromContext() {
        try {
          if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {

}
        } catch (error) {}
        try {
          var uid = Number(new URLSearchParams(window.location.search).get("uid") || 0);

        return Number((profile && profile.id) || 0) || 0;
}

      var BOMB_ACTION_TYPES = ["ATTACK", "SKIP", "FUTURE", "SHUFFLE", "STEAL"];
      var BOMB_IMAGES = {
        BOMB: "bomb.png", DEFUSE: "defuse.png", ATTACK: "attack.png",
        SKIP: "skip.png", FUTURE: "future.png", SHUFFLE: "shuffle.png",
        STEAL: "steal.png"
      };

      function bombStartCode(value) {
        var match = String(value || "").toUpperCase().match(/BMB\d{3}/);
        return match ? match[0] : "";
}

      function bombMeta(type) {
        var cards = (view.bombState && view.bombState.cards) || {};
        return cards[type] || { name: String(type || "Karta"), symbol: "🃏", ability: "" };
}

      function bombCardImage(type) {
        return "assets/images/bomb/" + (BOMB_IMAGES[type] || "bomb.png");
}

      function bombFaceHtml(type, cls) {

        return '<div class="bomb-face ' + (cls || "") + '">' +
          '<img src="' + bombCardImage(type) + '" alt="' + esc(meta.name) + '" loading="lazy" />' +

      function bombPlayerName(state, userId) {

}

      function stopBombPolling() {
        if (view.bombPoll) {
          clearInterval(view.bombPoll);
          view.bombPoll = null;
}

      }
      function startBombPolling() {
        if (view.bombPoll || view.mode !== "bomb") return;
        view.bombPoll = setInterval(function () {
          if (view.mode === "bomb" && !view.bombBusy) loadBombState(true);
        }, 4000);
}

      function enterBomb(code) {
        var normalized = bombStartCode(code) || normalizeCode(code);
        if (!normalized) {
          toast("Bomba xona kodi BMB123 körinişida bölişi kerak", "error");
          return;
}
        stopLive();
        stopTimer();
        stopBombPolling();
        view.mode = "bomb";
        view.bombCode = normalized;
        view.code = normalized;
        view.bombEntry = false;
        view.bombState = null;
        view.bombMe = null;
        view.bombCoins = 0;
        view.bombLoading = true;
        view.bombError = null;
        view.bombBusy = false;
        view.bombPreview = null;
        view.bombTarget = null;
        view.bombDrawn = null;
        view.bombBoom = null;
        view.bombFuture = [];
        view.bombFutureOpen = false;
        unmountBombOverlays();
        setBackButton(true);
        renderBomb();
        loadBombState(false);
}

      function applyBombData(data) {
        view.bombState = data.state || null;
        view.bombMe = data.me || null;
        view.bombCoins = Number(data.coins) || 0;
        var future = (data.me && data.me.future_cards) || [];
        if (future.length) view.bombFuture = future;
        if (data.state && data.state.status === "FINISHED") stopBombPolling();
}

      async function loadBombState(silent) {
        if (!view.bombCode || view.mode !== "bomb") return;
        var requested = view.bombCode;
        if (!silent) {
          view.bombLoading = true;
          renderBomb();
}
        try {
          var data = await request(
            "/api/bomb/" + encodeURIComponent(requested) +
            "?user_id=" + encodeURIComponent(profile.id) +
            "&name=" + encodeURIComponent(profile.name || "")
          );
          if (view.bombCode !== requested || view.mode !== "bomb") return;
          applyBombData(data);
          view.bombLoading = false;
          view.bombError = null;
          renderBomb();
          startBombPolling();
        } catch (error) {
          if (view.bombCode !== requested || view.mode !== "bomb") return;
          view.bombLoading = false;
          var lost = error && (error.status === 404 || /topilmadi/i.test(error.message || ""));
          if (lost) {
            // Xona serverda yo'q (masalan server yangilangan): polling to'xtaydi,
            // ekran qotib qolmaydi va o'yinchi aniq xabar oladi.
            stopBombPolling();
            view.bombState = null;
            view.bombMe = null;
            view.bombPreview = null;
            view.bombDrawn = null;
            view.bombError = "Bu xona endi mavjud emas (server yangilangan bölişi mumkin). Yangi xona oçing.";
} else {
            view.bombError = error.message || "Bomba xonasini yuklab bölmadi";
}
          renderBomb();
}

      }
      async function createBombRoom() {
        if (view.bombBusy) return;
        view.bombBusy = true;
        try {
          var data = await request("/api/bomb/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: Number(profile.id) || 0, name: profile.name || "Öyinçi" })
          });
          view.bombEntry = false;
          enterBomb(data.state.code);
          toast("Bomba xonasi oçildi!");
          haptic("success");
        } catch (error) {
          toast(error.message || "Xona oçib bölmadi", "error");
        } finally {
          view.bombBusy = false;
}

      }
      async function bombPost(action, payload, successMessage) {
        if (!view.bombCode || view.bombBusy) return;
        view.bombBusy = true;
        renderBomb();
        try {
          var body = Object.assign({
            user_id: Number(profile.id) || 0,
            name: profile.name || "Öyinçi"
          }, payload || {});
          var data = await request(
            "/api/bomb/" + encodeURIComponent(view.bombCode) + "/" + action,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
}
          );
          applyBombData(data);
          var result = data.action;
          if (result && result.kind === "draw") {
            if (result.exploded) {
              view.bombBoom = result;
              view.bombDrawn = null;
              haptic("error");
            } else if (result.awaiting_defuse) {
              view.bombDrawn = null;
              haptic("warning");
            } else {
              view.bombDrawn = result;
              if (result.defused) haptic("success");
}
            if (result.winner_id && Number(result.winner_id) === Number(profile.id)) {
              haptic("success");
}
          } else if (result) {
            if (result.future_cards && result.future_cards.length) {
              view.bombFuture = result.future_cards;
              view.bombFutureOpen = true;
}
            haptic("success");
}
          view.bombPreview = null;
          view.bombTarget = null;
          if (successMessage) toast(successMessage);
          if (data.state && data.state.status !== "FINISHED") startBombPolling();
        } catch (error) {
          toast(error.message || "Harakat bajarilmadi", "error");
        } finally {
          view.bombBusy = false;
          renderBomb();
}

      }
      function bombPlay() {
        var hand = (view.bombMe && view.bombMe.hand) || [];
        var index = Number(view.bombPreview);
        var type = hand[index];
        if (!type) {
          toast("Karta tanlanmadi", "error");
          return;
}
        if (BOMB_ACTION_TYPES.indexOf(type) < 0) {
          toast(type === "DEFUSE" ? "Zararsizlantiriş bomba chiqqanda ishlatiladi" : "Bu kartani qöldan öynab bömaydi", "error");
          return;
}
        var payload = { card_type: type };
        if (type === "STEAL") {
          if (view.bombTarget == null) {
            toast("Öğirlaş uçun raqibni tanlang", "error");
            return;
}
          payload.target_id = Number(view.bombTarget);
}
        bombPost("play", payload, "");
}

          bombPreviewHtml(view.bombMe) + bombFutureHtml() + bombDefuseHtml() + bombDrawnHtml();
        if (html !== view.bombOverlaySig) {
          view.bombOverlaySig = html;
          host.querySelector(".bomb-overlay-body").innerHTML = html;
          refreshLucide();
}
        if (html) host.classList.add("open");
        else host.classList.remove("open");

      function renderBomb() {
        if (view.mode !== "bomb") return;
        var code = view.bombCode || view.code || "";
        var state = view.bombState;
        var me = view.bombMe;
        var layout = !state ? "empty" : (state.status === "LOBBY" ? "lobby" : "table");
        var rebuild = layout !== view.bombLayout;
        if (rebuild) {
          view.bombLayout = layout;
          view.bombPainted = {};
          app.innerHTML = bombSkeleton(layout, code);
}
        var parts;
        if (layout === "table") {
          parts = bombTableParts(state, me);
        } else if (layout === "lobby") {
          parts = { body: bombLobbyHtml(state) };
        } else if (view.bombError) {
          parts = { body: '<section class="state-screen fade"><div class="emoji">💣</div><h2>Xona topilmadi</h2><p>' +
            esc(view.bombError) + '</p><button class="btn primary" data-act="bomb-reload">Qayta uriniş</button>' +
            '<button class="btn block" data-act="home" style="margin-top:8px">Hubga qaytiş</button></section>' };
        } else if (view.bombLoading) {
          parts = { body: '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>' };
        } else {
          parts = { body: '<div class="skeleton"></div>' };
}
        var painted = false;
        Object.keys(parts).forEach(function (slot) {
          var node = app.querySelector('[data-slot="' + slot + '"]');
          if (!node) return;
          if (view.bombPainted[slot] === parts[slot]) return;
          view.bombPainted[slot] = parts[slot];
          node.innerHTML = parts[slot];
          painted = true;
        });
        if (painted || rebuild) refreshLucide();
        renderBombOverlays();
}

}

}

      function renderRoomError(error) {
        app.innerHTML =

            '<div class="emoji">' + icon("map-pin") + '</div>' +
            '<h2>Xona topilmadi</h2>' +

            '<button class="btn primary" data-act="home">Boş sahifaga qaytiş</button>' +

      async function loadRoomData(silent) {
        try {
          var roomData = await fetchRoom(view.code);
          var meData = null;
          try {
            meData = await fetchMe(view.code);
          } catch (meError) {
            if (meError.status !== 404) throw meError;
}
          view.loading = false;
          view.error = null;
          var room = roomData.state;
          var me = meData ? meData.me : null;
          var roomSig = JSON.stringify(room);
          var meSig = JSON.stringify(me);
          var changed = roomSig !== view.lastRoomSig || meSig !== view.lastMeSig;
          if (changed) announceTransitions(view.room, room);
          view.room = room;
          view.me = me;
          view.lastRoomSig = roomSig;
          view.lastMeSig = meSig;
          if (changed || !silent) renderRoom(true);
        } catch (error) {
          view.loading = false;
          var roomLost = error && (error.status === 404 || /topilmadi/i.test(error.message || ""));
          if (roomLost) {
            // Xona yo'q: polling to'xtaydi, ekranda qotib qolgan jadval qolmaydi.
            try { stopLive(); } catch (ignored) {}
            view.room = null;
            view.me = null;
            view.error = error;
            renderRoomError({
              message: "Bu xona endi mavjud emas (server yangilangan bölişi mumkin). Hubga qaytib yangi xona oçing."
});
            return;
}
          if (silent && view.room) {
            return;
}
          view.error = error;
          renderRoomError(error);
}

      }
      function renderRoom(keepScroll) {
        if (!view.room) return;
        var room = view.room;
        var scrollY = keepScroll ? window.scrollY : 0;
        var me = view.me;
        var status = room.status;
        var players = room.players || [];
        var alive = players.filter(function (player) { return player.is_alive; });
        var myVoteTarget = view.selected;

        var html = '<div class="topbar">' +
          '<button class="icon-btn" data-act="exit-room" aria-label="Orqaga">' + icon("arrow-left") + '</button>' +
          '<div class="room-id"><span class="room-code">' + esc(room.code) + '</span>' +
            '<span class="status-pill ' + statusClass(status) + '">' + esc(STATUS_LABELS[status] || status) + '</span></div>' +
          '<div class="round-chip">' + (room.current_round ? "Raund " + room.current_round : "Lobby") + '</div>' +
          timerHtml(room) +
          exitRoomButtonHtml() +
        '</div>';

        html += catastropheHtml(room);
        html += roomBoostersHtml();

        if (status === "FINISHED") {
          html += finishedHtml(room);
          noteGameEnd(
            "bunker:" + room.code,
            status,
            me ? me.is_alive : true,
            buildMvpPayload("Bunker", room, players, room.winner || "Bunker yakunlandi")
          );
}

        if (!me && status === "LOBBY") {
          html += joinRoomHtml(room);
        } else if (!me) {
          html += '<div class="notice">⏳ Öyin allaqaçon boşlangan. Siz kuzatuvçisiz — keyingi öyinni kuting.</div>';
}

        if (me) {
          html += myCardsHtml(me, status);
}

        html += playersHtml(room, me);
        html += controlsHtml(room, me, alive);

        html += '<div class="footer">Revilend Games · Xona ' + esc(room.code) + '</div>';

        if (view.lastRoomHtml === html) {
          ensureTimer(room);
          return;
}
        view.lastRoomHtml = html;
        var shell = app.querySelector('[data-room-shell]');
        if (!shell) {
          app.innerHTML = '<main class="fade" data-room-shell></main>';
          shell = app.querySelector('[data-room-shell]');
          shell.innerHTML = html;
        } else {
          patchElementChildren(shell, html);
}
        if (keepScroll) window.scrollTo(0, scrollY);
        ensureTimer(room);
        if (room.status === "FINISHED") startEpilogue(room);
}

      function epilogueText(room, survivors) {
        var catastrophe = (room.catastrophe && room.catastrophe.name) || "falokat";
        var count = survivors.length;
        var capacity = room.bunker_capacity || 0;
        var first;
        if (!count) {
          first = "Bunker eşigi heç kim omon qolmasdan yopildi va " + catastrophe +
            " taşqarida hamma narsani yutib yubordi.";
        } else if (count >= capacity) {
          first = "Bunker eşigi oğir metall ovoz bilan yopildi; " + catastrophe +
            " taşqarida qoldi. Içkarida " + count + " kişi omon qoldi va ajratilgan joy töliq yetdi.";
        } else {
          first = "Bunker eşigi oğir metall ovoz bilan yopildi va " + catastrophe +
            " taşqarida qoldi. Içkarida " + count + " kişi omon qoldi, ammo böş joylar endi heç qaçon tölmaydi.";
}
        var second = count
          ? "Ular zaxiralarni bölişib, yangi jamiyat uçun birinçi qadamni qöydi; insoniyatning taqdiri endi şu hovuç odamning qölida."
          : "Insoniyatning sönggi umidi ham söndi; bu falokat tarixda eng oğir saboq bölib qoldi.";
        return first + " " + second;
}

          '</div>';

      function startEpilogue(room) {
        var key = "bunker:" + room.code + ":" + String(room.epilogue_survived) + ":" + String((room.epilogue || []).length);
        if (view.epilogueKey === key) return;
        var node = document.querySelector("[data-epilogue-years]");
        if (!node) return;
        view.epilogueKey = key;
        if (view.epilogueTimer) clearInterval(view.epilogueTimer);
        var years = Array.prototype.slice.call(node.querySelectorAll("[data-epilogue-year]"));
        var outcome = document.querySelector("[data-epilogue-outcome]");
        var index = 0;
        function reveal() {
          if (index < years.length) { years[index].classList.add("show"); index += 1; return; }
          if (outcome) outcome.classList.add("show");
          if (view.epilogueTimer) clearInterval(view.epilogueTimer);
          view.epilogueTimer = null;
        }
        reveal();
        view.epilogueTimer = setInterval(reveal, 3400);
      }

      // ----------------------------------------------------------------
      // Real-vaqt
      // ----------------------------------------------------------------
      function connectSocket() {
        if (!view.code) return;
        stopSocket();
        var protocol = window.location.protocol === "https:" ? "wss" : "ws";
        var socket;
        try {
          var wsUrl = protocol + "://" + window.location.host + "/ws/" + encodeURIComponent(view.code);
          var chatUserId = (view.me && view.me.id) || (profile && profile.id);
          if (chatUserId) wsUrl += "?user_id=" + encodeURIComponent(String(chatUserId));
          socket = new WebSocket(wsUrl);
        } catch (err) {
          view.wsTimer = setTimeout(connectSocket, 4000);
          return;
}
        view.ws = socket;

        socket.onmessage = function (event) {
          var message;
          try { message = JSON.parse(event.data); } catch (err) { return; }
          if (message.type === "chat-history") {
            onChatHistory(message.messages);
            applyChatLock(message.locked);
            return;
}
          if (message.type === "reaction") {
            showReaction(message);
            return;
}
          if (message.type === "chat") {
            onChatMessage(message.message || message);
            return;
}
          if (message.type === "chat-error") {
            chatError(message);
            return;
}
          if (message.type === "state" && message.state) {
            applyRemoteRoom(message.state);
}
        };
        socket.onopen = function () {
          flushChatOutbox();
        };
        socket.onclose = function () {
          if (view.ws === socket) view.ws = null;
          if (view.code) {
            view.wsTimer = setTimeout(connectSocket, 4000);
}
        };
        socket.onerror = function () {
          try { socket.close(); } catch (err) { /* ignore */ }
        };
}

      function stopSocket() {
        if (view.wsTimer) {
          clearTimeout(view.wsTimer);
          view.wsTimer = null;
}
        if (view.ws) {
          var socket = view.ws;
          view.ws = null;
          try { socket.close(); } catch (err) { /* ignore */ }
}

      }
      function startPolling() {
        stopPolling();
        view.pollTimer = setInterval(function () {
          if (view.code && !view.busy) loadRoomData(true);
        }, 5000);
}

      function stopPolling() {
        if (view.pollTimer) {
          clearInterval(view.pollTimer);
          view.pollTimer = null;
}

      }
      function stopLive() {
        stopSocket();
        stopPolling();
}

      function applyRemoteRoom(room) {
        if (!room || room.code !== view.code) return;
        var sig = JSON.stringify(room);
        if (sig === view.lastRoomSig) return;
        announceTransitions(view.room, room);
        view.room = room;
        view.lastRoomSig = sig;
        if (room.status !== "PLAYING" && room.status !== "VOTING") view.selected = null;
        renderRoom(true);
}

      // ----------------------------------------------------------------
      // Harakatlar
      // ----------------------------------------------------------------
      async function sendAction(payload, successMessage) {
        if (view.busy) return;
        view.busy = true;
        var flipKey = payload.action === "reveal" ? payload.card_type : null;
        if (flipKey) {
          if (view.flipTimer) {
            clearTimeout(view.flipTimer);
            view.flipTimer = null;
}
          view.flipKey = flipKey;
}
        try {
          var data = await postAction(view.code, payload);
          var announced = announceTransitions(view.room, data.state);
          if (data.coins != null) profile.balance = Number(data.coins) || 0;
          view.room = data.state;
          view.me = data.me;
          view.lastRoomSig = JSON.stringify(data.state);
          view.lastMeSig = JSON.stringify(data.me);
          if (payload.action === "vote" || payload.action === "tally") view.selected = null;
          renderRoom(true);

          if (flipKey) {
            haptic("heavy");
            view.flipTimer = setTimeout(function () {
              if (view.flipKey !== flipKey) return;
              view.flipKey = null;
              view.flipTimer = null;
              renderRoom(true);
            }, 900);
}

          if (data.result && data.result.tie) {
            toast("Ovozlar teng — heç kim haydalmadi");
          } else if (data.result && data.result.eliminated && !announced) {
            toast(data.result.eliminated.full_name + " haydaldi", "error");
          } else if (successMessage) {
            toast(successMessage);
}
        } catch (error) {
          if (flipKey && view.flipKey === flipKey) view.flipKey = null;
          toast(error.message || "Xatolik yuz berdi", "error");
          if (error.status === 404) loadRoomData(false);
        } finally {
          view.busy = false;
}

      }
      async function joinRoom() {
        var name = (profile.name || "").trim();
        if (!name) {
          var input = document.getElementById("guest-name");
          name = input ? input.value.trim() : "";
}
        if (!name) {
          toast("Ismingizni kiriting", "error");
          return;
}
        if (profile.guest) {
          profile.name = name;
          window.sessionStorage.setItem("rg_guest_name", name);
}
        await sendAction({ action: "join", full_name: name, username: profile.username }, "Xonaga qöşildingiz!");
}

        } else if (act === "tour-close") {
          view.tournamentOpen = false;
          stopTournamentTicker();
          renderHub();
        } else if (act === "tour-refresh") {
          loadTournaments(true);
        } else if (act === "tour-join") {
          joinTournament(button.getAttribute("data-id"));
        } else if (act === "mvp-close") {
          var overlay = button.closest(".mvp-overlay");
          if (overlay) overlay.remove();
          view.mvp = null;
        } else if (act === "mvp-share") {
          shareMvp();
        } else if (act === "purchase-history") {
          var openHistory = !view.purchasesOpen;
          view.purchasesOpen = openHistory;
          var historyRequest = openHistory ? loadPurchaseHistory() : null;
          renderHubMain("profile");
          if (historyRequest) {
            historyRequest.then(function () {
              if (view.hubTab === "profile" && view.purchasesOpen) renderHubMain("profile");
            });
}
        } else if (act === "purchase-filter") {
          var fromInput = document.getElementById("purchase-from");
          var toInput = document.getElementById("purchase-to");
          view.purchasesFrom = fromInput ? fromInput.value : "";
          view.purchasesTo = toInput ? toInput.value : "";
          view.purchases = null;
          view.purchasesHasMore = false;
          var filterRequest = loadPurchaseHistory();
          renderHubMain("profile");
          filterRequest.then(function () {
            if (view.hubTab === "profile" && view.purchasesOpen) renderHubMain("profile");
          });
        } else if (act === "purchase-filter-reset") {
          view.purchasesFrom = "";
          view.purchasesTo = "";
          view.purchases = null;
          view.purchasesHasMore = false;
          var resetRequest = loadPurchaseHistory();
          renderHubMain("profile");
          resetRequest.then(function () {
            if (view.hubTab === "profile" && view.purchasesOpen) renderHubMain("profile");
          });
        } else if (act === "purchase-load-more") {
          if (!view.purchasesLoading) {
            var moreRequest = loadPurchaseHistory({ append: true });
            moreRequest.then(function () {
              if (view.hubTab === "profile" && view.purchasesOpen) renderHubMain("profile");
            });
          }
        } else if (button && button.hasAttribute("data-i18n-lang")) {
          if (window.I18N) window.I18N.setLanguage(button.getAttribute("data-i18n-lang"));
        } else if (act === "hub-tab") {
          switchHubTab(button.getAttribute("data-tab"));
        } else if (act === "shop") {
          switchHubTab("shop");
        } else if (act === "wheel-sound") {
          var soundOn = SoundManager.toggle();
          syncSoundToggleButtons(soundOn);
        } else if (act === "wheel-open") {
          openWheel();
        } else if (act === "wheel-close") {
          view.wheelOpen = false;
          renderHub();
        } else if (act === "wheel-spin") {
          spinWheel();
        } else if (act === "shop-section") {
          view.shopSection = button.getAttribute("data-section") || "BOOSTER";
          renderHub();
        } else if (act === "shop-buy" || act === "buy-open") {
          openBuyConfirmModal(button);
        } else if (act === "buy-confirm") {
          confirmBuyItem();
        } else if (act === "buy-cancel") {
          closeBuyConfirm();
        } else if (act === "buy-equip") {
          equipBoughtItem();
        } else if (act === "shop-buy-legacy") {
          buyItem(button.getAttribute("data-slug"));
        } else if (act === "equip-toggle") {
          toggleEquip(button.getAttribute("data-slug"), button.getAttribute("data-equip") === "1");
        } else if (act === "shop-close") {
          view.shopOpen = false;
          view.shopPackage = null;
          clearBuyConfirm();
          renderHub();
        } else if (act === "shop-pack") {
          view.shopPackage = Number(button.getAttribute("data-coins"));
          renderHub();
        } else if (act === "shop-pay") {
          openShopPayment();
        } else if (act === "board-period") {
          setBoardPeriod(button.getAttribute("data-period"));
        } else if (act === "match-join") {
          startMatchmaking(button.getAttribute("data-game"));
        } else if (act === "match-leave") {
          stopMatchmaking(button.getAttribute("data-game"));
        } else if (act === "claim-bonus") {
          claimBonus();
        } else if (act === "claim-mission") {
          claimMission(button.getAttribute("data-mission"));
        } else if (act === "claim-quest") {
          claimQuest(button.getAttribute("data-quest"));
        } else if (act === "quest-reroll") {
          rerollQuests();
        } else if (act === "claim-chest") {
          claimChest();
        } else if (act === "promo") {
          redeemPromo();
        } else if (act === "shield-accept") {
          sendAction({ action: "booster", booster: "shield" }, "Qalqon faollaştirildi!");
        } else if (act === "shield-decline") {
          sendAction({ action: "shield_decline" }, "Qalqon rad etildi");
        } else if (act === "booster") {
          sendAction({ action: "booster", booster: button.getAttribute("data-booster") }, "Booster faollaştirildi");
        } else if (act === "reroll") {
          var select = document.getElementById("reroll-card");
          var cardType = select ? select.value : "";
          if (!cardType) {
            toast("Almaştiriş uçun karta tanlang", "error");
            return;
}
          sendAction({ action: "booster", booster: "reroll", card_type: cardType }, "Karta almaştirildi");
}

      }
      function handleSubmit(event) {
        if (event.target.id === "login-form") {
          event.preventDefault();
          var loginInput = document.getElementById("login-input");
          submitLogin(loginInput ? loginInput.value : "");
          return;
}
        if (event.target.id === "bomb-entry-form") {
          event.preventDefault();
          var bombInput = document.getElementById("bomb-entry-code");
          var bombValue = bombStartCode(bombInput ? bombInput.value : "");
          if (!bombValue) {
            toast("Kod BMB123 körinişida bölişi kerak", "error");
            return;
}
          enterBomb(bombValue);
          return;
}
        if (event.target.id === "spy-entry-form") {
          event.preventDefault();
          var spyInput = document.getElementById("spy-entry-code");
          var spyValue = spyStartCode(spyInput ? spyInput.value : "");
          if (!spyValue) {
            toast("Kod SPY123 körinişida bölişi kerak", "error");
            return;
}
          enterSpy(spyValue);
          return;
}
        if (event.target.id === "join-form") {
          event.preventDefault();
          var input = document.getElementById("room-code");
          var code = normalizeCode(input ? input.value : "");
          if (!/^[A-Z0-9]{6}$/.test(code)) {
            toast("Xona kodi 6 belgidan iborat bölişi kerak", "error");
            return;
}
          if (/^MAF\d{3}$/.test(code)) {
            enterMafia(code);
            return;
}
          if (/^SPY\d{3}$/.test(code)) {
            enterSpy(code);
            return;
}
          if (/^BMB\d{3}$/.test(code)) {
            enterBomb(code);
            return;
}
          window.location.href = window.location.pathname + "?room=" + encodeURIComponent(code);
        } else if (event.target.id === "room-join-form") {
          event.preventDefault();
          joinRoom();
}

      
      // ----------------------------------------------------------------
      // Modal yopish (overlay, klaviatura, Telegram BackButton)
      // ----------------------------------------------------------------
      }
      function hasBombOverlay() {
        return !!(view.bombBoom || view.bombDrawn || view.bombFutureOpen || view.bombPreview != null ||
          document.querySelector("#bomb-overlays.open"));
}

      function isChatPanelOpen() {
        var sheet = document.getElementById("chat-sheet");
        return !!(sheet && sheet.classList.contains("open"));
}

      function hasOpenOverlay() {
        return !!(view.buyConfirm || view.shopOpen || view.wheelOpen || view.tournamentOpen ||
          view.spyEntry || view.aliasEntry || view.bombEntry || view.mvp ||
          document.querySelector(".mvp-overlay") || hasBombOverlay() || isChatPanelOpen());
}

      function syncModalBackButton() {
        setBackButton(!!(view.code || hasOpenOverlay()));
}

      function closeNodeSmooth(node, callback) {
        if (!node) {
          if (callback) callback();
          return;
}
        node.classList.add("is-closing");
        setTimeout(function () {
          if (callback) callback();
        }, 160);
}

      // Eng ustki modalni yopadi: MVP -> Bomba -> chat -> hub oynasi.
      function closeTopOverlay() {
        if (view.buyConfirm) {
          closeBuyConfirm();
          syncModalBackButton();
          return true;
}
        var mvp = document.querySelector(".mvp-overlay");
        if (mvp) {
          view.mvp = null;
          closeNodeSmooth(mvp, function () {
            if (mvp.parentNode) mvp.parentNode.removeChild(mvp);
          });
          syncModalBackButton();
          return true;
}

        if (hasBombOverlay()) {
          var host = document.getElementById("bomb-overlays");
          view.bombBoom = null;
          view.bombDrawn = null;
          view.bombFuture = [];
          view.bombFutureOpen = false;
          view.bombPreview = null;
          view.bombTarget = null;
          if (host) {
            closeNodeSmooth(host, function () {
              host.classList.remove("is-closing");
              renderBombOverlays();
            });
          } else {
            renderBombOverlays();
}
          syncModalBackButton();
          return true;
}

        if (isChatPanelOpen()) {
          closeChat();
          syncModalBackButton();
          return true;
}

        if (view.shopOpen || view.wheelOpen || view.tournamentOpen ||
            view.spyEntry || view.aliasEntry || view.bombEntry) {
          var hubOverlay = document.querySelector("#hub-overlays .shop-overlay");
          clearBuyConfirm();
          view.shopOpen = false;
          view.shopPackage = null;
          view.wheelOpen = false;
          view.wheelResult = null;
          view.tournamentOpen = false;
          view.tournaments = null;
          view.spyEntry = false;
          view.aliasEntry = false;
          view.bombEntry = false;
          if (hubOverlay) {
            closeNodeSmooth(hubOverlay, function () { renderHub(); });
          } else {
            renderHub();
}
          syncModalBackButton();
          return true;
}
        return false;
}

      function onOverlayClick(event) {
        var target = event.target;
        if (!target || !target.classList) return;
        if (target.classList.contains("shop-overlay") ||
            target.classList.contains("mvp-overlay") ||
            target.classList.contains("bomb-backdrop") ||
            target.classList.contains("bomb-overlay-body") ||
            target.classList.contains("bomb-boom-overlay")) {
          closeTopOverlay();
}
}

      document.addEventListener("keydown", function (event) {
        if (!event) return;
        var key = event.key;
        if (key === "Escape" || key === "Esc") {
          closeTopOverlay();
          event.stopPropagation();
}
      });
// Ishga tushirish
      // ----------------------------------------------------------------
      // Bitta listenerdagi xato butun Mini App'ni to'xtatmasin.
      function safeListener(handler) {
        return function (event) {
          try {
            return handler(event);
          } catch (error) {
            try { console.error("Listener xatosi:", error); } catch (ignored) {}
          }
        };
}
      document.addEventListener("click", safeListener(handleClick));
      document.addEventListener("click", safeListener(onOverlayClick));
      app.addEventListener("submit", safeListener(handleSubmit));
      app.addEventListener("change", function (event) {
        if (!event.target) return;
        if (event.target.id === "mafia-night-kind") {
          view.mafiaActionKind = event.target.value;
          view.mafiaActionTarget = null;
          renderMafia();
        } else if (event.target.id === "mafia-night-target") {
          view.mafiaActionTarget = Number(event.target.value);
        } else if (event.target.id === "mafia-kamikaze-target") {
          view.mafiaKamikazeTarget = event.target.value
            ? Number(event.target.value)
            : null;
}
      });
      app.addEventListener("click", function (event) {
        var button = event.target.closest("button");
        if (button && !button.disabled) haptic("medium");
      }, true);

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (tg.BackButton) {
            tg.BackButton.onClick(function () {
              haptic("medium");
              if (closeTopOverlay()) return;

              if (!view.code) {
                setBackButton(false);
                return;
}
              confirmExitRoom();
            });
}
          if (tg.onEvent) {
            tg.onEvent("themeChanged", applyTelegramTheme);
            tg.onEvent("viewportChanged", function () {
              if (tg.isExpanded === false) tg.expand();
            });
}
        } catch (err) { /* eski versiya */ }
        applyTelegramTheme();
}

      function toNewAlphabet(text) {
        if (!text) return text;
        return text
          .replace(/o['\u2018\u2019\u02BB]/g, function (m) {
            return m[0] === 'O' ? '\u00d6' : '\u00f6';
          })
          .replace(/O['\u2018\u2019\u02BB]/g, '\u00d6')
          .replace(/g['\u2018\u2019\u02BB]/g, '\u011f')
          .replace(/G['\u2018\u2019\u02BB]/g, '\u011e')
          .replace(/sh/g, '\u015f')
          .replace(/Sh/g, '\u015e')
          .replace(/SH/g, '\u015e')
          .replace(/ch/g, '\u00e7')
          .replace(/Ch/g, '\u00c7')
          .replace(/CH/g, '\u00c7');
}

      // Alifbo almashtirish faqat matn tugunlarida bajariladi: elementning
      // textContent'ini yozish ichki teglarni (tugma, ikona) o'chirib yuboradi.
      var ORTHO_SKIP_TAGS = { SCRIPT: 1, STYLE: 1, CODE: 1, PRE: 1, TEXTAREA: 1 };

      function localizeTextNode(node) {
        if (!node || node.nodeType !== Node.TEXT_NODE) return;
        // Yangi alifbo faqat o'zbek tili uchun: ru/en matnlarini buzmaslik kerak.
        try { if (window.I18N && window.I18N.getLanguage() !== "uz") return; } catch (err) {}
        var current = node.textContent;
        if (!current) return;
        var next = toNewAlphabet(current);
        // Almashtirish idempotent: matn teng bo'lsa qayta yozilmaydi va
        // kuzatuvchi cheksiz aylanmaydi.
        if (next !== current) node.textContent = next;
}

      function localizeSubtree(node) {
        if (!node) return;
        if (node.nodeType === Node.TEXT_NODE) {
          localizeTextNode(node);
          return;
}
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (ORTHO_SKIP_TAGS[node.tagName]) return;
        for (var i = 0; i < node.childNodes.length; i += 1) {
          localizeSubtree(node.childNodes[i]);
        }
      }

      function startOrthographyObserver() {
        if (!window.MutationObserver || !document.body) return;
        localizeSubtree(document.body);
        var observer = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i += 1) {
            var mutation = mutations[i];
            if (mutation.type === "characterData") {
              localizeTextNode(mutation.target);
              continue;
}
            for (var j = 0; j < mutation.addedNodes.length; j += 1) {
              localizeSubtree(mutation.addedNodes[j]);
            }
          }
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
}

      async function boot() {
        if (!profile || !profile.authenticated) {
          renderLoginScreen();
          return;
}
        var routeCode = view.code;
        // 0 ms render: oxirgi bootstrap javobi localStorage'dan darhol chiziladi,
        // tarmoq javobi kelganda faqat raqamlar jimgina yangilanadi (SWR).
        var cachedBootstrap = readBootstrapCache();
        if (cachedBootstrap) {
          applyAccountPayload(cachedBootstrap.account);
          applyActivityPayload(cachedBootstrap.activity);
          renderHub();
        } else {
          renderHubSkeleton();
        }
        var ready = await loadHubData();
        if (!ready || !profile.authenticated) return;
        renderHub();
        if (initialBombCode) {
          enterBomb(initialBombCode);
        } else if (initialSpyCode) {
          enterSpy(initialSpyCode);
        } else if (initialMafiaCode) {
          enterMafia(initialMafiaCode);
        } else if (routeCode) {
          if (/^SPY\d{3}$/.test(routeCode)) enterSpy(routeCode);
          else if (/^BMB\d{3}$/.test(routeCode)) enterBomb(routeCode);
          else enterRoom(routeCode);
        }
      }

      // Tashqi (window.onerror) himoyadan ham zaxira hubni chaqirish uchun.
      window.__renderFallbackHub = renderEmergencyHub;

      function initApp() {
        try {
          if (tg) {
            try {
              tg.ready();
              tg.expand();
            } catch (telegramError) { /* eski Telegram versiyasi */ }
          }
          startOrthographyObserver();
          boot().catch(function (error) {
            console.error("Init xatosi:", error);
            if (window.__showMiniAppError) {
              window.__showMiniAppError(error && error.message ? error.message : error);
            }
            renderEmergencyHub(error);
          });
        } catch (error) {
          console.error("Init xatosi:", error);
          if (window.__showMiniAppError) {
            window.__showMiniAppError(error && error.message ? error.message : error);
          }
          renderEmergencyHub(error);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initApp);
      } else {
        initApp();
      }
    })();
