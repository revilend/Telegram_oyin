<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0713" />
  <title>Revilend Games</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="js/i18n.js?v=5"></script>
  <script src="js/i18n-phrases.js?v=5"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    (function () {
      // Qizil xato paneli butunlay olib tashlandi: xato faqat konsolga
      // yoziladi, ekran tuzilishi hech qachon buzilmaydi.
      // Ekranda hech qanday qizil "Script error" paneli chiqmaydi: xato
      // faqat konsolga (debug uchun) yoziladi.
      window.__showMiniAppError = function () {};
      // Qora ekran himoyasi: sahifa yuklangach #app bo'sh qolsa, zaxira hub chiziladi.
      window.addEventListener("load", function () {
        setTimeout(function () {
          try {
            var app = document.getElementById("app");
            if (app && !app.children.length && window.__renderFallbackHub) {
              window.__renderFallbackHub("blank-screen");
            }
          } catch (ignored) {}
        }, 3000);
      });
      window.onerror = function (message, url, line, column, error) {
        try { console.warn("Mini App xatosi:", message, url, line, column, error); } catch (ignored) {}
        // true — brauzer/Telegram standart qizil xato panelini ko'rsatmaydi.
        return true;
      };
      window.addEventListener("unhandledrejection", function (event) {
        var reason = event && event.reason;
        try { console.warn("Mini App promise xatosi:", reason); } catch (ignored) {}
        try {
          if (event && typeof event.preventDefault === "function") event.preventDefault();
        } catch (ignored) {}
      });
    })();
  </script>
  <style>
    :root {
      --bg: #070b16;
      --bg-soft: #0d1324;
      --panel: rgba(255, 255, 255, 0.045);
      --panel-strong: rgba(255, 255, 255, 0.075);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f1f5f9;
      --muted: #cbd5e1;
      --accent: #8b5cf6;
      --accent-2: #22d3ee;
      --on-accent: #0a0f1f;
      --danger: #f87171;
      --success: #34d399;
      --warning: #fbbf24;
      --radius: 20px;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
}

    * { box-sizing: border-box; }

    /* Mobil brauzerlarda ko'k tap-highlight va matn belgilanishini o'chirish. */
    *, *::before, *::after {
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
      user-select: none !important;
      -webkit-user-select: none !important;
}

    /* Kiritish maydonlarida matnni belgilash va nusxa olish ishlashi kerak. */
    input, textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
}

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100%;
}

    body {
      background:
        radial-gradient(900px 420px at 12% -10%, rgba(139, 92, 246, 0.28), transparent 65%),
        radial-gradient(700px 380px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 60%),
        var(--bg);
}

    #app {
      max-width: 620px;
      margin: 0 auto;
      padding: 8px 16px calc(28px + env(safe-area-inset-bottom));
      min-height: 100vh;
      padding-bottom: 90px !important;
}

    .page-body {
      padding-bottom: 90px !important;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
}

    h1, h2, h3, h4, p { margin: 0; }
    button { font-family: inherit; }
    .muted { color: var(--muted); }
    .tiny { font-size: 12px; line-height: 1.5; }

    /* ---------- Brand / header ---------- */
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 30;
      padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
      padding-bottom: 12px;
      margin-bottom: 14px;
      background: var(--bg);
      box-shadow: 0 12px 18px -16px rgba(0, 0, 0, 0.75);
}

    .brand-left { display: flex; align-items: center; gap: 10px; }

    .logo {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: var(--on-accent);
      box-shadow: 0 8px 22px rgba(139, 92, 246, 0.35);
}

    .brand-name { font-weight: 700; font-size: 15px; letter-spacing: 0.2px; }
    .brand-sub { font-size: 11px; color: var(--muted); letter-spacing: 0.8px; text-transform: uppercase; }

    .profile {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px 6px 6px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      max-width: 46%;
}

    .profile-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
}

    .avatar {
      width: 34px;
      height: 34px;
      min-width: 34px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #6366f1, #a855f7);
}

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      display: block;
}

    .avatar.sm { width: 40px; height: 40px; min-width: 40px; font-size: 13px; }

    /* ---------- Hub ---------- */
    .hero { margin-bottom: 22px; }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--accent-2);
      font-weight: 700;
      margin-bottom: 8px;
}

    .hero h1 {
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -0.6px;
      margin-bottom: 10px;
}

    .hero p { color: var(--muted); font-size: 14px; line-height: 1.55; }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 24px 2px 12px;
}

    .section-title h2 { font-size: 16px; letter-spacing: -0.2px; min-width: 0; }
    .section-title span {
      flex: 0 0 auto;
      white-space: nowrap;
      font-size: 12px;
      color: var(--muted);
}
    .section-title .section-badge {
      display: inline-flex;
      align-items: center;
      min-width: max-content;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
}
    .flex { display: flex; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .px-1 { padding-left: 4px; padding-right: 4px; }
    [class~="px-2.5"] { padding-left: 10px; padding-right: 10px; }
    .py-1 { padding-top: 4px; padding-bottom: 4px; }
    .text-xs { font-size: 12px !important; line-height: 16px !important; }
    .text-sm { font-size: 14px !important; line-height: 20px !important; }
    .text-base { font-size: 16px !important; line-height: 24px !important; }
    .font-semibold { font-weight: 600; }
    .font-medium { font-weight: 500; }
    .font-extrabold { font-weight: 800; }
    .rounded-full { border-radius: 999px; }
    [class~="bg-emerald-500/15"] { background-color: rgba(16, 185, 129, 0.15); }
    .text-emerald-300 { color: #6ee7b7 !important; }
    .border { border-width: 1px; border-style: solid; }
    [class~="border-emerald-500/30"] { border-color: rgba(16, 185, 129, 0.3); }
    .whitespace-nowrap { white-space: nowrap; }
    .overflow-hidden { overflow: hidden; }
    .w-full { width: 100%; }
    .p-4 { padding: 16px !important; }
    .pb-28 { padding-bottom: 110px; }
    .text-white { color: #ffffff !important; }
    .text-purple-200 { color: #e9d5ff !important; }
    .text-slate-100 { color: #f1f5f9 !important; }
    .text-slate-300 { color: #cbd5e1 !important; }
    .text-amber-300 { color: #fcd34d !important; }
    @media (min-width: 640px) { [class~="sm:text-base"] { font-size: 16px !important; line-height: 24px !important; } }

    .game-card {
      position: relative;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      padding: 16px;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      margin-bottom: 12px;
      overflow: hidden;
}

    .game-card.active { border-color: rgba(139, 92, 246, 0.45); box-shadow: 0 14px 34px rgba(88, 51, 189, 0.18); }
    .game-card.active::after {
      content: "";
      position: absolute;
      inset: auto -40px -70px auto;
      width: 150px;
      height: 150px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
      pointer-events: none;
}

    .game-icon {
      width: 54px;
      height: 54px;
      min-width: 54px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      font-size: 26px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
}

    .game-body { flex: 1; min-width: 0; }
    .game-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .game-name { font-weight: 700; font-size: 16px; }

    .game-desc {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
}

    .game-meta { font-size: 11px; color: var(--muted); margin-top: 6px; letter-spacing: 0.3px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.7px;
      padding: 4px 8px;
      border-radius: 999px;
      text-transform: uppercase;
      white-space: nowrap;
}

    .badge.live { background: rgba(52, 211, 153, 0.14); color: var(--success); border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge.soon { background: rgba(255, 255, 255, 0.06); color: var(--muted); border: 1px solid var(--border); }
    .badge.host { background: rgba(251, 191, 36, 0.14); color: var(--warning); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge.me { background: rgba(34, 211, 238, 0.13); color: var(--accent-2); border: 1px solid rgba(34, 211, 238, 0.3); }

    .play-btn {
      flex: 0 0 auto;
      border: 0;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      color: var(--on-accent);
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
}

    .play-btn[disabled] { cursor: default; color: var(--muted); background: rgba(255, 255, 255, 0.06); }

    .panel {
      margin-top: 18px;
      padding: 18px;
      border-radius: var(--radius);
      background: var(--panel);
      border: 1px solid var(--border);
}

    .panel h2 { font-size: 15px; margin-bottom: 12px; }

    .join-form { display: flex; gap: 10px; }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font-size: 16px;
      letter-spacing: 2px;
      text-transform: uppercase;
      outline: none;
}

    input[type="text"]:focus { border-color: rgba(139, 92, 246, 0.7); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    input::placeholder { letter-spacing: 2px; color: #5c6580; }

    .btn {
      border: 0;
      cursor: pointer;
      border-radius: 14px;
      padding: 13px 18px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      background: var(--panel-strong);
      border: 1px solid var(--border);
      transition: transform 0.12s ease, opacity 0.12s ease;
}

    .btn:active { transform: scale(0.98); }
    .btn[disabled] { opacity: 0.45; cursor: default; }

    .btn.primary {
      color: var(--on-accent);
      background: linear-gradient(135deg, #a78bfa, #22d3ee);
      border: 0;
}

    .btn.danger { color: #1a0505; background: linear-gradient(135deg, #fca5a5, #f87171); border: 0; }
    .btn.block { width: 100%; }
    .btn.small { padding: 9px 12px; font-size: 12px; border-radius: 11px; }

    .footer { margin-top: 26px; text-align: center; font-size: 11px; color: #5f6884; letter-spacing: 0.5px; }

    /* ---------- Kunlik bonus, missiyalar, reyting ---------- */
    .panel.bonus-card {
      margin-top: 0;
      background:
        radial-gradient(260px 120px at 100% 0%, rgba(251, 191, 36, 0.18), transparent 70%),
        var(--panel);
      border-color: rgba(251, 191, 36, 0.28);
}
    .bonus-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .bonus-days { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .bonus-day {
      font-size: 10px; font-weight: 700; color: var(--muted);
      padding: 5px 7px; border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.18);
      background: rgba(148, 163, 184, 0.08);
}
    .bonus-day.now {
      color: #bae6fd; border-color: rgba(56, 189, 248, 0.55);
      background: rgba(56, 189, 248, 0.16);
}
    .bonus-head h2 { margin-bottom: 4px; }
    .mission-list { display: flex; flex-direction: column; gap: 8px; }
    .mission {
      display: flex; align-items: center; gap: 10px; padding: 11px 12px;
      border-radius: 15px; background: var(--panel); border: 1px solid var(--border);
}
    .mission.ready { border-color: rgba(52, 211, 153, 0.4); background: rgba(52, 211, 153, 0.08); }
    .mission .m-emoji { font-size: 20px; width: 28px; text-align: center; }
    .mission .m-body { flex: 1; min-width: 0; }
    .m-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; color: #f8fafc; }
    .m-title .m-reward { font-size: 11px; color: var(--warning); white-space: nowrap; }
    .m-desc { font-size: 11px; color: #cbd5e1; margin-top: 2px; }
    .m-bar { margin-top: 6px; height: 5px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
    .m-bar i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .m-progress { font-size: 11px; color: var(--muted); white-space: nowrap; }
    .mission .btn.small { flex: 0 0 auto; }
    .top-list { display: flex; flex-direction: column; gap: 6px; }
    .top-row {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px;
      border-radius: 14px; background: var(--panel); border: 1px solid var(--border);
}
    .top-row.me { border-color: rgba(139, 92, 246, 0.5); background: rgba(139, 92, 246, 0.14); }
    .top-rank { width: 22px; text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); }
    .top-row .t-main { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: stretch; gap: 3px; }
    .top-row .t-line { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .top-row .t-nick { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .top-row .t-rating { font-size: 11px; color: var(--warning); white-space: nowrap; }
    .promo-row { display: flex; gap: 8px; margin-top: 14px; }
    .promo-row input { letter-spacing: 0; text-transform: uppercase; padding: 12px 14px; font-size: 14px; }
    .promo-row .btn { flex: 0 0 auto; }

    /* ---------- Room ---------- */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: calc(env(safe-area-inset-top, 0px) + 8px) 0 14px;
      background: var(--bg);
      
}

    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: grid;
      place-items: center;
}

    .room-id { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
    .room-code { font-weight: 800; letter-spacing: 2px; font-size: 16px; }

    .status-pill {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 5px 9px;
      border-radius: 999px;
      background: var(--panel-strong);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
}

    .status-pill.PLAYING { color: var(--success); border-color: rgba(52, 211, 153, 0.35); background: rgba(52, 211, 153, 0.1); }
    .status-pill.VOTING { color: var(--warning); border-color: rgba(251, 191, 36, 0.35); background: rgba(251, 191, 36, 0.1); }
    .status-pill.FINISHED { color: var(--accent-2); border-color: rgba(34, 211, 238, 0.35); background: rgba(34, 211, 238, 0.1); }

    .round-chip { font-size: 11px; color: var(--muted); white-space: nowrap; }

    .catastrophe {
      position: relative;
      border-radius: 24px;
      padding: 20px;
      overflow: hidden;
      background:
        radial-gradient(500px 220px at 100% 0%, rgba(248, 113, 113, 0.22), transparent 60%),
        linear-gradient(155deg, rgba(139, 92, 246, 0.22), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: var(--shadow);
      margin-bottom: 18px;
}

    .cat-eye {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      color: #fca5a5;
      margin-bottom: 8px;
      text-transform: uppercase;
}

    .catastrophe h1 { font-size: 23px; letter-spacing: -0.4px; line-height: 1.2; margin-bottom: 8px; }
    .catastrophe > p { font-size: 13px; line-height: 1.6; color: #cdd3e6; white-space: pre-line; }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }

    .cat-block {
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 14px;
      padding: 12px;
}

    .cat-block h4 { font-size: 11px; letter-spacing: 0.5px; color: var(--muted); margin-bottom: 8px; text-transform: uppercase; }
    .cat-block ul { margin: 0; padding-left: 16px; }
    .cat-block li { font-size: 12px; line-height: 1.5; color: #dde2f2; margin-bottom: 3px; }

    .stat-row { display: flex; gap: 8px; margin-top: 14px; }
    .stat {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 13px;
      background: rgba(0, 0, 0, 0.22);
      border: 1px solid rgba(255, 255, 255, 0.07);
}
    .stat b { display: block; font-size: 18px; }
    .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.7px; }

    .block-head { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 2px 10px; }
    .block-head h2 { font-size: 16px; }
    .block-head span { font-size: 11px; color: var(--muted); }

    .cards-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }

    .card {
      position: relative;
      border-radius: 16px;
      padding: 13px;
      background: linear-gradient(160deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.025));
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 138px;
}

    .card.revealed { border-color: rgba(139, 92, 246, 0.45); background: linear-gradient(160deg, rgba(139, 92, 246, 0.18), rgba(34, 211, 238, 0.06)); }
    .card-top { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    .card-top .emoji { font-size: 15px; }
    .card h3 { font-size: 14px; line-height: 1.3; margin: 9px 0 5px; }
    .card p { font-size: 11.5px; line-height: 1.45; color: #c3cbe1; white-space: pre-line; }
    .card-lock { flex: 1; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 22px; gap: 2px; }
    .card-lock small { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; }
    .card .btn { margin-top: 10px; }
    .card .revealed-stamp { margin-top: auto; }
    .flip-front .revealed-stamp { margin-top: auto; }

    .players { display: flex; flex-direction: column; gap: 8px; }

    .player {
      display: flex;
      gap: 12px;
      padding: 13px;
      border-radius: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
}

    .player.dead { opacity: 0.55; }
    .player.dead .avatar { filter: grayscale(1); }
    .p-body { flex: 1; min-width: 0; }
    .p-name { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 14px; font-weight: 700; }
    .p-meta { font-size: 11px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
    .chip {
      font-size: 10.5px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.14);
      border: 1px solid rgba(139, 92, 246, 0.28);
      color: #ddd6fe;
}

    .vote-panel { margin-top: 18px; padding: 16px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
    .vote-panel h2 { font-size: 15px; margin-bottom: 5px; }
    .vote-panel > p { font-size: 12px; margin-bottom: 12px; }

    .vote-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 12px; }

    .vote-target {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
      text-align: left;
}

    .vote-target .name { flex: 1; font-weight: 600; }
    .vote-target .count { font-size: 11px; color: var(--muted); }
    .vote-target.sel { border-color: rgba(248, 113, 113, 0.7); background: rgba(248, 113, 113, 0.12); box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.08); }
    .vote-target[disabled] { opacity: 0.4; cursor: default; }

    .notice {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 15px;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--muted);
}

    .finished {
      margin-top: 18px;
      padding: 20px;
      border-radius: var(--radius);
      background: linear-gradient(150deg, rgba(52, 211, 153, 0.16), rgba(34, 211, 238, 0.08));
      border: 1px solid rgba(52, 211, 153, 0.35);
      text-align: center;
}

    .finished .big { font-size: 34px; margin-bottom: 6px; }
    .finished h2 { font-size: 19px; margin-bottom: 6px; }
    .finished p { font-size: 13px; color: #c7f5e4; line-height: 1.5; }

    .join-room { margin-top: 18px; padding: 18px; border-radius: var(--radius); background: var(--panel); border: 1px solid var(--border); }
    .join-room h2 { font-size: 16px; margin-bottom: 6px; }
    .join-room p { font-size: 12px; margin-bottom: 12px; }
    .join-room input { width: 100%; letter-spacing: 0; text-transform: none; margin-bottom: 10px; }

    .state-screen { text-align: center; padding: 70px 20px; }
    .state-screen .emoji { font-size: 46px; margin-bottom: 14px; }
    .state-screen h2 { font-size: 20px; margin-bottom: 8px; }
    .state-screen p { font-size: 13px; color: var(--muted); margin-bottom: 18px; line-height: 1.5; }

    .skeleton {
      height: 120px;
      border-radius: var(--radius);
      background: linear-gradient(100deg, rgba(255, 255, 255, 0.04) 20%, rgba(255, 255, 255, 0.09) 50%, rgba(255, 255, 255, 0.04) 80%);
      background-size: 220% 100%;
      animation: shimmer 1.4s infinite linear;
      margin-bottom: 12px;
}

    @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
    @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    /* #app'da transform ishlatilmaydi: u fixed bottom-nav uchun containing
       block yaratib, menyuni ekran pastida emas, sahifa oxirida qo'yadi. */
    @keyframes appFadeIn { from { opacity: 0; } to { opacity: 1; } }

    .fade { animation: none; }
    /* Kirish animatsiyasi faqat #app tugunida: u qayta yaratilmaydi,
       shuning uchun poll/WebSocket yangilanishlari uni qayta boshlamaydi. */
    #app { animation: appFadeIn 0.25s ease both; }

    /* Hub: bir martalik silliq fade-in va yuklash paytida zaxira balandlik */
    .hub-main .fade { animation: none; }
    .hub-main .profile-card { min-height: 330px; }
    .hub-main .bonus-card { min-height: 215px; }
    .hub-main .hub-missions { min-height: 270px; }
    .hub-main .hub-board { min-height: 320px; }
    .sk-profile { height: 330px; }
    .sk-bonus { height: 215px; }
    .sk-missions { height: 270px; }
    .sk-board { height: 320px; }

    #toast {
      position: fixed;
      left: 50%;
      bottom: calc(24px + env(safe-area-inset-bottom));
      transform: translateX(-50%) translateY(20px);
      background: #1b2338;
      color: var(--text);
      border: 1px solid var(--border);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 13px;
      max-width: calc(100vw - 40px);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 100;
      text-align: center;
}

    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { border-color: rgba(248, 113, 113, 0.5); color: #fecaca; }

    /* ---------- Profil kartasi (Hub) ---------- */
    .profile-card {
      position: relative;
      overflow: hidden;
      margin: 0 0 22px;
      padding: 18px;
      border-radius: 24px;
      background:
        radial-gradient(320px 160px at 100% 0%, rgba(34, 211, 238, 0.16), transparent 65%),
        linear-gradient(150deg, rgba(139, 92, 246, 0.22), rgba(255, 255, 255, 0.035));
      border: 1px solid rgba(139, 92, 246, 0.35);
      box-shadow: var(--shadow);
}

    .profile-card::after {
      content: "";
      position: absolute;
      inset: auto -50px -80px auto;
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.35), transparent 70%);
      pointer-events: none;
}

    .profile-head { position: relative; z-index: 1; display: flex; align-items: center; gap: 13px; padding-right: 74px; }
    .profile-logout {
      position: absolute; top: 12px; right: 12px; z-index: 2;
      padding: 6px 9px; border-radius: 10px;
      border: 1px solid rgba(248, 113, 113, 0.35);
      background: rgba(248, 113, 113, 0.1);
      color: #fecaca; font-size: 11px; font-weight: 700; cursor: pointer;
}
    .profile-logout:active { transform: scale(0.97); }

    /* ---------- Login (auth) ekrani ---------- */
    .auth-screen {
      min-height: calc(100vh - 90px);
      display: flex; flex-direction: column; justify-content: center;
      align-items: stretch; text-align: center;
      padding: 24px 4px; position: relative;
}
    .auth-logo {
      width: 78px; height: 78px; margin: 0 auto 18px;
      display: grid; place-items: center; font-size: 38px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.35), rgba(34, 211, 238, 0.2));
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 20px 50px rgba(139, 92, 246, 0.3);
}
    .auth-screen h1 { font-size: 30px; letter-spacing: -0.7px; margin-bottom: 10px; }
    .auth-lede { color: var(--muted); font-size: 14px; line-height: 1.6; max-width: 340px; margin: 0 auto 26px; }
    .auth-main { font-size: 15px; }
    .auth-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 20px 0; color: var(--muted);
      font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
}
    .auth-divider::before, .auth-divider::after {
      content: ""; flex: 1; height: 1px; background: var(--border);
}
    .auth-form { display: flex; flex-direction: column; gap: 10px; }
    .auth-form input {
      width: 100%; padding: 15px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: var(--panel);
      color: var(--text); font-size: 14px; outline: none;
}
    .auth-form input:focus { border-color: rgba(139, 92, 246, 0.65); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.15); }
    .auth-form input::placeholder { color: var(--muted); font-size: 12px; }
    .auth-error { min-height: 20px; margin-top: 10px; color: #fca5a5; font-size: 12px; line-height: 1.5; }
    .auth-note { margin-top: 8px; }
    body.theme-light .profile-logout { color: #b91c1c; }
    body.theme-light .auth-form input { background: #fff; color: #0f172a; }
    .profile-name-lg { font-size: 18px; font-weight: 800; line-height: 1.2; letter-spacing: -0.2px; }
    .profile-handle { margin-top: 3px; font-size: 12px; color: var(--muted); }

    .avatar.lg {
      width: 58px;
      height: 58px;
      min-width: 58px;
      font-size: 19px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      overflow: hidden;
}

    .avatar img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit; }

    .profile-stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 15px;
}

    .pstat {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.08);
}

    .pstat span { font-size: 9px; letter-spacing: 0.7px; text-transform: uppercase; color: var(--muted); }
    .pstat b { font-size: 12px; white-space: nowrap; }

    .xp-row { position: relative; z-index: 1; display: flex; align-items: center; gap: 8px; margin-top: 10px; }
    .xp-bar { flex: 1; height: 6px; border-radius: 999px; overflow: hidden; background: rgba(255, 255, 255, 0.1); }
    .xp-bar i { display: block; width: 8%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
    .xp-text { font-size: 9px; letter-spacing: 0.4px; color: var(--muted); white-space: nowrap; }
    .btn.invite { position: relative; z-index: 1; width: 100%; margin-top: 13px; background: rgba(255, 255, 255, 0.07); }

    /* ---------- 3D karta ochilishi ---------- */
    .flip-card { position: relative; min-height: 158px; perspective: 1000px; }

    .flip-inner {
      position: absolute;
      inset: 0;
      min-height: 158px;
      transform-style: preserve-3d;
      animation: cardFlip 0.8s cubic-bezier(0.2, 0.75, 0.25, 1) both;
}

    .flip-face {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 13px;
      border-radius: 16px;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
}

    .flip-back {
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-align: center;
      background:
        radial-gradient(120px 80px at 50% 10%, rgba(139, 92, 246, 0.32), transparent 70%),
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.025) 0 8px, transparent 8px 16px),
        linear-gradient(160deg, #141a2e, #090d18);
      border: 1px solid rgba(139, 92, 246, 0.3);
}

    .flip-back .lock-big { font-size: 30px; filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.65)); }
    .flip-back .flip-hint { font-size: 9px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #a5b4fc; }

    .flip-front {
      transform: rotateY(180deg);
      background:
        radial-gradient(140px 90px at 100% 0%, rgba(34, 211, 238, 0.18), transparent 70%),
        linear-gradient(160deg, rgba(139, 92, 246, 0.3), rgba(15, 21, 38, 0.96));
      border: 1px solid rgba(139, 92, 246, 0.6);
      box-shadow: 0 0 34px rgba(139, 92, 246, 0.22);
}

    .flip-front h3 { margin: 9px 0 5px; font-size: 14px; line-height: 1.3; }
    .flip-front p { flex: 1; overflow: auto; font-size: 11.5px; line-height: 1.45; color: #d5dcf2; white-space: pre-line; }
    .revealed-stamp {
      align-self: flex-start;
      margin-top: 8px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.2px;
      color: #6ee7b7;
      border: 1px solid rgba(52, 211, 153, 0.4);
      background: rgba(52, 211, 153, 0.1);
}

    /* ---------- Raund taymeri ---------- */
    .timer-box { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 0 0 auto; }
    .timer-label { font-size: 7px; font-weight: 800; letter-spacing: 1.3px; color: var(--muted); }
    .timer { position: relative; display: grid; place-items: center; width: 46px; height: 46px; }
    .timer svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
    .timer circle { fill: none; stroke-width: 3.5; }
    .timer .track { stroke: rgba(255, 255, 255, 0.1); }
    .timer .progress {
      stroke: var(--danger);
      stroke-linecap: round;
      filter: drop-shadow(0 0 5px rgba(248, 113, 113, 0.8));
      transition: stroke-dashoffset 1s linear, stroke 0.3s ease;
}
    .timer.voting .progress { stroke: #fb7185; filter: drop-shadow(0 0 8px rgba(251, 113, 133, 0.95)); }
    .timer.low { animation: timerPulse 1s ease-in-out infinite; }
    .timer.low .progress { stroke: #ef4444; }
    .timer-text { position: relative; font-size: 10.5px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }

    /* ---------- O'yinchilar holati ---------- */
    .avatar-wrap { position: relative; width: 40px; height: 40px; min-width: 40px; }
    .avatar-wrap .avatar { width: 100%; height: 100%; }

    .vote-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      z-index: 2;
      min-width: 18px;
      height: 18px;
      padding: 0 4px;
      display: grid;
      place-items: center;
      border-radius: 999px;
      border: 2px solid var(--bg);
      background: linear-gradient(135deg, #fb7185, #dc2626);
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      box-shadow: 0 0 10px rgba(248, 113, 113, 0.65);
}

    .vote-badge.hot { animation: votePop 0.45s ease; }

    .player.dead { opacity: 0.48; filter: grayscale(0.9); }

    .avatar-wrap.eliminated::after {
      content: "✕";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 50%;
      border: 2px solid rgba(239, 68, 68, 0.85);
      background: rgba(8, 11, 20, 0.62);
      color: #f87171;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.9);
}

    /* ---------- Bunker epilogi ---------- */
    .epilogue {
      margin-top: 18px;
      overflow: hidden;
      border-radius: 24px;
      text-align: center;
      background: linear-gradient(170deg, #0f172a, #1d1626);
      border: 1px solid rgba(248, 113, 113, 0.3);
      box-shadow: var(--shadow);
}

    .door-scene {
      position: relative;
      height: 142px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 48%, rgba(248, 113, 113, 0.28), transparent 58%),
        linear-gradient(180deg, #080c15, #151a2a);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
}

    .door {
      position: absolute;
      left: 50%;
      top: 16px;
      width: 150px;
      height: 132px;
      transform: translateX(-50%);
      border-radius: 14px 14px 0 0;
      border: 2px solid #334155;
      background:
        linear-gradient(90deg, #222c40 0 47%, #070a12 47% 53%, #222c40 53% 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 0, 0, 0.5);
      animation: doorShut 0.9s cubic-bezier(0.4, 0, 0.2, 1) both;
}

    .door::before,
    .door::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 46%;
      background: repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.045) 0 2px, transparent 2px 18px);
}

    .door::before { left: 0; }
    .door::after { right: 0; }

    .door-wheel {
      position: absolute;
      left: 50%;
      top: 52%;
      width: 48px;
      height: 48px;
      transform: translate(-50%, -50%);
      border: 3px solid #94a3b8;
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(148, 163, 184, 0.12), inset 0 0 18px rgba(0, 0, 0, 0.85);
}

    .door-wheel::before,
    .door-wheel::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 36px;
      height: 3px;
      background: #94a3b8;
      transform: translate(-50%, -50%);
}

    .door-wheel::after { transform: translate(-50%, -50%) rotate(90deg); }

    .door-light {
      position: absolute;
      bottom: 12px;
      left: 50%;
      width: 9px;
      height: 9px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 20px 6px rgba(239, 68, 68, 0.55);
      animation: warningPulse 1.8s ease-in-out infinite;
}

    .epilogue-body { padding: 18px 18px 20px; }
    .epilogue-kicker { margin-bottom: 6px; font-size: 9px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; color: #fca5a5; }
    .epilogue h2 { margin-bottom: 10px; font-size: 21px; letter-spacing: -0.3px; }
    .epilogue-text { margin-bottom: 14px; font-size: 13px; line-height: 1.65; color: #d7dced; }
    .survivors { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 14px; }
    .survivor { display: flex; align-items: center; gap: 7px; padding: 6px 10px 6px 6px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); font-size: 11px; font-weight: 700; }
    .survivor .avatar { width: 26px; height: 26px; min-width: 26px; font-size: 9px; }
    .epilogue-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 9px; letter-spacing: 0.7px; text-transform: uppercase; color: #94a3b8; }
    .epilogue-years { margin: 0 0 16px; display: grid; gap: 9px; }
    .epilogue-year { opacity: 0.18; transform: translateY(10px); transition: opacity 0.55s ease, transform 0.55s ease; border: 1px solid rgba(255,255,255,0.09); border-radius: 13px; padding: 11px 12px; background: rgba(255,255,255,0.035); }
    .epilogue-year.show { opacity: 1; transform: none; }
    .epilogue-year.risk.show { border-color: rgba(248,113,113,0.36); background: rgba(248,113,113,0.07); }
    .epilogue-year.ok.show { border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.06); }
    .epilogue-year-head { display: flex; align-items: center; gap: 7px; font-size: 11.5px; margin-bottom: 4px; }
    .epilogue-year-head b { font-size: 11.5px; }
    .epilogue-year p { margin: 0; font-size: 11px; line-height: 1.5; color: #cbd5e1; }
    .epilogue-outcome { margin-top: 12px; padding: 12px; border-radius: 13px; text-align: center; font-weight: 800; font-size: 13px; opacity: 0; transform: scale(0.96); transition: opacity 0.6s ease, transform 0.6s ease; }
    .epilogue-outcome.show { opacity: 1; transform: none; }
    .epilogue-outcome.win { color: #86efac; border: 1px solid rgba(52,211,153,0.35); background: rgba(52,211,153,0.1); }
    .epilogue-outcome.lose { color: #fca5a5; border: 1px solid rgba(248,113,113,0.35); background: rgba(248,113,113,0.1); }

    /* ---------- Telegram yorug' tema ---------- */
    body.theme-light { background:
      radial-gradient(900px 420px at 12% -10%, rgba(139, 92, 246, 0.12), transparent 65%),
      radial-gradient(700px 380px at 100% 0%, rgba(8, 145, 178, 0.1), transparent 60%),
      var(--bg); }
    body.theme-light .game-card { background: linear-gradient(150deg, rgba(15, 23, 42, 0.055), rgba(15, 23, 42, 0.02)); }
    body.theme-light .game-card.active { border-color: rgba(124, 58, 237, 0.4); }
    body.theme-light .game-icon,
    body.theme-light .icon-btn,
    body.theme-light .badge.soon { background: rgba(15, 23, 42, 0.055); }
    body.theme-light .panel,
    body.theme-light .player,
    body.theme-light .vote-panel,
    body.theme-light .join-room,
    body.theme-light .notice { background: rgba(15, 23, 42, 0.04); border-color: rgba(15, 23, 42, 0.11); }
    body.theme-light .topbar { background: var(--bg); }
    body.theme-light .brand { background: var(--bg); box-shadow: 0 12px 18px -16px rgba(15, 23, 42, 0.35); }
    body.theme-light .catastrophe { background:
      radial-gradient(500px 220px at 100% 0%, rgba(248, 113, 113, 0.16), transparent 60%),
      linear-gradient(155deg, rgba(139, 92, 246, 0.14), rgba(15, 23, 42, 0.03)); border-color: rgba(15, 23, 42, 0.12); }
    body.theme-light .catastrophe > p { color: #334155; }
    body.theme-light .cat-block,
    body.theme-light .stat,
    body.theme-light .pstat { background: rgba(15, 23, 42, 0.045); border-color: rgba(15, 23, 42, 0.08); }
    body.theme-light .cat-block li { color: #334155; }
    body.theme-light .card { background: linear-gradient(160deg, rgba(15, 23, 42, 0.055), rgba(15, 23, 42, 0.02)); }
    body.theme-light .card p { color: #475569; }
    body.theme-light input[type="text"] { background: rgba(15, 23, 42, 0.05); }
    body.theme-light input::placeholder { color: #94a3b8; }
    body.theme-light .vote-target { background: rgba(15, 23, 42, 0.03); }
    body.theme-light .chip { color: #5b21b6; }
    body.theme-light #toast { background: #ffffff; color: #111827; }
    body.theme-light .profile-card { background:
      radial-gradient(320px 160px at 100% 0%, rgba(8, 145, 178, 0.12), transparent 65%),
      linear-gradient(150deg, rgba(139, 92, 246, 0.15), rgba(15, 23, 42, 0.03)); }
    body.theme-light .btn.invite { background: rgba(15, 23, 42, 0.05); }
    body.theme-light .footer { color: #94a3b8; }

    /* ---------- Hamyon, do'kon va boosterlar ---------- */

    /* ---------- Omad gʻildiragi (Roulette Wheel) ---------- */
    .wheel-sheet { text-align: center; }
    .wheel-wrap {
      position: relative;
      width: 280px;
      max-width: 100%;
      aspect-ratio: 1 / 1;
      margin: 16px auto 16px;
      touch-action: none;
    }
    .wheel svg { display: block; width: 100%; height: 100%; border-radius: 50%; }
    .wheel {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow:
        0 0 0 6px rgba(139, 92, 246, 0.18),
        0 0 0 12px rgba(13, 9, 23, 0.6),
        0 18px 50px rgba(0, 0, 0, 0.6),
        inset 0 0 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.1s linear;
      will-change: transform;
      position: relative;
    }
    .wheel.spun {
      transform: rotate(var(--wheel-final, 0deg));
}
    .wheel.spinning {
      animation-name: wheelSpin;
      animation-duration: 3s;
      animation-timing-function: ease-out;
      animation-fill-mode: forwards;
      animation-iteration-count: 1;
    }
    @keyframes wheelSpin {
      0%   { transform: rotate(0deg); }
      5%   { transform: rotate(120deg); }
      20%  { transform: rotate(420deg); }
      50%  { transform: rotate(900deg); }
      80%  { transform: rotate(1440deg); }
      95%  { transform: rotate(1920deg); }
      100% { transform: rotate(var(--wheel-final, 2160deg)); }
    }
    .wheel-pointer {
      position: absolute;
      top: -24px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 30px;
      line-height: 1;
      z-index: 5;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.75));
      pointer-events: none;
    }
    .wheel-hub {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 48px;
      height: 48px;
      padding: 0;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.6);
      background: radial-gradient(circle at 35% 30%, #fff3b0, #fbbf24 55%, #b45309);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.85);
      display: grid;
      place-items: center;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      z-index: 6;
    }
    .wheel-hub:disabled { opacity: 0.7; cursor: default; }
    .wheel-head-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    .wheel-sound-toggle {
      display: grid; place-items: center; width: 32px; height: 32px;
      border-radius: 50%; border: 1px solid rgba(0, 240, 255, 0.32);
      background: rgba(8, 10, 18, 0.72); color: var(--neon);
      font-size: 15px; cursor: pointer;
}
    .wheel-sound-toggle.off { color: var(--muted); border-color: rgba(255,255,255,0.12); }
    .wheel-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 28px;
      height: 28px;
      margin: -14px 0 0 -14px;
      display: grid;
      place-items: center;
      font-size: 18px;
      color: #f2f4fb;
      text-shadow: 0 0 6px rgba(0, 0, 0, 0.8);
      pointer-events: none;
      z-index: 2;
      transition: color 0.2s ease;
    }
    .wheel-result {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      font-size: 14px;
      font-weight: 700;
      color: #f2f4fb;
      margin-bottom: 12px;
      animation: fadeSlideUp 0.3s ease both;
    }
    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes shopUp { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes cardFlip { from { transform: rotateY(0deg); } to { transform: rotateY(180deg); } }
    @keyframes doorShut { from { transform: translateX(-50%) scaleY(0.86) translateY(-8px); opacity: 0.4; } to { transform: translateX(-50%) scaleY(1) translateY(0); opacity: 1; } }
    @keyframes warningPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    @keyframes timerPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes votePop { 0% { transform: scale(0.4); opacity: 0; } 70% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }

    .game-banner {

}
    .bomb-pile {
      min-height: 148px; border-radius: 18px; padding: 12px;

    .bomb-deck-stack { position: relative; width: 82px; height: 112px; }
    .bomb-deck-stack::before,
    .bomb-deck-stack::after {
      content: ""; position: absolute; inset: 0; border-radius: 12px;
      background: linear-gradient(150deg, #7f1d1d, #1e293b);
      border: 1px solid rgba(251, 146, 60, 0.5);

    #bomb-overlays { display: none; }

    @keyframes bomb-flash {
      0% { background: #fff; }
      18% { background: rgba(251, 146, 60, 0.9); }
      100% { background: rgba(15, 23, 42, 0.88); }
}
    @keyframes bomb-pop {

    /* ================================================================
       LAYOUT HIMOYASI: ekran ikkiga bo'linmaydi, gorizontal overflow yo'q
       ================================================================ */
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden !important;
}
    #app {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
      overflow-x: hidden !important;
}
    .hub-main, .room-shell, .bunker-shell, .mafia-shell, .spy-shell, .bomb-room,
    #tab-games, #tab-shop, #tab-rating, #tab-profile {
      width: 100% !important;
      max-width: 100vw !important;
      min-width: 0 !important;
      margin: 0 auto !important;
      display: flex !important;
      flex-direction: column !important;
      overflow-x: hidden !important;
}
    .hub-main > *, .room-shell > *, .bunker-shell > *, .mafia-shell > *,
    .spy-shell > *, .bomb-room > *, #tab-games > *, #tab-shop > *,
    #tab-rating > *, #tab-profile > * {
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
}
    /* Reyting va profil: faqat bitta toza vertikal ustun */
    .board-list, .rating-list, .leaderboard, .history-list, .purchase-list,
    .profile-grid, .profile-split, .stat-grid, .lb-row, .board-tabs {
      display: flex !important;
      flex-direction: column !important;
      grid-template-columns: 1fr !important;
      width: 100% !important;
      max-width: 100% !important;
      min-width: 0 !important;
}
    .board-tabs > * { width: 100% !important; }
    .profile-split > *, .stat-grid > * { max-width: 100% !important; min-width: 0 !important; }

    /* Omad g'ildiragi: orqadagi do'kon ko'rinmaydi */
    .shop-overlay.modal-backdrop,
    .shop-overlay:has(.wheel-sheet) {
      background: rgba(10, 6, 18, 0.98) !important;
      z-index: 99999 !important;
}
    .wheel-sheet {
      position: relative;
      background: rgba(10, 6, 18, 0.98) !important;
      z-index: 100000 !important;
}

    /* ================================================================
       KONTRAST XAVFSIZLIGI: barcha tablar uchun qora qoramtir matnlar
       yo'q; Telegram light rejimi ham dark neon fonga qaytadi.
       ================================================================ */
    body.theme-light {
      --bg: #070b16 !important;
      --bg-soft: #0d1324 !important;
      --text: #f2f4fb !important;
      --muted: #cbd5e1 !important;
      --accent: #8b5cf6 !important;
      --accent-2: #22d3ee !important;
      --panel: rgba(255,255,255,.045) !important;
      --panel-strong: rgba(255,255,255,.075) !important;
      --border: rgba(255,255,255,.09) !important;
      color: #f2f4fb !important;
      background: #070b16 !important;
}
    .muted, .tiny, .game-desc, .game-meta, .item-desc, .profile-handle,
    .shop-lede, .tab-head p:last-child, .distance-note,
    .shop-note, .booster-panel .lede, .shield-offer p, .state-screen p,
    .auth-lede, .card p, .cat-block li, .catastrophe > p,
    .purchase-row .tiny, .history-row .tiny, .m-desc, .q-desc,
    .m-progress, .q-progress, .quest-top .muted, .bonus-card .muted {
      color: #cbd5e1 !important;
}
    .join-card, .join-card *, .item-card, .item-card *,
    .profile-card, .profile-card *, .purchase-history-card,
    .purchase-history-card *, .history-row, .history-row *,
    .game-card, .game-card *, .shop-block, .shop-block * {
      color: inherit;
}
    .join-card h2, .join-card b, .profile-card b,
    .purchase-history-card b, .history-row b {
      color: #ffffff !important;
}
    .wallet-balance b, .shop-wallet-balance b, .purchase-cost,
    .text-amber-300 {
      color: #fcd34d !important;
}
    .nav-item { color: #cbd5e1 !important; }
    .footer { color: #cbd5e1 !important; }
    input::placeholder, .auth-form input::placeholder {
      color: #aebacd !important;
}
  
    /* ---------- Til almashtirgich (i18n) ---------- */
    .lang-switcher { display: flex; justify-content: flex-end; gap: 6px; }
    .lang-btn { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border, rgba(255,255,255,.14)); background: rgba(255,255,255,.06); color: var(--text); font-weight: 700; font-size: 13px; cursor: pointer; }
    .lang-btn.active { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-color: transparent; }
  </style>

      // ---------------- Ovoz tizimi (Web Audio API) ----------------
      var SoundManager = (function () {
        var ctx = null;
        var enabled = true;
        try { enabled = window.localStorage.getItem("rg_sound") !== "off"; } catch (err) {}
        function ensure() {
          if (!enabled) return null;
          try {
            if (!ctx) {
              var Ctor = window.AudioContext || window.webkitAudioContext;
              if (!Ctor) return null;
              ctx = new Ctor();
}
            if (ctx.state === "suspended") ctx.resume();
            return ctx;
          } catch (err) { return null; }
}
        function tone(freq, start, duration, type, gainValue) {
          var audio = ensure();
          if (!audio) return;
          var osc = audio.createOscillator();
          var gain = audio.createGain();
          var at = audio.currentTime + start;
          osc.type = type || "sine";
          osc.frequency.setValueAtTime(freq, at);
          gain.gain.setValueAtTime(0.0001, at);
          gain.gain.exponentialRampToValueAtTime(gainValue || 0.07, at + 0.012);
          gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(at);
          osc.stop(at + duration + 0.03);
}
        var presets = {
          click: function () { tone(880, 0, 0.05, "square", 0.025); tone(1320, 0.02, 0.05, "sine", 0.018); },
          wheel_tick: function () { tone(1450, 0, 0.022, "square", 0.028); tone(920, 0.008, 0.028, "triangle", 0.02); },
          wheel_win: function () { [523, 659, 784, 1046, 1318].forEach(function (f, index) { tone(f, index * 0.11, 0.28, "triangle", 0.075); tone(f * 2, index * 0.11 + 0.015, 0.12, "sine", 0.025); }); },
          card_flip: function () { tone(220, 0, 0.12, "sawtooth", 0.05); tone(520, 0.06, 0.14, "triangle", 0.06); tone(980, 0.13, 0.2, "sine", 0.035); },
          timer_tick: function () { tone(1180, 0, 0.035, "square", 0.022); },
          eliminated: function () { tone(180, 0, 0.5, "sawtooth", 0.085); tone(92, 0.18, 0.72, "sine", 0.075); },
          victory: function () { presets.wheel_win(); }
        };
        return {
          isEnabled: function () { return enabled; },
          toggle: function () {
            enabled = !enabled;
            try { window.localStorage.setItem("rg_sound", enabled ? "on" : "off"); } catch (err) {}
            if (enabled) { try { presets.click(); } catch (err) {} }
            return enabled;
          },
          play: function (name) {
            if (!enabled) return;
            var preset = presets[name];
            if (!preset) return;
            try { preset(); } catch (err) {}
}
        };
      })();

      function formatSeconds(total) {
        var value = Math.max(0, Math.round(total));
        var minutes = Math.floor(value / 60);

        return minutes + ":" + (seconds < 10 ? "0" + seconds : String(seconds));
}

      function stopTimer() {
        if (timer.interval) clearInterval(timer.interval);
        timer = { key: "", deadline: 0, duration: 0, status: "", interval: null };
}

      function paintTimer() {
        var element = document.querySelector("[data-timer]");
        if (!element || !timer.key) return;
        var remaining = Math.max(0, (timer.deadline - Date.now()) / 1000);
        var ratio = timer.duration ? Math.max(0, Math.min(1, remaining / timer.duration)) : 0;
        var circumference = 119.38;
        var ring = element.querySelector("[data-timer-ring]");
        var text = element.querySelector("[data-timer-text]");
        if (ring) ring.style.strokeDashoffset = String(circumference * (1 - ratio));
        if (text) text.textContent = formatSeconds(remaining);
        element.classList.toggle("low", remaining <= 15);
        element.classList.toggle("voting", timer.status === "VOTING");
        var tickValue = Math.ceil(remaining);
        if (tickValue > 0 && tickValue <= 10 && timer.lastTick !== tickValue) {
          timer.lastTick = tickValue;
          sfx("timer_tick");
          haptic("light");
}

      }
      function ensureTimer(room) {
        if (!room || (room.status !== "PLAYING" && room.status !== "VOTING")) {
          stopTimer();
          return;
}
        var key = room.code + ":" + room.current_round + ":" + room.status;
        if (timer.key !== key) {
          stopTimer();
          var duration = TIMER_DURATIONS[room.status] || 120;
          var storageKey = "rg_timer_" + key;
          var deadline = Number(window.sessionStorage.getItem(storageKey));
          if (!deadline || deadline <= 0) {
            deadline = Date.now() + duration * 1000;
            window.sessionStorage.setItem(storageKey, String(deadline));
}
          timer.key = key;
          timer.deadline = deadline;
          timer.duration = duration;
          timer.status = room.status;
          timer.lastTick = 0;
          timer.interval = setInterval(paintTimer, 1000);
}
        paintTimer();
}

            '</svg>' +
            '<span class="timer-text" data-timer-text>--:--</span>' +

}

      function getTgInitData() {
        var webApp = window.Telegram && window.Telegram.WebApp;
        if (webApp && webApp.initData) {
          try { window.localStorage.setItem(TG_INIT_DATA_KEY, webApp.initData); } catch (e) {}
          return webApp.initData;
        }
        var sources = [window.location.search, window.location.hash.substring(1)];
        for (var i = 0; i < sources.length; i++) {
          if (!sources[i]) continue;
          var params = new URLSearchParams(sources[i]);
          var embedded = params.get("tgWebAppData");
          if (embedded) {
            try { window.localStorage.setItem(TG_INIT_DATA_KEY, embedded); } catch (e) {}
            return embedded;
          }
          if (params.has("hash") && params.has("user")) {
            var sourceStr = sources[i];
            try { window.localStorage.setItem(TG_INIT_DATA_KEY, sourceStr); } catch (e) {}
            return sourceStr;
          }
}
        var stored = "";
        try { stored = window.localStorage.getItem(TG_INIT_DATA_KEY) || ""; } catch (e) {}
        return stored;
}

      function pickTgUser(source) {
        if (!source || !source.id) return null;
        var user = {};
        for (var i = 0; i < TG_USER_FIELDS.length; i++) {
          var key = TG_USER_FIELDS[i];
          if (source[key] !== undefined && source[key] !== null) user[key] = source[key];
}
        user.id = Number(source.id);
        return user.id ? user : null;
}

      function readStoredTgUser() {
        try {
          var raw = window.localStorage.getItem(TG_USER_STORAGE_KEY);
          return raw ? pickTgUser(JSON.parse(raw)) : null;
        } catch (error) {
          return null;
}

      }
      function storeTgUser(source) {
        var user = pickTgUser(source);
        if (!user) return null;
        try {
          window.localStorage.setItem(TG_USER_STORAGE_KEY, JSON.stringify(user));
          window.localStorage.setItem(TG_USER_ID_KEY, String(user.id));
          window.localStorage.setItem("cached_user_id", String(user.id));
        } catch (error) {
          /* localStorage yopiq bo'lsa, foydalanuvchi faqat shu sessiyada qoladi. */
}
        return user;
}

      function readProfileCache() {
        try {
          var raw = window.localStorage.getItem(PROFILE_CACHE_KEY);
          return raw ? JSON.parse(raw) : null;
        } catch (error) {
          return null;
}

      }
      function storeProfileCache(account) {
        if (!account) return;
        try {
          var cached = readProfileCache() || {};
          var sameUser = Number(cached.user_id) === Number(account.user_id);
          if (!sameUser) cached = {};
          // Inventar manbai Supabase: serverdan kelgan inventar keshga
          // ustun hisoblanadi, bo'sh kesh hech qachon uni bosib ketmaydi.
          var freshInventory = Array.isArray(account.inventory)
            ? account.inventory
            : ((typeof profile !== "undefined" && profile && Array.isArray(profile.inventory))
              ? profile.inventory
              : (sameUser && Array.isArray(cached.inventory) ? cached.inventory : []));
          var freshFrame = String(account.frame || account.equipped_frame || (sameUser ? cached.frame : ""));
          var freshTitle = String(account.title || account.equipped_title || (sameUser ? cached.title : ""));
          window.localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify({
            user_id: Number(account.user_id) || 0,
            full_name: String(account.full_name || ""),
            username: String(account.username || ""),
            balance: Number(account.coins != null ? account.coins : account.balance) || 0,
            games_played: Number(account.games_played) || 0,
            wins: Number(account.wins) || 0,
            bunker_wins: Number(account.bunker_wins) || 0,
            mafia_wins: Number(account.mafia_wins) || 0,
            spy_wins: Number(account.spy_wins) || 0,
            alias_wins: Number(account.alias_wins) || 0,
            bomb_wins: Number(account.bomb_wins) || 0,
            inventory: freshInventory,
            frame: freshFrame,
            title: freshTitle
          }));
        } catch (error) {
          /* Kesh yozilmasa ham profil ishlaydi. */
}

      }
      function storeInventoryCache() {
        if (typeof profile === "undefined" || !profile || !profile.id) return;
        try {
          var cached = readProfileCache() || {};
          if (Number(cached.user_id) !== Number(profile.id)) cached = {};
          cached.user_id = Number(profile.id) || 0;
          cached.inventory = Array.isArray(profile.inventory) ? profile.inventory : (cached.inventory || []);
          cached.frame = String(profile.frame || "");
          cached.title = String(profile.title || "");
          window.localStorage.setItem(PROFILE_CACHE_KEY, JSON.stringify(cached));
        } catch (error) {
          /* localStorage yopiq bo'lsa ham serverdagi inventar ishlaydi. */
}

      }
      function urlParamUser() {
        try {
          var params = new URLSearchParams(window.location.search);
          var uid = Number(params.get("uid") || params.get("user_id") || 0);
          if (!uid) return null;
          return {
            id: uid,
            first_name: (params.get("fname") || params.get("full_name") || "").trim(),
            last_name: "",
            username: (params.get("uname") || params.get("username") || "").trim(),
            photo_url: params.get("photo") || ""
          };
        } catch (error) {
          return null;
}

      }
      function getTgUser() {
        try {
          var webApp = window.Telegram && window.Telegram.WebApp;
          var unsafeUser = webApp && webApp.initDataUnsafe && webApp.initDataUnsafe.user;
          if (unsafeUser && unsafeUser.id) {
            try { window.localStorage.setItem(TG_USER_ID_KEY, String(unsafeUser.id)); } catch (e) {}
            return storeTgUser(unsafeUser);
          }

          var raw = getTgInitData();
          if (raw) {
            var userJson = new URLSearchParams(raw).get("user");
            if (userJson) {
              var parsed = JSON.parse(userJson);
              if (parsed && parsed.id) {
                try { window.localStorage.setItem(TG_USER_ID_KEY, String(parsed.id)); } catch (e) {}
                return storeTgUser(parsed);
              }
            }
          }

        } catch (error) {
          console.warn("Telegram foydalanuvçi ma'lumotini öqib bölmadi", error);
}
        // Pastki klaviaturadagi web_app havolasi initData yubormasligi mumkin:
        // havoladagi ?uid=&uname=&fname= parametrlaridan foydalanamiz.
        var fromUrl = urlParamUser();
        if (fromUrl) {
          try { window.localStorage.setItem(TG_USER_ID_KEY, String(fromUrl.id)); } catch (e) {}
          return storeTgUser(fromUrl);
        }
        // initData bo'sh kelganda oxirgi ma'lum foydalanuvchini xotiradan o'qiymiz.
        var storedId = 0;
        try { storedId = Number(window.localStorage.getItem(TG_USER_ID_KEY) || 0); } catch (e) {}
        if (storedId > 0) {
          var stored = readStoredTgUser();
          if (stored && stored.id === storedId) return stored;
        }
        // initData umuman bo'lmasa ham oxirgi ma'lum id bilan ishlaymiz.
        var cachedId = 0;
        try {
          cachedId = Number(window.localStorage.getItem("cached_user_id") || 0);
        } catch (cachedError) {}
        if (cachedId > 0) {
          var cachedUser = readStoredTgUser();
          return storeTgUser({
            id: cachedId,
            first_name: (cachedUser && cachedUser.first_name) || "O'yinchi",
            last_name: "",
            username: "",
            photo_url: ""
          });
        }
        return null;
}

      function inventoryItems() {
        var owned = inventoryMap();
        var catalog = shopCatalogMap();
        var rows = [];
        Object.keys(owned).forEach(function (slug) {
          var entry = owned[slug] || {};
          var qty = Number(entry.quantity) || 0;
          if (qty <= 0) return;
          var item = ITEM_LABELS[slug] || catalog[slug] || {};
          var kind = entry.kind || item.kind || "";
          rows.push({
            slug: slug,
            qty: qty,
            title: entry.title || item.title || slug,
            emoji: entry.emoji || item.emoji || "🎁",
            equipped: !!entry.is_equipped,
            equippable: !!(item.equippable || kind === "frame" || kind === "title" ||
              /^(frame_|title_|clan_)/.test(slug))
          });
        });
        rows.sort(function (a, b) {
          if (a.equipped !== b.equipped) return a.equipped ? -1 : 1;
          return String(a.title).localeCompare(String(b.title));
        });
        return rows;
}

        "#7c3aed", "#06b6d4", "#f59e0b", "#8b5cf6",

      ];
      var WHEEL_SHORT_LABELS = {
        coins_10: "🪙 10",
        coins_20: "🪙 20",
        coins_50: "🪙 50",
        coins_100: "🪙 100",
        coins_500: "🪙 500",

      function wheelPoint(cx, cy, radius, deg) {
        var rad = (deg - 90) * Math.PI / 180;
        return [cx + radius * Math.cos(rad), cy + radius * Math.sin(rad)];
      }
      function wheelNum(value) { return Math.round(value * 100) / 100; }

      // 8 sektor: har biri 45°, ustma-ust tushmaydi. Faqat qisqa yozuv.
      function buildWheelSvg(segments, uprightAngle) {
        var upright = Number(uprightAngle) || 0;
        var items = segments && segments.length ? segments : [];
        var count = items.length || 8;
        var step = 360 / count;
        var cx = 140, cy = 140, radius = 132, labelRadius = 76;
        var parts = [];
        for (var i = 0; i < count; i++) {
          var start = i * step - step / 2;
          var end = start + step;
          var p1 = wheelPoint(cx, cy, radius, start);
          var p2 = wheelPoint(cx, cy, radius, end);
          parts.push('<path d="M' + cx + ' ' + cy +
            ' L' + wheelNum(p1[0]) + ' ' + wheelNum(p1[1]) +
            ' A' + radius + ' ' + radius + ' 0 0 1 ' + wheelNum(p2[0]) + ' ' + wheelNum(p2[1]) +
            ' Z" fill="' + WHEEL_COLORS[i % WHEEL_COLORS.length] + '"' +
            ' stroke="rgba(255,255,255,0.2)" stroke-width="2"/>');
        }
        for (var j = 0; j < count; j++) {
          var segment = items[j] || {};
          var label = WHEEL_SHORT_LABELS[segment.key] || segment.emoji || "";
          var mid = j * step;
          parts.push('<g transform="translate(' + cx + ' ' + cy + ') rotate(' + wheelNum(mid) +
            ') translate(0 -' + labelRadius + ') rotate(' + wheelNum(-mid - upright) + ')">' +
            '<rect x="-28" y="-11" width="56" height="22" rx="11" fill="rgba(0,0,0,0.32)"/>' +
            '<text x="0" y="1" text-anchor="middle" dominant-baseline="middle" font-size="12"' +
            ' font-weight="700" fill="#ffffff">' + label + '</text></g>');
        }
        parts.push('<circle cx="' + cx + '" cy="' + cy + '" r="' + radius +
          '" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>');
        return '<svg class="wheel-svg" viewBox="0 0 280 280" width="280" height="280" role="img" aria-label="Omad gildiragi">' +
          parts.join("") + '</svg>';
      }

          var data = await request(path);
          if (data) {
            view.items = data;
            if (data.shop) view.shop = data.shop;
            if (data.equipped) {
              applyServerEquipped(data.equipped, data.inventory);
} else if (data.inventory) {
              profile.inventory = data.inventory;

            if (data.spin) view.spin = data.spin;
            if (typeof data.coins === "number") profile.balance = data.coins;
}

          toast(error.message || "Buyumlarni yuklab bölmadi", "error");

        view.itemsLoading = false;
}

      function resolveEquipKind(slug, itemType) {
        var type = String(itemType || "").toLowerCase();
        if (type === "frame" || type === "cosmetics" || type === "cosmetic") return "frame";
        if (type === "title" || type === "titles") return "title";
        var value = String(slug || "");
        if (/^frame[_-]/.test(value)) return "frame";
        if (/^title[_-]/.test(value)) return "title";
        var item = typeof findShopItem === "function" ? findShopItem(value) : null;
        if (item && item.kind === "frame") return "frame";
        if (item && item.kind === "title") return "title";
        return "";
      }

      function markEquippedLocally(slug, kind) {
        var inventory = (profile && Array.isArray(profile.inventory)) ? profile.inventory : [];
        inventory.forEach(function (entry) {
          if (!entry) return;
          var entrySlug = String(entry.slug || entry.item_slug || "");
          if (resolveEquipKind(entrySlug, entry.kind || "") === kind) {
            entry.is_equipped = entrySlug === slug;
          }
        });
        if (view.items && Array.isArray(view.items.inventory)) {
          view.items.inventory = inventory;
        }
        storeInventoryCache();
      }

      function applyEquipPayload(data, slug, kind, equip) {
        if (data && data.equipped) {
          applyServerEquipped(data.equipped, data.inventory);
          return;
        }
        if (kind === "frame") applyAvatarFrame(equip ? slug : "");
        else if (kind === "title") applyProfileTitle(equip ? slug : "");
        if (data && data.inventory) profile.inventory = data.inventory;
        markEquippedLocally(slug, kind);
      }

      async function restoreEquippedFromServer() {
        try {
          var data = await request(accountPath());
          if (data && data.equipped) {
            applyServerEquipped(data.equipped, data.inventory);
          }
        } catch (error) {
          /* Holatni tiklab bo'lmadi — keyingi yangilanishda qayta o'qiladi. */
        }
      }

      async function equipItem(itemId, itemType) {
        var slug = String(itemId || "");
        var kind = resolveEquipKind(slug, itemType);
        if (!slug || !kind) {
          toast("Bu buyumni taqib bo'lmaydi", "error");
          return;
        }
        if (view.itemBusy) return;
        view.itemBusy = true;
        // 1. Darhol interfeysda: localStorage + avatar ramkasi / titul.
        if (kind === "frame") applyAvatarFrame(slug);
        else applyProfileTitle(slug);
        markEquippedLocally(slug, kind);
        renderHub();
        try {
          // 2. Backend orqali Supabase'ga saqlash.
          var data = await request("/api/profile/equip", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              user_id: profile.id,
              item_slug: slug,
              item_id: slug,
              item_type: kind,
              equip: true
            })
          });
          applyEquipPayload(data, slug, kind, true);
          toast(kind === "title" ? "👑 Unvon taqildi!" : "🖼️ Ramka taqildi!", "success");
          haptic("success");
          if (view.activity) await loadActivity(true);
        } catch (error) {
          // Supabase xatosi taqishni bekor qilmasligi kerak: ramka
          // localStorage'da qoladi va avatarda darhol ko'rinadi.
          if (kind === "frame") applyAvatarFrame(slug);
          else applyProfileTitle(slug);
          markEquippedLocally(slug, kind);
          var ownershipError = error && error.status === 400 &&
            /sotib oling|taqib bo'lmaydi/i.test(error.message || "");
          if (ownershipError) {
            await restoreEquippedFromServer();
            toast(error.message || "Taqib bo'lmadi", "error");
          } else {
            toast("✅ Ramka saqlandi. Sinxronlash keyinroq bajariladi.", "success");
            haptic("success");
          }
        } finally {
          view.itemBusy = false;
          renderHub(); // Inventarda "Taqilgan ✅" holati.
        }
      }

      async function toggleEquip(slug, equip) {
        if (!slug) return;
        if (equip) {
          await equipItem(slug, resolveEquipKind(slug));
          return;
        }
        if (view.itemBusy) return;
        view.itemBusy = true;
        var kind = resolveEquipKind(slug);
        try {
          var data = await request("/api/profile/equip", {
            method: "POST",

          toast("Yeçildi", "success");

          toast(error.message || "Amal bajarilmadi", "error");
          await restoreEquippedFromServer();
        } finally {
          view.itemBusy = false;
          renderHub();
        }
}

      function getWheelElement() {

      async function spinWheel() {
        if (view.wheelBusy) return;
        view.wheelBusy = true;
        view.wheelResult = null;
        // OMAD G'ILDIRAGI — REAL TO'XTASH FIZIKASI (FAIR SPIN)
        // 8 ta sektor, har biri 45°. Tasodifiy to'xtash burchagi birinchi
        // aniqlanadi, ko'rsatkich ostidagi sektor indeksi esa formuladan
        // hisoblanadi; backend aynan shu sektorni mukofotlaydi.
        const stopAngle = Math.floor(Math.random() * 360);
        const finalDegrees = 1800 + stopAngle;
        const winningIndex = Math.floor(((360 - (finalDegrees % 360) + 22.5) % 360) / 45);
        view.wheelFinalAngle = finalDegrees;
        view.wheelWinningIndex = winningIndex;
        renderHub();
        var wheelEl = getWheelElement();
        var wheelSegments = (view.items && view.items.wheel && view.items.wheel.segments) || [];
        if (wheelEl) {
          wheelEl.style.setProperty("--wheel-final", finalDegrees + "deg");
          wheelEl.classList.remove("spinning");
          void wheelEl.offsetWidth;
          wheelEl.classList.add("spinning");
        }
        // Ko'rsatkich har bir sektordan o'tayotganda mexanik chertish.
        var lastTickIndex = -1;
        var tickStartedAt = Date.now();
        var tickTimer = setInterval(function () {
          var progress = Math.min(1, (Date.now() - tickStartedAt) / 3000);
          var eased = 1 - Math.pow(1 - progress, 3);
          var currentAngle = finalDegrees * eased;
          var current = Math.floor(((360 - (currentAngle % 360) + 22.5) % 360) / 45);
          if (current !== lastTickIndex) {
            lastTickIndex = current;
            sfx("wheel_tick");
          }
        }, 45);
        var spinStartedAt = tickStartedAt;
        try {
          var data = await request("/api/spin/wheel", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id, stop_angle: stopAngle })
          });
          var spinWait = 3000 - (Date.now() - spinStartedAt);
          if (spinWait > 0) {
            await new Promise(function (resolve) { setTimeout(resolve, spinWait); });
          }
          if (data && data.segment && wheelSegments.length) {
            var serverIndex = wheelSegments.findIndex(function (segment) {
              return segment.key === data.segment.key;
            });
            if (serverIndex >= 0 && serverIndex !== winningIndex) {
              throw new Error("Gʻildirak natijasi koʻrsatkich bilan mos kelmadi");
            }
          }
          if (data) {
            view.wheelResult = data;
            profile.balance = Number(data.coins) || profile.balance;
            profile.inventory = data.inventory || profile.inventory;
            if (view.items) {
              view.items.inventory = data.inventory || view.items.inventory;
              view.items.spin = data.spin || view.items.spin;
          }
            view.spin = data.spin || view.spin;
            haptic("success");
            sfx("wheel_win");
          }
        } catch (error) {
          toast(error.message || "Aylantiriş amalga oşmadi", "error");
          haptic("error");
        } finally {
          if (tickTimer) clearInterval(tickTimer);
          view.wheelBusy = false;
          // Gildirak yakuniy burcagida qoladi: natija korinsin, sakrab qaytmasin.
          view.wheelAngle = finalDegrees;
          view.wheelFinalAngle = finalDegrees;
          renderHub();
        }
      }

      function syncTelegramProfile() {

        if (!u || !u.id) return;

        profile.photo = u.photo_url || profile.photo || "";
        profile.guest = false;
        profile.authenticated = true;

      var BOOTSTRAP_CACHE_KEY = "rg_bootstrap_v1";

      function bootstrapPath() {
        return "/api/bootstrap?user_id=" + encodeURIComponent(profile.id) +
          "&username=" + encodeURIComponent(profile.username || "") +
          "&full_name=" + encodeURIComponent(profile.name || "");

      function readBootstrapCache() {
        try {
          var raw = window.localStorage.getItem(BOOTSTRAP_CACHE_KEY);
          var data = raw ? JSON.parse(raw) : null;
          if (!data || !data.account) return null;
          if (Number(data.user_id) !== Number(profile.id)) return null;
          return data;
        } catch (error) {
          return null;
        }
      }

      function storeBootstrapCache(data) {
        if (!data || !data.account) return;
        try {
          window.localStorage.setItem(BOOTSTRAP_CACHE_KEY, JSON.stringify({
            user_id: Number(profile.id) || 0,
            account: data.account,
            activity: data.activity || null,
            tournament: data.tournament || null,
            games: data.games || [],
            saved_at: Date.now()
          }));
        } catch (error) {
          /* localStorage yopiq bo'lsa ham ilova ishlaydi */
        }
      }

      function applyAccountPayload(data) {
        if (!data || !data.user) return false;
        updateProfileFromAccount(data.user);
        try { if (window.I18N && data.user.language_code) window.I18N.initFromServer(data.user.language_code); } catch (e) {}
        if (data.equipped) applyServerEquipped(data.equipped, data.inventory);
        else if (Array.isArray(data.inventory)) profile.inventory = data.inventory;
        storeInventoryCache();
        view.history = data.history || view.history || [];
        if (view.shopOpen) view.shop = data.shop || view.shop;
        return true;
}

      function activityState() {
        return view.activity || { bonus: null, missions: [], quests: null, achievements: [], top: [], me: null };
