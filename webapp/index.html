      // ----------------------------------------------------------------
      // Josus (Spyfall)
      // ----------------------------------------------------------------
      var SPY_PHASES = {
        LOBBY: "Kutilmoqda",
        PLAYING: "Muhokama",
        VOTING: "Ovoz beriş",
        FINISHED: "Tugadi"
      };
      var spyClock = { deadline: 0, duration: 300, offset: 0, interval: null };

      function spyStartCode(value) {
        var match = /^(?:spy_)?(SPY\d{3})$/i.exec(String(value || "").trim());
        return match ? match[1].toUpperCase() : "";
}

      function spyRuled() {
        if (!view.spyRuled) view.spyRuled = {};
        return view.spyRuled;
}

      function enterSpy(code) {
        var normalized = spyStartCode(code) || normalizeCode(code);
        if (!/^SPY\d{3}$/.test(normalized)) {
          toast("Josus xona kodi SPY123 körinişida böladi", "error");
          return;
}
        view.mode = "spy";
        view.code = normalized;
        view.spy = null;
        view.spyState = null;
        view.spyError = null;
        view.spyLoading = true;
        view.spyOpen = false;
        view.spyVoteTarget = null;
        view.spyGuessKey = null;
        view.spyRuled = {};
        view.spyEntry = false;
        if (view.spyTimer) {
          clearTimeout(view.spyTimer);
          view.spyTimer = null;
}
        stopLive();
        stopTimer();
        stopMafiaClock();
        stopSpyClock();
        setBackButton(true);
        renderSpy();
        loadSpyState();
}

      function stopSpyClock() {
        if (spyClock.interval) clearInterval(spyClock.interval);
        spyClock.interval = null;
        spyClock.deadline = 0;
}

      function paintSpyClock() {
        var el = document.querySelector("[data-spy-timer]");
        if (!el || !spyClock.deadline) return;
        var now = Date.now() / 1000 + spyClock.offset;
        var remaining = Math.max(0, Math.ceil(spyClock.deadline - now));
        var text = el.querySelector("[data-spy-time]");
        if (text) text.textContent = formatSeconds(remaining);
        var ring = el.querySelector("[data-spy-ring]");
        if (ring) {
          var ratio = Math.max(0, Math.min(1, remaining / spyClock.duration));
          ring.style.strokeDashoffset = String(113.1 * (1 - ratio));
}
        el.classList.toggle("low", remaining <= 30);
        if (remaining > 0 && remaining <= 10 && spyClock.lastTick !== remaining) {
          spyClock.lastTick = remaining;
          sfx("timer_tick");
}

      function syncSpyClock(state) {
        stopSpyClock();
        if (!state || !state.deadline || state.status === "FINISHED") return;
        spyClock.deadline = Number(state.deadline) || 0;
        spyClock.duration = Math.max(1, Number(state.round_seconds) || 300);
        spyClock.offset = (Number(state.deadline) - Number(state.seconds_left || 0))
          - Date.now() / 1000;
        paintSpyClock();
        spyClock.interval = setInterval(paintSpyClock, 1000);
}

      function scheduleSpyPoll() {
        if (view.spyTimer) {
          clearTimeout(view.spyTimer);
          view.spyTimer = null;
}
        var state = view.spyState;
        if (!state || state.status === "FINISHED") return;
        if (!["LOBBY", "PLAYING", "VOTING"].includes(state.status)) return;
        view.spyTimer = setTimeout(function () {
          if (view.mode === "spy") loadSpyState();
        }, 4000);
}

      function applySpyData(data) {
        if (!data || !data.state) return;
        view.spy = data.me;
        view.spyState = data.state;
        if (data.locations) view.spyLocations = data.locations;
        if (data.coins != null) profile.balance = Number(data.coins) || 0;
        if (data.state.status === "FINISHED") {
          view.spyVoteTarget = null;
          view.spyGuessKey = null;
}
        view.spyLoading = false;
        view.spyError = null;
}

      async function loadSpyState(retried) {
        var code = view.code;
        try {
          var data = await request(
            "/api/spy/" + encodeURIComponent(code) + "?user_id=" +
            encodeURIComponent(profile.id)
          );
          if (view.mode !== "spy" || view.code !== code) return;
          applySpyData(data);
          renderSpy();
          scheduleSpyPoll();
        } catch (error) {
          if (view.mode !== "spy" || view.code !== code) return;
          if (error.status === 403 && !retried) {
            // Guruhdan kelgan foydalanuvchi hali qo'shilmagan bo'lsa — avtomatik qo'shamiz.
            try {
              var joined = await request(
                "/api/spy/" + encodeURIComponent(code) + "/join",
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ user_id: profile.id, name: profile.name || "" })
}
              );
              if (view.mode !== "spy" || view.code !== code) return;
              applySpyData(joined);
              renderSpy();
              scheduleSpyPoll();
              return;
            } catch (joinError) {
              error = joinError;
}
          view.spyLoading = false;
          view.spyError = error;
          stopSpyClock();
          renderSpy();
}

      async function createSpyRoom() {
        if (view.actionBusy) return;
        view.actionBusy = true;
        try {
          var data = await request("/api/spy/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: profile.id, name: profile.name || "Öyinçi" })
          });
          view.spyEntry = false;
          if (data && data.state && data.state.code) enterSpy(data.state.code);
        } catch (error) {
          toast(error.message || "Xona yaratilmadi", "error");
        } finally {
          view.actionBusy = false;
}

      async function spyPost(path, payload, successMessage) {
        if (view.spyActionBusy) return null;
        var code = view.code;
        view.spyActionBusy = true;
        renderSpy();
        try {
          var data = await request("/api/spy/" + encodeURIComponent(code) + "/" + path, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.assign(
              { user_id: profile.id, name: profile.name || "" },
              payload || {}
            ))
          });
          if (view.mode !== "spy" || view.code !== code) return null;
          applySpyData(data);
          if (data.result && data.result.reason) {
            toast(data.result.reason, data.result.correct === false ? "error" : "success");
          } else if (successMessage) {
            toast(successMessage, "success");
}
          haptic("success");
          return data;
        } catch (error) {
          if (view.mode === "spy" && view.code === code) {
            toast(error.message || "Harakat bajarilmadi", "error");
}
          return null;
        } finally {
          if (view.mode === "spy" && view.code === code) {
            view.spyActionBusy = false;
            renderSpy();
            scheduleSpyPoll();
}

      function spyCardHtml(me, state) {

        var opened = Boolean(view.spyOpen) || finished;
        var front;
        if (me.is_spy && !finished) {

}
        return '<div class="tarot-scene"><div class="tarot-card' + (opened ? " flipped" : "") + '">' +

      function spyLocationsHtml(me, state) {
        var locations = view.spyLocations || [];
        if (!locations.length || !state) return "";
        if (state.status === "LOBBY") return "";
        var hinted = {};
        ((me && me.hint_exclusions) || []).forEach(function (key) { hinted[key] = true; });
        var ruled = spyRuled();
        var canGuess = Boolean(me && me.is_spy) && state.status !== "FINISHED";
        var rows = locations.map(function (location) {
          var classes = ["spy-location"];
          if (hinted[location.key]) classes.push("hinted");
          else if (!canGuess && ruled[location.key]) classes.push("ruled");
          if (canGuess && view.spyGuessKey === location.key) classes.push("sel");
          var attrs = hinted[location.key]
            ? " disabled"
            : (canGuess
              ? ' data-act="spy-pick" data-key="' + esc(location.key) + '"'
              : ' data-act="spy-rule" data-key="' + esc(location.key) + '"');
          return '<button class="' + classes.join(" ") + '"' + attrs + '>' +
            '<span class="sl-emoji">' + esc(location.emoji) + '</span>' +
            '<span>' + esc(location.name) + '</span></button>';
        }).join("");

        var hint = "";
        if (canGuess) {
          var excluded = ((me && me.hint_exclusions) || []).length;
          hint = '<div class="spy-hint-row"><span class="muted tiny">' +
              (excluded ? icon("eye") + " Radar: " + excluded + " ta notöğri joy öçirildi" : "Lokatsiyani tanlab, taxmin qiling") +
            '</span></div>' +
            '<button class="btn primary block" data-act="spy-guess"' +
              (view.spyGuessKey == null || view.spyActionBusy ? " disabled" : "") +
              '>' + icon("target") + ' Men joyni topdim!</button>';
        } else if (state.status !== "FINISHED") {
          hint = '<p class="muted tiny" style="margin-top:8px">Şubhadan çiqarilgan joyni belgilaş uçun bosing.</p>';
}

        return '<section class="panel"><h2>' + icon("map-pin") + ' Lokatsiyalar (' + locations.length + ')</h2>' +
          '<div class="spy-locations">' + rows + '</div>' + hint + '</section>';
}

      function spyPlayersHtml(me, state) {
        if (!state) return "";
        var players = state.players || [];
        var finished = state.status === "FINISHED";
        var voting = state.status === "VOTING" || state.status === "PLAYING";
        var canVote = Boolean(me) && voting && !me.has_voted;
        var rows = players.map(function (player) {
          var self = player.is_me;
          var selected = Number(view.spyVoteTarget) === Number(player.user_id);
          var action = "";
          if (canVote && !self) {
            action = '<button class="btn small' + (selected ? " primary" : "") + '" data-act="spy-vote-select" data-target="' +
              player.user_id + '">' + (selected ? "Tanlandi" : "Ovoz") + '</button>';
          } else if (finished) {
            action = '<span class="badge ' + (player.is_spy ? "soon" : "live") + '">' +
              (player.is_spy ? "JOSUS" : "TINCH") + '</span>';
}
          return '<div class="player' + (selected ? " sel" : "") + '">' +
            avatarHtml(player.name, player.user_id, "sm") +
            '<div class="p-body"><div class="p-name">' + esc(player.name) +
              (self ? ' <span class="badge me">SIZ</span>' : '') +
              (player.is_host ? ' <span class="badge">EGASI</span>' : '') + '</div>' +
              '<div class="p-meta">' +
                (player.has_voted ? "Ovoz berdi" : (voting ? "Ovoz bermagan" : "Öyinda")) +
                ((state.votes_count && (finished || state.status === "VOTING"))
                  ? " · " + Number(player.votes || 0) + " ovoz"
                  : "") +
              '</div></div>' + action + '</div>';
        }).join("");

        var controls = "";
        if (canVote && view.spyVoteTarget != null) {

            (view.spyActionBusy ? " disabled" : "") + '>Josus deb ovoz beriş</button>';
        } else if (me && me.has_voted && voting) {
          controls = '<div class="notice tiny" style="margin-top:10px">Ovozingiz qabul qilindi. Boşqalarni kuting.</div>';
}
        return '<section class="panel"><h2>' + icon("users") + ' Öyinçilar (' + players.length + '/' + (state.max_players || 12) + ')</h2>' +
          '<div class="players">' + rows + '</div>' + controls + '</section>';
}

        var state = view.spyState;

                '<circle class="track" cx="22" cy="22" r="18"></circle>' +
                '<circle class="progress" data-spy-ring cx="22" cy="22" r="18" stroke-dasharray="113.1" stroke-dashoffset="0"></circle>' +
              '</svg><span data-spy-time>' + esc(formatSeconds(Number(state.seconds_left) || 0)) + '</span></div>' +
            '<div class="mafia-timer-copy"><b>' + esc(phaseLabel) + '</b><small>' +
              (status === "VOTING" ? "Vaqt tugadi \u2014 ovoz bering" : "Muhokama davom etmoqda") +

}

        var booster = "";
        if (me && me.is_spy && (status === "PLAYING" || status === "VOTING")) {

              '<span class="mb-price">' + (used ? "Faol" : price + " " + icon("coin")) + '</span></button></section>';
}

        var result = "";
        if (status === "FINISHED") {

          result = '<section class="mafia-reveal">' +

      function mvpName(player) {

      function buildMvpPayload(kind, state, players, winnerText) {
        var roster = (players || []).slice();
        if (!roster.length) return null;
        var scored = roster.slice().sort(function (a, b) {
          var ax = Number(a.score || a.points || a.votes_against || 0);
          var bx = Number(b.score || b.points || b.votes_against || 0);
          return bx - ax;
        });
        var mvp = scored[0];
        var alive = roster.filter(function (player) { return player.is_alive; });
        var dead = roster.filter(function (player) { return !player.is_alive; });
        var rows = [
          { label: "Öyin", value: kind },
          { label: "Natija", value: winnerText || "Yakunlandi" },
          { label: "Omon qolganlar", value: String(alive.length) },
          { label: "Haydalganlar", value: dead.length ? dead.map(mvpName).join(", ") : "—" }
        ];
        return {
          name: mvpName(mvp),
          reason: "Eng faol va natijali öyinçi — öyin MVPsi!",
          rows: rows,
          share: "🏆 " + kind + " yakunlandi. MVP: " + mvpName(mvp) + ". " + (winnerText || "")
        };
}

      // ---------------- Alias natijasi (bot havolasidan) ----------------
      function decodeBase64Json(value) {
        try {
          var normalized = String(value || "").replace(/-/g, "+").replace(/_/g, "/");
          while (normalized.length % 4) normalized += "=";
          var binary = atob(normalized);
          var bytes = new Uint8Array(binary.length);
          for (var index = 0; index < binary.length; index += 1) {
            bytes[index] = binary.charCodeAt(index);
}
          return JSON.parse(new TextDecoder("utf-8").decode(bytes));
        } catch (error) {
          return null;
}

      function aliasResultFromUrl() {
        try {
          var token = new URLSearchParams(window.location.search).get("alias_result");
          return token ? decodeBase64Json(token) : null;
        } catch (error) {
          return null;
}

      function viewerIdFromContext() {
        try {
          if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {

}
        } catch (error) {}
        try {
          var uid = Number(new URLSearchParams(window.location.search).get("uid") || 0);
          if (uid) return uid;
        } catch (error) {}
        return Number((profile && profile.id) || 0) || 0;
}

      // ----------------------------------------------------------------
      // Portlovçi Bomba
      // ----------------------------------------------------------------
      var BOMB_ACTION_TYPES = ["ATTACK", "SKIP", "FUTURE", "SHUFFLE", "STEAL"];
      var BOMB_IMAGES = {
        BOMB: "bomb.png", DEFUSE: "defuse.png", ATTACK: "attack.png",
        SKIP: "skip.png", FUTURE: "future.png", SHUFFLE: "shuffle.png",
        STEAL: "steal.png"
      };

      function bombStartCode(value) {
        var match = String(value || "").toUpperCase().match(/BMB\d{3}/);
        return match ? match[0] : "";
}

      function bombMeta(type) {
        var cards = (view.bombState && view.bombState.cards) || {};
        return cards[type] || { name: String(type || "Karta"), symbol: "🃏", ability: "" };
}

      function bombCardImage(type) {
        return "assets/images/bomb/" + (BOMB_IMAGES[type] || "bomb.png");
}

      function bombFaceHtml(type, cls) {
        var meta = bombMeta(type);
        return '<div class="bomb-face ' + (cls || "") + '">' +
          '<img src="' + bombCardImage(type) + '" alt="' + esc(meta.name) + '" loading="lazy" />' +
          '<div class="bomb-face-name">' + esc(meta.symbol || "") + ' ' + esc(meta.name) + '</div>' +
        '</div>';
}

      function bombPlayerName(state, userId) {
        var found = (state.players || []).filter(function (player) {
          return Number(player.user_id) === Number(userId);
        })[0];
        return found ? found.name : "Öyinçi";
}

      function stopBombPolling() {
        if (view.bombPoll) {
          clearInterval(view.bombPoll);
          view.bombPoll = null;
}

      function startBombPolling() {
        if (view.bombPoll || view.mode !== "bomb") return;
        view.bombPoll = setInterval(function () {
          if (view.mode === "bomb" && !view.bombBusy) loadBombState(true);
        }, 4000);
}

      function enterBomb(code) {
        var normalized = bombStartCode(code) || normalizeCode(code);
        if (!normalized) {
          toast("Bomba xona kodi BMB123 körinişida bölişi kerak", "error");
          return;
}
        stopLive();
        stopTimer();
        stopBombPolling();
        view.mode = "bomb";
        view.bombCode = normalized;
        view.code = normalized;
        view.bombEntry = false;
        view.bombState = null;
        view.bombMe = null;
        view.bombCoins = 0;
        view.bombLoading = true;
        view.bombError = null;
        view.bombBusy = false;
        view.bombPreview = null;
        view.bombTarget = null;
        view.bombDrawn = null;
        view.bombBoom = null;
        view.bombFuture = [];
        view.bombFutureOpen = false;
        unmountBombOverlays();
        setBackButton(true);
        renderBomb();
        loadBombState(false);
}

      function applyBombData(data) {
        view.bombState = data.state || null;
        view.bombMe = data.me || null;
        view.bombCoins = Number(data.coins) || 0;
        var future = (data.me && data.me.future_cards) || [];
        if (future.length) view.bombFuture = future;
        if (data.state && data.state.status === "FINISHED") stopBombPolling();
}

      async function loadBombState(silent) {
        if (!view.bombCode || view.mode !== "bomb") return;
        var requested = view.bombCode;
        if (!silent) {
          view.bombLoading = true;
          renderBomb();
}
        try {
          var data = await request(
            "/api/bomb/" + encodeURIComponent(requested) +
            "?user_id=" + encodeURIComponent(profile.id) +
            "&name=" + encodeURIComponent(profile.name || "")
          );
          if (view.bombCode !== requested || view.mode !== "bomb") return;
          applyBombData(data);
          view.bombLoading = false;
          view.bombError = null;
          renderBomb();
          startBombPolling();
        } catch (error) {
          if (view.bombCode !== requested || view.mode !== "bomb") return;
          view.bombLoading = false;
          view.bombError = error.message || "Bomba xonasini yuklab bölmadi";
          renderBomb();
}

      async function createBombRoom() {
        if (view.bombBusy) return;
        view.bombBusy = true;
        try {
          var data = await request("/api/bomb/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ user_id: Number(profile.id) || 0, name: profile.name || "Öyinçi" })
          });
          view.bombEntry = false;
          enterBomb(data.state.code);
          toast("Bomba xonasi oçildi!");
          haptic("success");
        } catch (error) {
          toast(error.message || "Xona oçib bölmadi", "error");
        } finally {
          view.bombBusy = false;
}

      async function bombPost(action, payload, successMessage) {
        if (!view.bombCode || view.bombBusy) return;
        view.bombBusy = true;
        renderBomb();
        try {
          var body = Object.assign({
            user_id: Number(profile.id) || 0,
            name: profile.name || "Öyinçi"
          }, payload || {});
          var data = await request(
            "/api/bomb/" + encodeURIComponent(view.bombCode) + "/" + action,
            {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
}
          );
          applyBombData(data);
          var result = data.action;
          if (result && result.kind === "draw") {
            if (result.exploded) {
              view.bombBoom = result;
              view.bombDrawn = null;
              haptic("error");
            } else {
              view.bombDrawn = result;
              if (result.defused) haptic("success");
}
            if (result.winner_id && Number(result.winner_id) === Number(profile.id)) {
              haptic("success");
}
          } else if (result) {
            if (result.future_cards && result.future_cards.length) {
              view.bombFuture = result.future_cards;
              view.bombFutureOpen = true;
}
            haptic("success");
}
          view.bombPreview = null;
          view.bombTarget = null;
          if (successMessage) toast(successMessage);
          if (data.state && data.state.status !== "FINISHED") startBombPolling();
        } catch (error) {
          toast(error.message || "Harakat bajarilmadi", "error");
        } finally {
          view.bombBusy = false;
          renderBomb();
}

      function bombPlay() {
        var hand = (view.bombMe && view.bombMe.hand) || [];
        var index = Number(view.bombPreview);
        var type = hand[index];
        if (!type) {
          toast("Karta tanlanmadi", "error");
          return;
}
        if (BOMB_ACTION_TYPES.indexOf(type) < 0) {
          toast(type === "DEFUSE" ? "Zararsizlantiriş bomba chiqqanda avtomatik işlaydi" : "Bu kartani qöldan öynab bömaydi", "error");
          return;
}
        var payload = { card_type: type };
        if (type === "STEAL") {
          if (view.bombTarget == null) {
            toast("Öğirlaş uçun raqibni tanlang", "error");
            return;
}
          payload.target_id = Number(view.bombTarget);
}
        bombPost("play", payload, "");
}

      function bombDrawnHtml() {
        var result = view.bombDrawn;
        if (!result || !result.card) return "";
        var card = result.card;
        var note = result.defused
          ? "Bomba chiqdi, lekin Zararsizlantiriş uni qaytardi. Bomba yana dastada!"
          : "Karta qölingizga qöşildi. Navbatni tugatish uçun karta tortishda davom eting.";
        return '<section class="bomb-sheet" role="dialog" aria-modal="true">' +
          '<div class="bomb-sheet-head"><div><h2>' + esc(card.symbol || "") + ' ' + esc(card.name) + '</h2>' +
            '<p>' + (result.defused ? "Zararsizlantirildi" : "Yangi karta") + '</p></div></div>' +
          '<div class="bomb-preview-card">' + bombFaceHtml(card.type) + '</div>' +
          '<p class="bomb-ability">' + esc(note) + '</p>' +
          '<button class="bomb-hold-btn" data-act="bomb-drawn-close">Davom etiş</button>' +
        '</section>';
}

      function bombBoomHtml() {
        var result = view.bombBoom;
        if (!result) return "";
        var mine = Number(result.eliminated_id) === Number(profile.id);
        return '<div class="bomb-boom-overlay" role="alertdialog" aria-modal="true">' +
          '<div><div class="boom">💥</div><h2>PORTLASH!</h2>' +
          '<p>' + (mine ? "Qölingizda Zararsizlantiriş böğildi. Siz öyindan çiqdingiz!" :
            esc(bombPlayerName(view.bombState || {}, result.eliminated_id)) + " portladi va öyindan çiqdi.") + '</p>' +
          '<button class="btn primary" data-act="bomb-boom-close">Davom etiş</button></div>' +
        '</div>';
}

      function bombTopbarHtml(code) {
        return '<div class="topbar"><button class="icon-btn" data-act="exit-room" aria-label="Çiqiş">' + icon("arrow-left") + '</button>' +
          '<div class="room-id"><span class="room-code">' + esc(code) + '</span></div>' +
          exitRoomButtonHtml() + '</div>';
}

      function bombSkeleton(layout, code) {
        var slots = layout === "table"
          ? '<div data-slot="head"></div><div data-slot="players"></div><div data-slot="table"></div>' +
            '<div data-slot="hand"></div><div data-slot="controls"></div><div data-slot="result"></div>'
          : '<div data-slot="body"></div>';
        return '<main class="fade bomb-room">' + bombTopbarHtml(code) + slots + '</main>';
}

      function bombOverlayHost() {
        if (view.bombOverlayHost && document.body.contains(view.bombOverlayHost)) {
          return view.bombOverlayHost;
}
        var host = document.createElement("div");
        host.id = "bomb-overlays";
        host.innerHTML = '<div class="bomb-backdrop"></div><div class="bomb-overlay-body"></div>';
        document.body.appendChild(host);
        view.bombOverlayHost = host;
        view.bombOverlaySig = "";
        return host;
}

      function unmountBombOverlays() {
        if (view.bombOverlayHost && view.bombOverlayHost.parentNode) {
          view.bombOverlayHost.parentNode.removeChild(view.bombOverlayHost);
}
        view.bombOverlayHost = null;
        view.bombOverlaySig = "";
        view.bombLayout = null;
        view.bombPainted = {};
}

      function renderBombOverlays() {
        if (view.mode !== "bomb") return;
        var host = bombOverlayHost();
        var html = (view.bombBoom ? bombBoomHtml() : "") +
          bombPreviewHtml(view.bombMe) + bombFutureHtml() + bombDrawnHtml();
        if (html !== view.bombOverlaySig) {
          view.bombOverlaySig = html;
          host.querySelector(".bomb-overlay-body").innerHTML = html;
          refreshLucide();
}
        if (html) host.classList.add("open");
        else host.classList.remove("open");
}

      function renderBomb() {
        if (view.mode !== "bomb") return;
        var code = view.bombCode || view.code || "";
        var state = view.bombState;
        var me = view.bombMe;
        var layout = !state ? "empty" : (state.status === "LOBBY" ? "lobby" : "table");
        var rebuild = layout !== view.bombLayout;
        if (rebuild) {
          view.bombLayout = layout;
          view.bombPainted = {};
          app.innerHTML = bombSkeleton(layout, code);
}
        var parts;
        if (layout === "table") {
          parts = bombTableParts(state, me);
        } else if (layout === "lobby") {
          parts = { body: bombLobbyHtml(state) };
        } else if (view.bombError) {
          parts = { body: '<section class="state-screen fade"><div class="emoji">💣</div><h2>Xona topilmadi</h2><p>' +
            esc(view.bombError) + '</p><button class="btn primary" data-act="bomb-reload">Qayta uriniş</button>' +
            '<button class="btn block" data-act="home" style="margin-top:8px">Hubga qaytiş</button></section>' };
        } else if (view.bombLoading) {
          parts = { body: '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>' };
        } else {
          parts = { body: '<div class="skeleton"></div>' };
}
        var painted = false;
        Object.keys(parts).forEach(function (slot) {
          var node = app.querySelector('[data-slot="' + slot + '"]');
          if (!node) return;
          if (view.bombPainted[slot] === parts[slot]) return;
          view.bombPainted[slot] = parts[slot];
          node.innerHTML = parts[slot];
          painted = true;
        });
        if (painted || rebuild) refreshLucide();
        renderBombOverlays();
}

      // Xona
      // ----------------------------------------------------------------
      function enterRoom(code) {
        unmountBombOverlays();
        view.lastRoomHtml = null;
        view.code = normalizeCode(code);
        view.loading = true;
        view.error = null;
        view.room = null;
        view.me = null;
        view.notified = {};
        view.flipKey = null;
        if (view.flipTimer) {
          clearTimeout(view.flipTimer);
          view.flipTimer = null;
}
        stopTimer();
        setBackButton(true);
        renderLoading();
        loadRoomData(false);
        mountChat();
        connectSocket();
        startPolling();
}

      function goHome() {
        stopBombPolling();
        unmountBombOverlays();
        unmountChat();
        stopLive();
        stopTimer();
        if (view.flipTimer) {
          clearTimeout(view.flipTimer);
          view.flipTimer = null;
}
        window.location.href = window.location.pathname;
}

      function setBackButton(visible) {
        if (!tg || !tg.BackButton) return;
        try {
          if (visible) tg.BackButton.show(); else tg.BackButton.hide();
        } catch (err) { /* eski Telegram versiyalari */ }
}

      function exitRoomButtonHtml() {
        return '<button class="exit-room-btn" data-act="exit-room" aria-label="Öyinden çiqiş">' +
          '<span aria-hidden="true">🚪</span> Çiqiş</button>';
}

      function askConfirm(message, onOk) {
        try {
          if (tg && typeof tg.showConfirm === "function") {
            tg.showConfirm(message, function (ok) { if (ok) onOk(); });
            return;
}
        } catch (err) { /* eski Telegram */ }
        try {
          if (window.confirm(message)) onOk();
        } catch (err) { onOk(); }
}

      function confirmExitRoom() {
        if (!view.code) {
          setBackButton(false);
          goHome();
          return;
}
        askConfirm("Haqiqatan ham öyinni tark etmoqchimisiz?", leaveRoomAndGoHome);
}

      function leaveRoomAndGoHome() {
        unmountBombOverlays();
        stopBombPolling();
        unmountChat();
        stopLive();
        stopTimer();
        stopMafiaClock();
        stopSpyClock();
        if (view.mafiaTimer) { clearTimeout(view.mafiaTimer); view.mafiaTimer = null; }
        if (view.spyTimer) { clearTimeout(view.spyTimer); view.spyTimer = null; }
        view.code = "";
        view.room = null;
        view.me = null;
        view.loading = false;
        view.error = null;
        view.lastRoomSig = null;
        view.lastMeSig = null;
        view.lastRoomHtml = null;
        view.bombCode = "";
        view.bombState = null;
        view.bombMe = null;
        view.bombPreview = null;
        view.bombDrawn = null;
        view.bombBoom = null;
        view.bombFuture = [];
        view.bombFutureOpen = false;
        view.bombError = null;
        view.bombLoading = false;
        view.mafia = null;
        view.mafiaState = null;
        view.mafiaError = null;
        view.spy = null;
        view.spyState = null;
        view.spyError = null;
        view.mode = "bunker";
        setBackButton(false);
        try { history.replaceState(null, "", window.location.pathname); } catch (err) { /* ignore */ }

}

      function renderLoading() {
        app.innerHTML =
          '<div class="topbar"><button class="icon-btn" data-act="home">' + icon("arrow-left") + '</button>' +
            '<div class="room-id"><span class="room-code">' + esc(view.code) + '</span></div></div>' +
          '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
}

      function renderRoomError(error) {
        app.innerHTML =
          '<div class="state-screen fade">' +
            '<div class="emoji">' + icon("map-pin") + '</div>' +
            '<h2>Xona topilmadi</h2>' +
            '<p>' + esc(error && error.message ? error.message : "Xona mavjud emas yoki kodi xato.") + '</p>' +
            '<button class="btn primary" data-act="home">Boş sahifaga qaytiş</button>' +
          '</div>';
}

      async function loadRoomData(silent) {
        try {
          var roomData = await fetchRoom(view.code);
          var meData = null;
          try {
            meData = await fetchMe(view.code);
          } catch (meError) {
            if (meError.status !== 404) throw meError;
}
          view.loading = false;
          view.error = null;
          var room = roomData.state;
          var me = meData ? meData.me : null;
          var roomSig = JSON.stringify(room);
          var meSig = JSON.stringify(me);
          var changed = roomSig !== view.lastRoomSig || meSig !== view.lastMeSig;
          if (changed) announceTransitions(view.room, room);
          view.room = room;
          view.me = me;
          view.lastRoomSig = roomSig;
          view.lastMeSig = meSig;
          if (changed || !silent) renderRoom(true);
        } catch (error) {
          view.loading = false;
          if (silent && view.room) {
            return;
}
          view.error = error;
          renderRoomError(error);
}

      function renderRoom(keepScroll) {
        if (!view.room) return;
        var room = view.room;
        var scrollY = keepScroll ? window.scrollY : 0;
        var me = view.me;
        var status = room.status;
        var players = room.players || [];
        var alive = players.filter(function (player) { return player.is_alive; });
        var myVoteTarget = view.selected;

        var html = '<div class="topbar">' +
          '<button class="icon-btn" data-act="exit-room" aria-label="Orqaga">' + icon("arrow-left") + '</button>' +
          '<div class="room-id"><span class="room-code">' + esc(room.code) + '</span>' +
            '<span class="status-pill ' + statusClass(status) + '">' + esc(STATUS_LABELS[status] || status) + '</span></div>' +
          '<div class="round-chip">' + (room.current_round ? "Raund " + room.current_round : "Lobby") + '</div>' +
          timerHtml(room) +
          exitRoomButtonHtml() +
        '</div>';

        html += catastropheHtml(room);

        if (status === "FINISHED") {
          html += finishedHtml(room);
          noteGameEnd(
            "bunker:" + room.code,
            status,
            me ? me.is_alive : true,
            buildMvpPayload("Bunker", room, players, room.winner || "Bunker yakunlandi")
          );
}

        if (!me && status === "LOBBY") {
          html += joinRoomHtml(room);
        } else if (!me) {
          html += '<div class="notice">⏳ Öyin allaqaçon boşlangan. Siz kuzatuvçisiz — keyingi öyinni kuting.</div>';
}

        if (me) {
          html += myCardsHtml(me, status);
}

        html += playersHtml(room, me);
        html += controlsHtml(room, me, alive);

        html += '<div class="footer">Revilend Games · Xona ' + esc(room.code) + '</div>';

        if (view.lastRoomHtml === html) {
          ensureTimer(room);
          return;
}
        view.lastRoomHtml = html;
        var shell = app.querySelector('[data-room-shell]');
        if (!shell) {
          app.innerHTML = '<main class="fade" data-room-shell></main>';
          shell = app.querySelector('[data-room-shell]');
          shell.innerHTML = html;
        } else {
          patchElementChildren(shell, html);
}
        if (keepScroll) window.scrollTo(0, scrollY);
        ensureTimer(room);
}

      function catastropheHtml(room) {
        var cat = room.catastrophe || {};
        var supplies = listify(cat.bunker_supplies);
        var requirements = listify(cat.survival_requirements);
        return '<section class="catastrophe">' +
          '<div class="cat-eye">' + icon("radiation") + ' Falokat</div>' +
          '<h1>' + esc(cat.name || "Noma'lum falokat") + '</h1>' +
          '<p>' + esc(cat.description || "") + '</p>' +
          '<div class="cat-grid">' +
            '<div class="cat-block"><h4>' + icon("bag") + ' Bunker zaxirasi</h4>' + listHtml(supplies) + '</div>' +
            '<div class="cat-block"><h4>' + icon("check") + ' Omon qoliş</h4>' + listHtml(requirements) + '</div>' +
          '</div>' +
          '<div class="stat-row">' +
            '<div class="stat"><b>' + (room.alive_count != null ? room.alive_count : 0) + '</b><span>tirik</span></div>' +
            '<div class="stat"><b>' + esc(room.bunker_capacity) + '</b><span>siğim</span></div>' +
            '<div class="stat"><b>' + (room.players ? room.players.length : 0) + '/' + esc(room.max_players) + '</b><span>öyinçi</span></div>' +
          '</div>' +
        '</section>';
}

      function listHtml(items) {
        if (!items.length) return '<p class="muted tiny">Ma\'lumot yöq</p>';
        return '<ul>' + items.map(function (item) {
          return '<li>' + esc(item) + '</li>';
        }).join("") + '</ul>';
}

      function epilogueText(room, survivors) {
        var catastrophe = (room.catastrophe && room.catastrophe.name) || "falokat";
        var count = survivors.length;
        var capacity = room.bunker_capacity || 0;
        var first;
        if (!count) {
          first = "Bunker eşigi heç kim omon qolmasdan yopildi va " + catastrophe +
            " taşqarida hamma narsani yutib yubordi.";
        } else if (count >= capacity) {
          first = "Bunker eşigi oğir metall ovoz bilan yopildi; " + catastrophe +
            " taşqarida qoldi. Içkarida " + count + " kişi omon qoldi va ajratilgan joy töliq yetdi.";
        } else {
          first = "Bunker eşigi oğir metall ovoz bilan yopildi va " + catastrophe +
            " taşqarida qoldi. Içkarida " + count + " kişi omon qoldi, ammo böş joylar endi heç qaçon tölmaydi.";
}
        var second = count
          ? "Ular zaxiralarni bölişib, yangi jamiyat uçun birinçi qadamni qöydi; insoniyatning taqdiri endi şu hovuç odamning qölida."
          : "Insoniyatning sönggi umidi ham söndi; bu falokat tarixda eng oğir saboq bölib qoldi.";
        return first + " " + second;
}

      function finishedHtml(room) {
        var survivors = (room.players || []).filter(function (player) { return player.is_alive; });
        var survivorChips = survivors.map(function (player) {
          return '<div class="survivor">' + avatarHtml(player.full_name, player.user_id) +
            esc(player.full_name) + '</div>';
        }).join("");
        return '<section class="epilogue fade">' +
          '<div class="door-scene">' +
            '<div class="door"><div class="door-wheel"></div></div>' +
            '<div class="door-light"></div>' +
          '</div>' +
          '<div class="epilogue-body">' +
            '<p class="epilogue-kicker">Bunker eşigi yopildi</p>' +
            '<h2>Omon qolgan qahramonlar</h2>' +
            (survivorChips
              ? '<div class="survivors">' + survivorChips + '</div>'
              : '<p class="muted" style="margin-bottom:14px">Heç kim omon qolmadi.</p>') +
            '<p class="epilogue-text">' + esc(epilogueText(room, survivors)) + '</p>' +
            '<div class="epilogue-stats">' +
              '<span>' + icon("radiation") + ' ' + esc((room.catastrophe && room.catastrophe.name) || "Falokat") + '</span>' +
              '<span>' + icon("users") + ' ' + survivors.length + ' / ' + esc(room.bunker_capacity) + ' omon qoldi</span>' +
            '</div>' +
          '</div>' +
        '</section>' +
        '<div class="notice">' + icon("sparkles") + ' Bu öyin yakunlandi. Yangi öyin oçiş uçun guruhda /bunker yuboring.</div>';
}

      function joinRoomHtml(room) {
        var needName = !profile.name;
        return '<section class="join-room">' +
          '<h2>Xonaga qöşiliş</h2>' +
          '<p class="muted">Hozir ' + (room.players ? room.players.length : 0) + ' öyinçi bor. Öyin boşlanmagunça qöşilişingiz mumkin.</p>' +
          '<form id="room-join-form">' +
            (needName ? '<input id="guest-name" type="text" maxlength="40" placeholder="Ismingiz" aria-label="Ismingiz" />' : '') +
            '<button type="submit" class="btn primary block">Xonaga qöşiliş</button>' +
          '</form>' +
        '</section>';
}

      function flipCardHtml(key, card, meta) {
        return '<div class="flip-card">' +
          '<div class="flip-inner">' +
            '<div class="flip-face flip-back">' +
              '<span class="lock-big">' + icon("lock") + '</span>' +
              '<span class="flip-hint">' + esc(meta.label) + ' oçilmoqda</span>' +
            '</div>' +
            '<div class="flip-face flip-front">' +
              '<div class="card-top"><span class="emoji">' + icon(meta.icon) + '</span>' + esc(meta.label) + '</div>' +
              '<h3>' + esc(card.title) + '</h3>' +
              '<p>' + esc(card.description) + '</p>' +
              '<span class="revealed-stamp">OÇILDI</span>' +
            '</div>' +
          '</div>' +
        '</div>';
}

      function myCardsHtml(me, status) {
        var cards = me.cards || {};
        var keys = CARD_ORDER.filter(function (key) { return cards[key]; });
        var revealed = keys.filter(function (key) { return cards[key].is_revealed; }).length;

        if (!keys.length) {
          return '<section><div class="block-head"><h2>Mening kartalarim</h2><span>0/0</span></div>' +
            '<div class="notice">' + icon("card") + ' Öyin boşlanganda şaxsiy kartalaringiz tarqatiladi.</div></section>';
}

        return '<section><div class="block-head"><h2>Mening kartalarim</h2>' +
          '<span>' + revealed + '/' + keys.length + ' oçilgan</span></div>' +
          '<div class="cards-grid">' + keys.map(function (key) {
            var card = cards[key];
            var meta = cardMeta(key);
            if (card.is_revealed) {
              if (view.flipKey === key) {
                return flipCardHtml(key, card, meta);
}
              return '<article class="card revealed">' +
                '<div class="card-top"><span class="emoji">' + icon(meta.icon) + '</span>' + esc(meta.label) + '</div>' +
                '<h3>' + esc(card.title) + '</h3>' +
                '<p>' + esc(card.description) + '</p>' +
                '<span class="revealed-stamp">OÇILDI</span>' +
              '</article>';
}
            var canReveal = status === "PLAYING" || status === "VOTING";
            return '<article class="card">' +
              '<div class="card-top"><span class="emoji">' + icon(meta.icon) + '</span>' + esc(meta.label) + '</div>' +
              '<div class="card-lock">' + icon("lock") + '<small>Yopiq</small></div>' +
              (canReveal
                ? '<button class="btn small" data-act="reveal" data-card="' + esc(key) + '">Oçiş</button>'
                : '<p class="muted tiny" style="text-align:center">Öyin boşlanişini kuting</p>') +
            '</article>';
          }).join("") + '</div></section>';
}

      function playerAvatarHtml(player) {
        var badge = player.votes_against > 0
          ? '<span class="vote-badge' + (player.votes_against >= 2 ? " hot" : "") + '">' +
            player.votes_against + '</span>'
          : "";
        return '<div class="avatar-wrap ' + (player.is_alive ? "" : "eliminated") + '">' +
          avatarHtml(player.full_name, player.user_id, "sm") + badge + '</div>';
}

      function playersHtml(room, me) {
        var players = (room.players || []).slice().sort(function (a, b) {
          if (a.is_alive !== b.is_alive) return a.is_alive ? -1 : 1;
          return b.votes_against - a.votes_against;
        });

        return '<section><div class="block-head"><h2>Bunker stoli</h2>' +
          '<span>' + (room.players || []).length + ' öyinçi</span></div>' +
          '<div class="players">' + players.map(function (player) {
            var badges = "";
            if (player.is_host) badges += '<span class="badge host">HOST</span>';
            if (player.is_me) badges += '<span class="badge me">SIZ</span>';
            var revealedCards = Object.keys(player.revealed_cards || {}).sort(function (a, b) {
              return CARD_ORDER.indexOf(a) - CARD_ORDER.indexOf(b);
            });
            var chips = revealedCards.map(function (key) {
              var card = player.revealed_cards[key];
              var meta = cardMeta(key);
              return '<span class="chip" title="' + esc(card.description) + '">' +
                icon(meta.icon) + " " + esc(card.title) + '</span>';
            }).join("");
            if (!chips && player.is_alive) {
              chips = '<span class="muted tiny">' + icon("lock") + ' Kartalar hali yopiq</span>';
}
            var meta = [];
            meta.push(player.is_alive ? "Tirik" : "Haydalgan");
            if (player.votes_against) meta.push(icon("ballot") + " " + player.votes_against + " ovoz");
            if (player.hidden_count && player.is_alive) meta.push(icon("lock") + " " + player.hidden_count + " yopiq");

            return '<div class="player ' + (player.is_alive ? "" : "dead") + '">' +
              playerAvatarHtml(player) +
              '<div class="p-body">' +
                '<div class="p-name">' + esc(player.full_name) + badges + '</div>' +
                '<div class="p-meta">' + meta.map(function (text) { return '<span>' + text + '</span>'; }).join("") + '</div>' +
                '<div class="chips">' + chips + '</div>' +
              '</div>' +
            '</div>';
          }).join("") + '</div></section>';
}

      function boosterPanelHtml(me) {
        var cards = me.cards || {};
        var options = CARD_ORDER.filter(function (key) {
          return cards[key] && !cards[key].is_revealed;
        }).map(function (key) {

        return parts;

      function connectSocket() {
        if (!view.code) return;
        stopSocket();
        var protocol = window.location.protocol === "https:" ? "wss" : "ws";
        var socket;
        try {
          var wsUrl = protocol + "://" + window.location.host + "/ws/" + encodeURIComponent(view.code);
          var chatUserId = (view.me && view.me.id) || (profile && profile.id);
          if (chatUserId) wsUrl += "?user_id=" + encodeURIComponent(String(chatUserId));
          socket = new WebSocket(wsUrl);
        } catch (err) {
          view.wsTimer = setTimeout(connectSocket, 4000);
          return;
}
        view.ws = socket;

        socket.onmessage = function (event) {
          var message;
          try { message = JSON.parse(event.data); } catch (err) { return; }
          if (message.type === "chat-history") {
            onChatHistory(message.messages);
            applyChatLock(message.locked);
            return;
}
          if (message.type === "reaction") {
            showReaction(message);
            return;
}
          if (message.type === "chat") {
            onChatMessage(message.message || message);
            return;
}
          if (message.type === "chat-error") {
            chatError(message);
            return;
}
          if (message.type === "state" && message.state) {
            applyRemoteRoom(message.state);
}
        };
        socket.onopen = function () {
          flushChatOutbox();
        };
        socket.onclose = function () {
          if (view.ws === socket) view.ws = null;
          if (view.code) {
            view.wsTimer = setTimeout(connectSocket, 4000);
}
        };
        socket.onerror = function () {
          try { socket.close(); } catch (err) { /* ignore */ }
        };
}

      function stopSocket() {
        if (view.wsTimer) {
          clearTimeout(view.wsTimer);
          view.wsTimer = null;
}
        if (view.ws) {
          var socket = view.ws;
          view.ws = null;
          try { socket.close(); } catch (err) { /* ignore */ }
}

      function startPolling() {
        stopPolling();
        view.pollTimer = setInterval(function () {
          if (view.code && !view.busy) loadRoomData(true);
        }, 5000);
}

      function stopPolling() {
        if (view.pollTimer) {
          clearInterval(view.pollTimer);
          view.pollTimer = null;
}

      function stopLive() {
        stopSocket();
        stopPolling();
}

      function applyRemoteRoom(room) {
        if (!room || room.code !== view.code) return;
        var sig = JSON.stringify(room);
        if (sig === view.lastRoomSig) return;
        announceTransitions(view.room, room);
        view.room = room;
        view.lastRoomSig = sig;
        if (room.status !== "PLAYING" && room.status !== "VOTING") view.selected = null;
        renderRoom(true);
}

      // ----------------------------------------------------------------
      // Harakatlar
      // ----------------------------------------------------------------
      async function sendAction(payload, successMessage) {
        if (view.busy) return;
        view.busy = true;
        var flipKey = payload.action === "reveal" ? payload.card_type : null;
        if (flipKey) {
          if (view.flipTimer) {
            clearTimeout(view.flipTimer);
            view.flipTimer = null;
}
          view.flipKey = flipKey;
}
        try {
          var data = await postAction(view.code, payload);
          var announced = announceTransitions(view.room, data.state);
          if (data.coins != null) profile.balance = Number(data.coins) || 0;
          view.room = data.state;
          view.me = data.me;
          view.lastRoomSig = JSON.stringify(data.state);
          view.lastMeSig = JSON.stringify(data.me);
          if (payload.action === "vote" || payload.action === "tally") view.selected = null;
          renderRoom(true);

          if (flipKey) {
            haptic("heavy");
            view.flipTimer = setTimeout(function () {
              if (view.flipKey !== flipKey) return;
              view.flipKey = null;
              view.flipTimer = null;
              renderRoom(true);
            }, 900);
}

          if (data.result && data.result.tie) {
            toast("Ovozlar teng — heç kim haydalmadi");
          } else if (data.result && data.result.eliminated && !announced) {
            toast(data.result.eliminated.full_name + " haydaldi", "error");
          } else if (successMessage) {
            toast(successMessage);
}
        } catch (error) {
          if (flipKey && view.flipKey === flipKey) view.flipKey = null;
          toast(error.message || "Xatolik yuz berdi", "error");
          if (error.status === 404) loadRoomData(false);
        } finally {
          view.busy = false;
}

}
          enterSpy(spyValue);
          return;
}
        if (event.target.id === "join-form") {

          if (!/^[A-Z0-9]{6}$/.test(code)) {
            toast("Xona kodi 6 belgidan iborat bölişi kerak", "error");
            return;
}
          if (/^MAF\d{3}$/.test(code)) {
            enterMafia(code);
            return;
}
          if (/^SPY\d{3}$/.test(code)) {
            enterSpy(code);
            return;
}
          if (/^BMB\d{3}$/.test(code)) {
            enterBomb(code);
            return;
}
          window.location.href = window.location.pathname + "?room=" + encodeURIComponent(code);
        } else if (event.target.id === "room-join-form") {
          event.preventDefault();
          joinRoom();
}

        var key = event.key;
        if (key === "Escape" || key === "Esc") {
          if (view.shopOpen || view.wheelOpen || view.tournamentOpen || view.mvp || document.querySelector(".mvp-overlay")) {
            closeAllOverlays();
          }
          event.stopPropagation();
        }
      });
// ----------------------------------------------------------------
      // Ishga tushirish
      // ----------------------------------------------------------------
      app.addEventListener("click", handleClick);
      app.addEventListener("click", onOverlayClick);
      app.addEventListener("submit", handleSubmit);
      app.addEventListener("change", function (event) {
        if (!event.target) return;
        if (event.target.id === "mafia-night-kind") {
          view.mafiaActionKind = event.target.value;
          view.mafiaActionTarget = null;
          renderMafia();
        } else if (event.target.id === "mafia-night-target") {
          view.mafiaActionTarget = Number(event.target.value);
        } else if (event.target.id === "mafia-kamikaze-target") {
          view.mafiaKamikazeTarget = event.target.value
            ? Number(event.target.value)
            : null;
}
      });
      app.addEventListener("click", function (event) {
        var button = event.target.closest("button");
        if (button && !button.disabled) haptic("medium");
      }, true);

      if (tg) {
        try {
          tg.ready();
          tg.expand();
          if (tg.BackButton) {
            tg.BackButton.onClick(function () {
              haptic("medium");
              if (view.shopOpen || view.wheelOpen || view.tournamentOpen || view.mvp || document.querySelector(".mvp-overlay")) {
                closeAllOverlays();
                return;
              }

              if (!view.code) {
                setBackButton(false);
                return;
}
              confirmExitRoom();
            });
}
          if (tg.onEvent) {
            tg.onEvent("themeChanged", applyTelegramTheme);
            tg.onEvent("viewportChanged", function () {
              if (tg.isExpanded === false) tg.expand();
            });
}
        } catch (err) { /* eski versiya */ }
        applyTelegramTheme();
}

      function toNewAlphabet(text) {
        if (!text) return text;
        return text
          .replace(/o['\u2018\u2019\u02BB]/g, function (m) {
            return m[0] === 'O' ? '\u00d6' : '\u00f6';
          })
          .replace(/O['\u2018\u2019\u02BB]/g, '\u00d6')
          .replace(/g['\u2018\u2019\u02BB]/g, '\u011f')
          .replace(/G['\u2018\u2019\u02BB]/g, '\u011e')
          .replace(/sh/g, '\u015f')
          .replace(/Sh/g, '\u015e')
          .replace(/SH/g, '\u015e')
          .replace(/ch/g, '\u00e7')
          .replace(/Ch/g, '\u00c7')
          .replace(/CH/g, '\u00c7');
}

      // Alifbo almashtirish faqat matn tugunlarida bajariladi: elementning
      // textContent'ini yozish ichki teglarni (tugma, ikona) o'chirib yuboradi.
      var ORTHO_SKIP_TAGS = { SCRIPT: 1, STYLE: 1, CODE: 1, PRE: 1, TEXTAREA: 1 };

      function localizeTextNode(node) {
        if (!node || node.nodeType !== Node.TEXT_NODE) return;
        var current = node.textContent;
        if (!current) return;
        var next = toNewAlphabet(current);
        // Almashtirish idempotent: matn teng bo'lsa qayta yozilmaydi va
        // kuzatuvchi cheksiz aylanmaydi.
        if (next !== current) node.textContent = next;
}

      function localizeSubtree(node) {
        if (!node) return;
        if (node.nodeType === Node.TEXT_NODE) {
          localizeTextNode(node);
          return;
}
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (ORTHO_SKIP_TAGS[node.tagName]) return;
        for (var i = 0; i < node.childNodes.length; i += 1) {
          localizeSubtree(node.childNodes[i]);
}

      function startOrthographyObserver() {
        if (!window.MutationObserver || !document.body) return;
        localizeSubtree(document.body);
        var observer = new MutationObserver(function (mutations) {
          for (var i = 0; i < mutations.length; i += 1) {
            var mutation = mutations[i];
            if (mutation.type === "characterData") {
              localizeTextNode(mutation.target);
              continue;
}
            for (var j = 0; j < mutation.addedNodes.length; j += 1) {
              localizeSubtree(mutation.addedNodes[j]);
}
        });
        observer.observe(document.body, {
          childList: true,
          subtree: true,
          characterData: true
        });
}

      async function boot() {
        if (!profile || !profile.authenticated) {
          renderLoginScreen();
          return;
}
        var routeCode = view.code;
        renderHubSkeleton();
        var ready = await loadHubData();
        if (!ready || !profile.authenticated) return;
        renderHub();
        if (initialBombCode) {
          enterBomb(initialBombCode);
        } else if (initialSpyCode) {
          enterSpy(initialSpyCode);
        } else if (initialMafiaCode) {
          enterMafia(initialMafiaCode);
        } else if (routeCode) {
          if (/^SPY\d{3}$/.test(routeCode)) enterSpy(routeCode);
          else if (/^BMB\d{3}$/.test(routeCode)) enterBomb(routeCode);
          else enterRoom(routeCode);
}

      startOrthographyObserver();
      boot();
    })();
  </script>
</body>
</html>
